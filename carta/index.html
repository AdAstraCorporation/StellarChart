<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Astra · Carta de Navegación Estelar</title>
<link rel="icon" href="../icons/favicon.png" type="image/png"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#060708">
<meta name="description" content="Simulador de rol espacial: carta estelar generativa e infinita por semillas, nave, tripulación, expediciones y eventos.">
<style>
:root{--bg:#060708;--panel:rgba(10,12,16,.86);--line:rgba(205,215,235,.16);--tx:#d6dce6;--dim:#6f7a8c;--cy:#78dcff;--amb:#e0aa46;--pet:#ff3b5c;--ok:#7ee787;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(14,18,26,.8);border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer;letter-spacing:.06em;transition:border-color .15s,background .15s,color .15s,transform .1s}
button:hover:not(:disabled){border-color:rgba(205,215,235,.5)}button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{border-color:var(--cy);color:var(--cy)}button.pri:hover:not(:disabled){background:rgba(120,220,255,.12)}
button.sm{padding:3px 8px;font-size:11px}
input,select,textarea{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:2px;padding:5px 8px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--cy)}
input[type=color]{padding:1px;height:28px;width:60px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ov{position:absolute;z-index:2}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
/* cabecera estilo carta */
#brand{left:18px;top:16px;max-width:330px}
#brand .aalogo{width:22px;height:22px;vertical-align:-5px;margin-right:6px;border-radius:50%}
.crewlogo{display:block;max-width:120px;max-height:56px;margin:8px 0 2px;object-fit:contain}
.pt img{width:100%;height:100%;object-fit:cover}
.dm{position:fixed;left:18px;top:220px;width:min(380px,92vw);max-height:55vh;z-index:8;background:rgba(8,10,14,.96);border:1px solid rgba(224,170,70,.6);display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dm.show{display:flex;animation:boxIn .2s ease}.dmh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:move;touch-action:none;font-size:11px;letter-spacing:.12em;color:var(--amb)}
.dmh span{display:flex;gap:4px}#dmL{overflow:auto;padding:6px 8px;font-size:11px;line-height:1.45}.dm.min #dmL{display:none}.dm.min{max-height:none}
.dmr{padding:2px 0;border-bottom:1px dashed rgba(205,215,235,.07);color:#cdd5e0}.dmr span{color:var(--dim)}.dm-ev{color:#ffd9a0}.dm-chat{color:#bfe8ff}.dm-cmd{color:#9fe8b0}
body.dual #drawerBtn{display:none}
@media(max-width:860px){#dualBtn{display:none}}
#brand .t1{display:block;font-size:15px;letter-spacing:.42em;color:#f2f5fb;text-decoration:none}#brand .t1:hover{color:var(--cy)}
#brand .t2{font-size:12px;letter-spacing:.08em;color:#c9d1dd;margin-top:2px}
#brand .t3{font-size:9px;letter-spacing:.24em;color:var(--dim);margin:3px 0 10px}
#seedForm{display:flex;gap:4px;margin-bottom:10px}
#seedIn{flex:1;text-transform:uppercase;letter-spacing:.14em;font-size:12px;width:190px}
#seedForm button{padding:4px 8px;font-size:11px}
.info{display:flex;flex-direction:column;gap:6px}
.info div{display:flex;flex-direction:column}.info span{font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}.info b{font-weight:400;font-size:13px;letter-spacing:.06em;color:#eef2f8}
#toggles{left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px}
#toggles button{font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:5px 12px;color:#8fa6c4;border-color:rgba(120,160,210,.35)}
#toggles button.on{color:#cfe6ff;border-color:rgba(160,200,255,.7);background:rgba(60,90,130,.25)}
#toggles button[data-o=pet].on{color:#ffd0d8;border-color:var(--pet);background:rgba(255,59,92,.18)}
#hud{right:18px;top:16px;width:200px;display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:right .3s ease}
#hud div{display:flex;flex-direction:column;text-align:right}
#hud span{font-size:9px;letter-spacing:.24em;color:var(--dim)}#hud b{font-weight:400;color:#eef2f8;font-size:12px}#hud em{font-style:normal;font-size:10px;color:var(--dim)}
.mt{display:block;height:3px;background:rgba(205,215,235,.12);margin:2px 0}.mt i{display:block;height:100%;transition:width .5s ease}
#views{left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:5px}
#views button{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;color:#c9d1dd;white-space:nowrap}#views button.on{border-color:var(--cy);color:var(--cy);background:rgba(120,220,255,.1)}
#foot{left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;letter-spacing:.24em;color:var(--dim);white-space:nowrap;pointer-events:none}
#foot em{color:var(--pet);font-style:normal;margin:0 6px}
#zoom{left:18px;bottom:28px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;height:32px;padding:0;font-size:15px}#zoom button.on{border-color:var(--cy);color:var(--cy)}
#ctr{right:18px;bottom:28px;font-size:10px;letter-spacing:.22em;padding:8px 14px;color:var(--cy);border-color:var(--cy);transition:right .3s ease}
#drawerBtn{right:18px;bottom:72px;font-size:10px;letter-spacing:.22em;padding:8px 14px;transition:right .3s ease}#drawerBtn.on{border-color:var(--amb);color:var(--amb)}
#backBtn{left:50%;top:50px;transform:translateX(-50%);display:none;font-size:10px;letter-spacing:.22em;padding:6px 14px}
#banner{left:62px;bottom:62px;color:var(--bad);font-size:10px;letter-spacing:.2em;display:none}#crTag{left:62px;bottom:46px;color:var(--amb);font-size:10px;letter-spacing:.2em;display:none}
#tip{pointer-events:none;background:rgba(6,8,12,.92);border:1px solid var(--line);padding:5px 9px;font-size:11px;display:none;white-space:nowrap}
#toast{left:50%;top:84px;transform:translateX(-50%);background:rgba(8,10,14,.94);border:1px solid rgba(120,220,255,.5);padding:8px 14px;display:none;max-width:min(560px,86%);z-index:4;text-align:center}
#toast.show{display:block;animation:boxIn .25s ease}#toast button{margin-left:8px}
#travel{left:50%;bottom:84px;transform:translateX(-50%);width:min(620px,80%);display:none;z-index:4;text-align:center}
#travel.show{display:block;animation:fadeIn .3s}
#travel .tl{font-size:10px;letter-spacing:.16em;color:#ffd0d8;margin-bottom:5px;text-shadow:0 0 8px #000}
#travel .tb{height:2px;background:rgba(255,255,255,.12)}#travel .tb i{display:block;height:100%;width:0;background:var(--pet)}
/* panel de mando (cajón) */
#drawer{position:absolute;right:0;top:0;bottom:0;width:390px;max-width:100%;z-index:5;background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s ease}
#drawer.open{transform:none}
@media(min-width:861px){#app:has(#drawer.open) #stage{right:390px}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding-left:9px!important;padding-right:9px!important;border:0;border-radius:0;background:none;padding:11px 2px;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:#fff;box-shadow:inset 0 -1px #fff}
#drawerX{flex:none!important;order:99;color:var(--tx)!important;font-size:13px!important;position:sticky;right:0;background:rgba(10,12,16,.95)!important;border-left:1px solid var(--line)!important}
.pane{display:none;padding:14px;overflow:auto;flex:1}.pane.on{display:block;animation:paneIn .28s ease both}
.kick{font-size:9px;letter-spacing:.28em;color:var(--dim);margin-bottom:2px}
h2{margin:0 0 6px;font-size:16px;font-weight:500;letter-spacing:.06em;color:#fff}
h3{margin:16px 0 6px;font-size:9px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-weight:400;border-top:1px solid var(--line);padding-top:10px}
.seed{letter-spacing:.14em;color:var(--amb);word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:6px 0}.kv span:nth-child(odd){color:var(--dim)}
.calc{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;border:1px solid var(--line);padding:9px;background:rgba(0,0,0,.35);margin:6px 0}.calc span:nth-child(odd){color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.lst{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:6px 8px;background:rgba(0,0,0,.25);transition:border-color .15s,transform .15s}
.item[data-a]{cursor:pointer}.item[data-a]:hover,.rowi:hover{border-color:rgba(205,215,235,.45)}
.item.col{flex-direction:column;align-items:stretch}.item.sel{border-color:var(--cy)}
.rowi{display:flex;gap:8px;align-items:center;cursor:pointer}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .m i{font-style:normal;color:var(--dim);font-size:11px;display:block}
.item.err{border-color:rgba(255,107,107,.6)}.item.pend{opacity:.5}.item.done b{color:var(--ok)}.item.cur{border-color:var(--amb)}.item.lock{opacity:.4}
.fav{color:var(--dim);background:none;border:0;padding:0 4px;font-size:15px}.fav.on{color:var(--amb)}
.note{color:var(--dim);font-size:11px;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.tag{display:inline-block;border:1px solid var(--line);padding:0 7px;font-size:10px;color:#c9d1dd;letter-spacing:.06em;margin:0 3px 3px 0}
.tag.pet{border-color:var(--pet);color:#ffb3c0}.tag.fx{border-color:var(--amb);color:var(--amb)}.tag.hz{border-color:var(--ok);color:var(--ok)}
.hzl{margin:4px 0}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:6px 0;cursor:pointer}
.res{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.res span:last-child{color:var(--dim)}
.scale-row{display:grid;grid-template-columns:120px 1fr 64px;gap:6px;align-items:center;font-size:11px;margin:3px 0}.scale-row span:last-child{text-align:right;color:var(--dim)}
.scale-row i{display:block;height:6px;background:rgba(205,215,235,.3)}.scale-row.me i{background:var(--cy)}.scale-row.me span{color:var(--cy)}
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ships button{padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;letter-spacing:.04em}.ships button.on{border-color:var(--cy);color:var(--cy)}
.field{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:5px 0}.field label{color:var(--dim);font-size:11px}
#shipPrev{width:100%;height:180px;display:block;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 80%,#141b28,#05070a 70%);cursor:grab;touch-action:none}
.card{border:1px solid var(--line);padding:10px;margin:8px 0;background:rgba(0,0,0,.25)}
.dh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pt{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);font-size:22px;background:rgba(255,255,255,.04);flex:none}
.stats{display:grid;grid-template-columns:86px 1fr 18px;gap:3px 6px;align-items:center;font-size:11px;margin-top:8px}.stats span:first-child{color:var(--dim)}
.sb{display:block;height:4px;background:rgba(205,215,235,.12)}.sb i{display:block;height:100%;background:#cfd6e2}.stats b{font-weight:400;text-align:right}
textarea{width:100%;height:64px;resize:vertical;font-size:10px}
a.btn{display:inline-block;border:1px solid var(--line);padding:4px 10px;text-decoration:none;color:inherit;font-size:11px;letter-spacing:.06em}a.btn.pri{border-color:var(--cy);color:var(--cy)}
select{background:rgba(0,0,0,.5);border:1px solid var(--line);color:inherit;padding:4px}
.story{white-space:pre-line}
#qrBox{background:#fff;padding:10px;display:inline-block;line-height:0}
/* diálogos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px;animation:fadeIn .2s}
#modal .box{background:rgba(10,12,16,.97);border:1px solid rgba(205,215,235,.35);padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:boxIn .25s ease}
.story{font-size:13px;line-height:1.6;color:#e6eaf1}.roll{font-size:11px;color:var(--amb);border-left:2px solid var(--amb);padding-left:8px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}.opts button{text-align:left;padding:8px 10px}
/* arranque */
#boot{position:fixed;inset:0;z-index:20;background:#060708;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .6s ease,visibility .6s}
#boot.out{opacity:0;visibility:hidden}
#boot .bx{border:1px solid rgba(205,215,235,.3);border-top-color:transparent;padding:36px 48px;text-align:center;position:relative}
#boot .bx::before{content:"";position:absolute;left:12px;right:0;top:0;height:1px;background:rgba(205,215,235,.3)}
#boot .bt{letter-spacing:.34em;color:#e6eaf1;font-size:12px}#boot .bs{letter-spacing:.22em;color:var(--dim);font-size:9px;margin-top:22px}
#boot .bl{width:240px;height:1px;background:rgba(205,215,235,.15);overflow:hidden;margin:22px auto 0}#boot .bl i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes boxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:861px) and (max-width:1250px){#app:has(#drawer.open) #foot{display:none}}
@media(max-width:380px){#brand .t1{letter-spacing:.24em}#seedIn{width:96px}#toggles button{padding:3px 5px}#hud{width:120px}}
@media(max-width:860px){
  #brand{left:10px;top:10px;max-width:58%}#brand .t2,#brand .t3{display:none}#seedIn{width:120px}
  .info{flex-direction:row;flex-wrap:wrap;gap:4px 12px}.info div:nth-child(n+3){display:none}
  #toggles{left:10px;top:112px;transform:none}#toggles button{padding:3px 7px;letter-spacing:.08em;font-size:9px}
  #hud{right:10px;top:10px;width:140px;gap:4px}#hud div:nth-child(n+4){display:none}
  #views{left:0;right:0;transform:none;bottom:max(8px,env(safe-area-inset-bottom));padding:0 10px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  #views::-webkit-scrollbar{display:none}#views button{flex:none;padding:7px 9px;letter-spacing:.06em;font-size:9px}#foot{display:none}
  #zoom{left:10px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);flex-direction:row}#zoom button{width:34px;height:34px}
  #ctr{right:10px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);padding:8px 10px;letter-spacing:.12em}
  #drawerBtn{right:112px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);padding:8px 10px;letter-spacing:.12em}
  #travel{bottom:96px;width:94%}#travel .tl{font-size:9px;letter-spacing:.06em}
  #toast{top:150px;max-width:94%}#banner{left:10px;bottom:132px}#crTag{left:10px;bottom:118px}
  .calc,.kv{grid-template-columns:minmax(90px,auto) 1fr}
  #modal{padding:8px}#modal .box{padding:14px;max-height:94dvh}
  #drawer{top:auto;height:64dvh;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
}
</style>
</head>
<body>
<div id="boot"><div class="bx"><div class="bt">INICIALIZANDO CATÁLOGO ESTELAR</div><div class="bl"><i></i></div><div class="bs">GENERADOR DETERMINISTA · CIELO COMPLETO</div></div></div>
<div id="app">
<section id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="brand">
    <a class="t1" href="../" title="Volver al menú"><img src="../icons/logo.png" alt="" class="aalogo"> AD ASTRA</a><img id="crewLogo" class="crewlogo" alt="" hidden><div class="t2">Carta de navegación estelar</div><div class="t3">SEMILLAS · ECL J2000 · SOL-CENTRADA</div>
    <form id="seedForm" autocomplete="off"><input id="seedIn" placeholder="A-DD5PN" spellcheck="false" maxlength="48" aria-label="Semilla"><button class="pri" type="submit">IR</button><button type="button" id="rndBtn" title="Lugar aleatorio">⚄</button></form>
    <div class="info" id="info"></div>
  </div>
  <div class="ov" id="toggles"><button data-o="nav">◇ Navegación</button><button data-o="color">◇ Color</button><button data-o="pet">✦ Petrova</button><button data-o="fac">⬡ Facciones</button></div>
  <div class="ov" id="hud"></div>
  <button class="ov" id="backBtn">⤒ VOLVER</button>
  <div class="ov" id="toast"></div>
  <div class="ov" id="travel"><div class="tl" id="trTxt"></div><div class="tb"><i id="trBar"></i></div></div>
  <div class="ov" id="views"><button data-v="sol">Sistema Solar</button><button data-v="traj">Trayectoria</button><button data-v="tau">Tau Ceti</button><button data-v="gal">Galáctica</button><button data-v="here" title="Fijar destino en el centro de la carta">⌖ Destino</button><button data-v="pilot" id="pilotBtn" title="Pilotaje libre (F)">✈ Pilotar</button><button id="logBtn" title="Registro de la partida">📜 Registro</button><button id="dualBtn" title="Mapa en esta ventana, panel en otra">🖥 Doble pantalla</button></div>
  <div class="ov" id="zoom"><button data-z="-1" title="Acercar">+</button><button data-z="1" title="Alejar">−</button><button id="spinBtn" title="Rotación automática">⟳</button></div>
  <button class="ov" id="drawerBtn">☰ MANDO</button>
  <button class="ov" id="ctr">◎ MI NAVE</button>
  <div class="ov" id="foot">ARRASTRA ORBITAR · RUEDA ZOOM · WASD VOLAR · F PILOTAR LA NAVE<em>/</em>AD ASTRA CORPORATION</div>
  <div class="ov" id="banner">SIN REGISTRO</div><div class="ov" id="crTag">MODO CREATIVO</div>
  <div class="ov" id="tip"></div>
</section>
<aside id="drawer">
  <div class="tabs"><button id="drawerX" title="Cerrar panel" aria-label="Cerrar panel">✕</button><button data-t="carta" class="on">Carta</button><button data-t="plan">Plan</button><button data-t="ship">Nave</button><button data-t="crew">Tripul.</button><button data-t="fac">Facciones</button><button data-t="base">Bases</button><button data-t="sess">Sesión</button><button data-t="hist">Bitácora</button><button data-t="nav">Navegar</button><button data-t="share">Partida</button></div>
  <div class="pane on" id="p-carta"></div><div class="pane" id="p-plan"></div><div class="pane" id="p-ship"></div><div class="pane" id="p-crew"></div><div class="pane" id="p-fac"></div><div class="pane" id="p-base"></div><div class="pane" id="p-sess"></div><div class="pane" id="p-hist"></div><div class="pane" id="p-nav"></div><div class="pane" id="p-share"></div>
</aside>
</div>
<div id="dmBox" class="dm"><div class="dmh"><b>📜 Registro de la partida</b><span><button id="dmCopy" class="sm" title="Copiar">⧉</button><button id="dmMin" class="sm" title="Minimizar">–</button><button id="dmX" class="sm" title="Ocultar">✕</button></span></div><div id="dmL"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>

    if(c.tech>=5&&s.fuel<sp.tank){const v=+(sp.tank*.2).toFixed(1);s.fuel=Math.min(sp.tank,s.fuel+v);out=`Intercambias minerales por ${v} t de combustible.`}else{const v=Math.round(sp.prov*.2);s.prov=Math.min(sp.prov,s.prov+v);out=`Intercambias minerales por ${fmtI(v)} días-persona de comida.`}rep+=3}

}

const invCount=o=>Object.values(o||{}).reduce((a,n)=>a+(n>0?n:0),0);

const ownerName=o=>o==='nave'?'la bodega':((D.crew.find(q=>q.id===o)||{}).nm||'?');
function moveItem(key,from,to){const a=ownerInv(from),b=ownerInv(to);if(!a||!b||from===to||!okItem(key)||!(a[key]>0))return'';
  if(to!=='nave'&&invCount(b)>=CAP_M)return`${ownerName(to)} ya lleva ${CAP_M} objetos.`;a[key]--;if(!a[key])delete a[key];b[key]=(b[key]||0)+1;return`${itemName(key)}: de ${ownerName(from)} a ${ownerName(to)}.`}
/* Busca un objeto en la nave o en cualquier tripulante; quita una unidad */
function takeAny(key){const x=FX();if(x.inv[key]>0){x.inv[key]--;if(!x.inv[key])delete x.inv[key];return true}for(const m of alive()){const v=mInv(m);if(v[key]>0){v[key]--;if(!v[key])delete v[key];return true}}return false}
const totalOf=key=>(FX().inv[key]||0)+alive().reduce((a,m)=>a+((m.inv||{})[key]||0),0);
const REP0={aa:40,lc:5,mh:0,ce:-30,cv:-10,ca:15};

function FX(){
  if(!D.fx||typeof D.fx!=='object')D.fx={};const f=D.fx;
  if(!f.rep||typeof f.rep!=='object')f.rep={};if(!Array.isArray(f.aff))f.aff=['aa'];if(!f.inv||typeof f.inv!=='object')f.inv={'aa.insignia':1,'aa.uniforme':1};
  if(!Array.isArray(f.mis))f.mis=[];if(!f.done||typeof f.done!=='object')f.done={};if(!Array.isArray(f.dn))f.dn=[];if(!f.wnt||typeof f.wnt!=='object')f.wnt={};
  if(!f.g0&&Array.isArray(D.crew)){f.g0=1;for(const m of D.crew)if(!m.inv&&GEAR[m.role])m.inv={['gen.'+GEAR[m.role]]:1}}return f}
const repF=f=>{const x=FX().rep;return f in x?x[f]:REP0[f]||0};
function addRep(f,v){if(!FAC[f]||!v)return'';const x=FX();x.rep[f]=clamp(Math.round(repF(f)+v),-100,100);return` ${FAC[f].ic} ${FAC[f].s} ${v>0?'+':''}${v}.`}
function giveItem(key,n=1){if(!okItem(key))return'';const x=FX();if(n<0){for(let i=0;i<-n;i++)takeAny(key);return''}x.inv[key]=(x.inv[key]||0)+n;return` Obtenéis: ${itemName(key)}${n>1?' ×'+n:''} (a la bodega).`}
const hasItem=key=>totalOf(key)>0;

/* — Territorio — */
const HUBG=70,_hub=new Map(),_ter=new Map();
function hubAt(i,j,k){const key=i+','+j+','+k;let h=_hub.get(key);if(h!==undefined)return h;
  const r=rng(hash(i+7000,j+7000,k+7000,4321));h=null;
  if(r()<.78){let w=FK.reduce((a,f)=>a+FAC[f].w,0)*r(),f=FK[0];for(const q of FK){w-=FAC[q].w;if(w<=0){f=q;break}}
    h={f,x:(i+.15+.7*r())*HUBG,y:(j+.15+.7*r())*HUBG,z:(k+.3+.4*r())*HUBG*.35,R:30+r()*28,name:genName(hash(i,j,k,88))}}
  if(_hub.size>5000)_hub.clear();_hub.set(key,h);return h}
function facAt(x,y,z){
  const sol=Math.hypot(x,y,z);if(sol<18)return{f:'aa',hub:'Sol',core:1};
  const i=Math.floor(x/HUBG),j=Math.floor(y/HUBG),k=Math.floor(z/(HUBG*.35));let b=null,bd=1;
  for(let a=-1;a<=1;a++)for(let c=-1;c<=1;c++)for(let e=-1;e<=1;e++){const h=hubAt(i+a,j+c,k+e);if(!h)continue;const d=Math.hypot(h.x-x,h.y-y,(h.z-z)*1.6)/h.R;if(d<bd){bd=d;b=h}}
  return b?{f:b.f,hub:b.name,core:bd<.35?1:0}:null}
function facOf(st){if(!st)return null;const key=st.point?st.seed||[st.gx,st.gy,st.gz].map(v=>v.toFixed(1)).join(','):st.h;let v=_ter.get(key);if(v!==undefined)return v;
  v=facAt(st.gx,st.gy,st.gz);if(_ter.size>40000)_ter.clear();_ter.set(key,v);return v}
const terLab=t=>t?`${FAC[t.f].ic} ${FAC[t.f].n}${t.core?' (núcleo '+t.hub+')':''}`:'Espacio libre (sin control)';

/* — Exposición: probabilidad de que la facción «obs» os relacione con cada facción — */
function exposure(obs){
  const x=FX(),out={};
  for(const f of FK){let p=0;const why=[];
    if(x.aff.includes(f)){p+=.12;const fama=Math.min(.3,(x.done[f]||0)*.04);if(fama){p+=fama;why.push('vuestra fama')}}
    const add=(inv,who)=>{for(const[k,n]of Object.entries(inv||{})){const[ff,t]=k.split('.');if(ff!==f||!(n>0)||!ITEMS[t]||!ITEMS[t].v)continue;p+=ITEMS[t].v*.11*Math.min(n,3)**.7*(who?1.15:1);why.push(ITEMS[t].n.toLowerCase()+(who?' de '+who:''))}};
    add(x.inv,'');for(const m of alive()){add(m.inv,m.nm);if(memberFa(m).includes(f)){p+=.08;why.push(m.nm+' (miembro)')}}
    if(obs===f&&p>0)p+=.15;if(obs&&x.wnt[obs]&&x.aff.includes(f))p+=.25;
    p=Math.min(.95,p);if(p>.01)out[f]={p,why:[...new Set(why)].slice(0,3),aff:x.aff.includes(f)}}
  return out}
function detect(obs){const ex=exposure(obs);return Object.keys(ex).filter(f=>Math.random()<ex[f].p).map(f=>({f,...ex[f]}))}
function attitude(O,K){let a=repF(O)/25;for(const k of K)a+=rel(O,k.f)*(k.aff?1:.7);if(FX().wnt[O])a-=2;if(O==='cv'&&!K.some(k=>rel(O,k.f)>0))a-=1;return a}
const knownTxt=(O,K)=>K.length?`${cap(FAC[O].s)} os identifica${/^los /.test(FAC[O].s)?'n':''} como ${K.map(k=>(k.aff?'miembros de ':'gente relacionada con ')+FAC[k.f].n+(k.why.length?` (os delata${k.why.length>1?'n':''}: ${k.why.join(', ')})`:'')).join(' y ')}.`:'No parecen saber quiénes sois.';

/* — Encuentros con facciones (eventos generados al vuelo) — */
function facEvent(at,ctx){
  const st=at==='leg'?ctx&&ctx.leg&&ctx.leg.to:ctx&&ctx.star,ter=facOf(st);let O=ter?ter.f:null;
  if(!O||Math.random()<.25){if(Math.random()<.5)return null;O=pick(['cv','lc','ca','ce'])}
  const K=detect(O),att=attitude(O,K),F=FAC[O],sp=()=>SPEC[D.ship.d],x=FX(),tone=att>=1.4?'ami':att<=-1.4?'hos':'neu';
  const giveUp=()=>{const keys=[...new Set([x.inv,...alive().map(m=>m.inv||{})].flatMap(o=>Object.keys(o)))].filter(k=>K.some(q=>k.startsWith(q.f+'.')));let s='';for(const k of keys)s+=dropItem(k,totalOf(k),1);return s};
  const op=[];
  if(tone==='hos'){
    if(hasItem(O+'.salvo'))op.push({l:'Mostrar el salvoconducto',run:()=>{giveItem(O+'.salvo',-1);return`Leen el permiso y os dejan pasar. El salvoconducto queda retenido.`+addRep(O,2)}});
    op.push({l:'Huir a toda máquina',k:'pil',dc:12+(O==='mh'?1:0),ok:()=>'Los dejáis atrás entre el polvo de la nebulosa.',ko:()=>{const d=8+(Math.random()*14|0);D.st.hull=Math.max(1,D.st.hull-d);return`Os alcanzan sus disparos: casco −${d}%.`+addRep(O,-3)}});
    op.push({l:'Plantar cara',k:'seg',dc:13,ok:(c,r)=>{D.st.min=Math.min(sp().cargo,D.st.min+15);x.wnt[O]=1;return`Se retiran con daños. Recogéis 15 t de chatarra, pero ahora os buscan.`+addRep(O,-10)+gainXp(r.m,15)},
      ko:()=>{const d=12+(Math.random()*12|0);D.st.hull=Math.max(1,D.st.hull-d);x.wnt[O]=1;return`Os superan: casco −${d}%.`+hurt(pick(alive()),15)+addRep(O,-6)}});
    op.push({l:'Pagar para que os dejen en paz (25 t)',need:()=>D.st.min>=25,run:()=>{D.st.min-=25;return'Aceptan el pago y se alejan.'+addRep(O,1)}});
    if(K.some(k=>Object.keys(x.inv).concat(...alive().map(m=>Object.keys(m.inv||{}))).some(i=>i.startsWith(k.f+'.'))))op.push({l:'Arrojar al espacio lo que os delata',run:()=>`Los objetos flotan hacia el vacío.${giveUp()} Sin pruebas, os dejan marchar.`});
  }else if(tone==='ami'){
    op.push({l:'Pedir suministros',run:()=>{const s=sp(),a=Math.round(s.prov*.1),f=+(s.tank*.08).toFixed(1);D.st.prov=Math.min(s.prov,D.st.prov+a);D.st.fuel=Math.min(s.tank,D.st.fuel+f);return`Comparten ${fmtI(a)} días-persona de comida y ${f} t de astrófago.`+addRep(O,1)}});
    op.push({l:'Aceptar un encargo',run:()=>{const m=genMission(O,shipStar(),hash(Date.now()|0,D.st.jumps,77));if(!m)return'No tienen nada para vosotros ahora.';if(x.mis.length>=5)return'Ya tenéis demasiados contratos.';acceptMission(m);return`Nuevo contrato: ${m.tx}`}});
    op.push({l:'Intercambiar cartas estelares',k:'cie',dc:9,ok:(c,r)=>`Os pasan rutas y nombres de sistemas.`+gainXp(r.m,12)+addRep(O,2),ko:()=>'Los formatos no son compatibles.'});
  }else{
    if(O==='mh')op.push({l:'Aceptar la inspección (3 d)',run:()=>{passDays(3);const all=[...new Set([x.inv,...alive().map(m=>m.inv||{})].flatMap(o=>Object.keys(o)))];
      const bad=all.filter(k=>{const[f,t]=k.split('.');return f!=='gen'&&(t==='contra'||rel('mh',f)<=-1)});
      if(!bad.length)return'Registran la bodega y cachean a la tripulación. No encuentran nada ilegal.'+addRep('mh',3);let s='';for(const k of bad)s+=dropItem(k,totalOf(k),1);return`Registran bodega y bolsillos. Confiscan lo que no les gusta.${s}`+addRep('mh',-4)}});
    if(O==='lc')op.push({l:'Comprar equipo (10 t)',need:()=>D.st.min>=10,run:()=>{D.st.min-=10;return'Un comerciante os vende material de calidad.'+giveItem('gen.'+pick(Object.values(GEAR)))+addRep('lc',1)}});
    if(O==='lc'||O==='cv')op.push({l:'Comerciar: 20 t minerales → astrófago',need:()=>D.st.min>=20,run:()=>{const s=sp();D.st.min-=20;D.st.fuel=Math.min(s.tank,D.st.fuel+s.tank*.14);return'Trato hecho.'+addRep(O,2)}});
    if(O==='cv'||O==='ce')op.push({l:'Comprar «mercancía especial» (15 t)',need:()=>D.st.min>=15,run:()=>{D.st.min-=15;return'Os entregan un paquete sin etiqueta. Vale mucho… y delata mucho.'+giveItem(O+'.contra')+addRep(O,2)}});
    if(O==='ca')op.push({l:'Compartir vuestra bitácora',run:()=>`Los Custodios archivan ${Object.keys(D.disc).length} sistemas a vuestro nombre.`+addRep('ca',Math.min(6,1+Object.keys(D.disc).length/5|0))});
    op.push({l:'Hacerse pasar por otra facción',k:'soc',dc:13,ok:(c,r)=>{const f=pick(FK.filter(q=>rel(O,q)>=1&&q!==O))||O;return`Os creen gente de ${FAC[f].s}. Os desean buen viaje.`+gainXp(r.m,10)},ko:()=>{x.wnt[O]=1;return'Descubren el engaño y os anotan en sus registros.'+addRep(O,-6)}});
    op.push({l:'Saludar y seguir rumbo',run:()=>'Intercambiáis saludos y cada cual sigue su camino.'});
  }
  const mood=tone==='hos'?' Su actitud es hostil.':tone==='ami'?' Os reciben como amigos.':'';
  return{id:'fac-'+O,t:`${F.ic} ${F.who}`,tx:`${F.enc} ${knownTxt(O,K)}${mood}${ter&&st&&!st.point?` (Territorio: ${FAC[ter.f].n}.)`:''}`,op,fac:O};
}

/* ═════════ Contratos aleatorios ═════════ */
const MTY={
 entrega:{n:'Entrega',ic:'📦',k:null,dc:0,it:'sello',tx:(m)=>`Llevar una carga sellada de ${FAC[m.g].s} hasta ${m.tn}.`},
 contrabando:{n:'Contrabando',ic:'🕳',k:null,dc:0,it:'contra',for:['cv','ce','lc'],tx:m=>`Introducir mercancía prohibida en ${m.tn} sin que nadie lo note.`},
 rescate:{n:'Rescate',ic:'🛟',k:'med',dc:12,tx:m=>`Una tripulación de ${FAC[m.g].s} quedó varada en ${m.tn}. Sacarla con vida.`},
 reconocimiento:{n:'Reconocimiento',ic:'🔭',k:'cie',dc:11,tx:m=>`Escanear el sistema ${m.tn} y transmitir los datos.`},
 diplomacia:{n:'Diplomacia',ic:'🕊',k:'soc',dc:12,tx:m=>`Llevar un mensaje de ${FAC[m.g].s} a los habitantes de ${m.tn}.`},
 caza:{n:'Caza',ic:'🎯',k:'seg',dc:13,tx:m=>`${cap(FAC[m.e||'cv'].s)} acosan ${m.tn}. Expulsarlos.`},
 sabotaje:{n:'Sabotaje',ic:'💣',k:'ing',dc:14,tx:m=>`Sabotear una estación de ${FAC[m.e].s} en ${m.tn} sin dejar rastro.`},
 reliquia:{n:'Recuperación',ic:'🏺',k:'cie',dc:12,tx:m=>`Recuperar una reliquia en ${m.tn} y traerla a ${m.on}.`}};
const MTK=Object.keys(MTY);
function genMission(g,from,seed){
  if(!from||from.point)return null;const r=rng(seed>>>0);let ty=MTK[r()*MTK.length|0];if(MTY[ty].for&&!MTY[ty].for.includes(g))ty='entrega';
  const enem=FK.filter(f=>rel(g,f)<=-1);let e=null;if(ty==='caza'||ty==='sabotaje'){if(!enem.length)ty='reconocimiento';else e=enem[r()*enem.length|0]}
  const cand=[];starsNear(from.gx,from.gy,from.gz,ty==='sabotaje'?32:22,(s,d)=>{if(d>3&&!s.point)cand.push([s,d])});
  if(!cand.length)return null;cand.sort((a,b)=>a[1]-b[1]||a[0].h-b[0].h);
  let pool=cand;if(ty==='sabotaje'){pool=cand.filter(([s])=>{const t=facOf(s);return t&&t.f===e});if(!pool.length){ty='caza';pool=cand}}
  const[T,d]=pool[r()*pool.length|0],ty0=MTY[ty],L=legCalc(from,T);
  const m={id:(seed>>>0).toString(36).slice(-6).toUpperCase(),g,ty,o:sSeed(from),on:starName(from),t:sSeed(T),tn:starName(T),d:+d.toFixed(1),e,ph:0,
    dl:Math.round(D.st.days+L.days*(ty==='reliquia'?4:2.5)+45+r()*60),
    rw:{min:Math.round(10+d*(1.5+r())+(ty0.dc||9)),rep:Math.round(6+r()*6+(ty==='sabotaje'?6:0)),it:r()<.45?g+'.'+pick2(r,['insignia','salvo','tec','uniforme']):r()<.5?'gen.'+pick2(r,Object.values(GEAR)):null,xp:10+(ty0.dc||8)}};
  if(ty==='contrabando')m.rw.min=Math.round(m.rw.min*1.8);
  m.tx=ty0.tx(m);return m}
function boardFor(st){
  if(!st||st.point)return[];const ter=facOf(st),ep=Math.floor(D.st.days/120),x=FX(),r=rng(hash(st.h,ep,4711)),out=[];
  const S=genSystem(st),civs=S.planets.map((p,i)=>civInfo(S,i)).filter(c=>c&&c.tech>=4).length;
  const n=(ter?2:1)+(ter&&ter.core?1:0)+(civs?1:0);
  for(let i=0;i<n;i++){const g=i<2&&ter?ter.f:FK[r()*FK.length|0];const m=genMission(g,st,hash(st.h,ep,i,909));if(m&&!x.dn.includes(m.id)&&!x.mis.some(q=>q.id===m.id))out.push(m)}
  return out}
function acceptMission(m){const x=FX();x.mis.push(m);const it=MTY[m.ty].it;if(it)giveItem(m.g+'.'+it);addRep(m.g,1);logDM(`Contrato aceptado (${FAC[m.g].n}): ${m.tx}`,'cmd')}
function dropItem(key,n,silent,from){const x=FX();const src=from?ownerInv(from):null;n=Math.min(n||1,src?src[key]||0:totalOf(key));if(!n)return'';
  if(src){src[key]-=n;if(!src[key])delete src[key]}else giveItem(key,-n);let s=silent?` (${itemName(key)} perdido)`:`Arrojáis ${itemName(key)}${n>1?' ×'+n:''}.`;
  const[f,t]=key.split('.');if(t==='sello'||t==='contra'||t==='reliquia'){for(const m of x.mis.filter(m=>m.g===f&&MTY[m.ty].it===t||m.g===f&&m.ty==='reliquia'&&m.ph===1&&t==='reliquia').slice(0,n)){failMission(m,'se perdió la carga');s+=` Contrato ${m.id} fallido.`}}return s}
function failMission(m,why){const x=FX();x.mis=x.mis.filter(q=>q!==m);x.dn.push(m.id);if(x.dn.length>300)x.dn.splice(0,100);addRep(m.g,-Math.round(m.rw.rep*.8));
  queueDialog({t:`Contrato fallido · ${MTY[m.ty].n}`,who:pick(alive())||null,tx:`${m.tx} El encargo de ${FAC[m.g].n} no se ha cumplido: ${why}.`,res:`Reputación con ${FAC[m.g].s} −${Math.round(m.rw.rep*.8)}`})}
function facTick(){const x=FX();for(const m of x.mis.slice())if(D.st.days>m.dl){const it=MTY[m.ty].it;if(it&&hasItem(m.g+'.'+it))giveItem(m.g+'.'+it,-1);failMission(m,'venció el plazo')}}
const misHere=(m,st)=>st&&!st.point&&sSeed(st)===(m.ty==='reliquia'&&m.ph===1?m.o:m.t);
function doMission(id){
  const x=FX(),m=x.mis.find(q=>q.id===id),st=shipStar();if(!m)return'Ese contrato ya no está activo.';if(!misHere(m,st))return'Tenéis que estar en el sistema del contrato.';
  const ty=MTY[m.ty];let res='',line='';
  if(m.ty==='reliquia'&&m.ph===0){passDays(5);const r=roll(ty.k,ty.dc);line=r.line;if(!r.ok){passDays(5);return'No encontráis la reliquia esta vez (podéis volver a intentarlo). '+r.line.replace(/<[^>]+>/g,'')+hurt(pick(alive()),8)}
    m.ph=1;giveItem(m.g+'.reliquia');saveD();queueDialog({t:`${ty.ic} Reliquia recuperada`,who:r.m,tx:`La reliquia de ${FAC[m.g].s} ya está a bordo. Ahora hay que llevarla a ${m.on}.`,res:line.replace(/<[^>]+>/g,'')});return''}
  if(ty.it||m.ty==='reliquia'){const k=m.g+'.'+(m.ty==='reliquia'?'reliquia':ty.it);if(!hasItem(k)){failMission(m,'la carga ya no está a bordo');saveD();return''}giveItem(k,-1);passDays(2)}
  if(m.ty==='contrabando'){const ter=facOf(st);if(ter&&ter.f!==m.g&&Math.random()<.35){const r=roll('soc',13);line=r.line;if(!r.ok){addRep(ter.f,-10);x.wnt[ter.f]=1;res=` ${cap(FAC[ter.f].s)} descubre la descarga y os fichan.`}}}
  else if(ty.k){passDays(4);const r=roll(ty.k,ty.dc);line=r.line;
    if(!r.ok){let extra='';if(m.ty==='sabotaje'&&m.e){x.wnt[m.e]=1;extra=addRep(m.e,-20)+` ${cap(FAC[m.e].s)} sabe quién fue.`}if(m.ty==='caza'||m.ty==='rescate'){const d=8+(Math.random()*10|0);D.st.hull=Math.max(1,D.st.hull-d);extra+=` Casco −${d}%.`+hurt(pick(alive()),12)}
      failMission(m,'la tirada salió mal');saveD();logDM(`Contrato ${m.id} fallido.${extra}`,'ev');toast(esc(`Contrato fallido.${extra}`));return''}
    if(m.ty==='sabotaje'&&m.e)res+=addRep(m.e,-5);if(m.ty==='diplomacia')for(const f of FK)if(rel(m.g,f)>=1)res+=addRep(f,2)}
  const s=D.st,sp=SPEC[D.ship.d];s.min=Math.min(sp.cargo,s.min+m.rw.min);res=`+${m.rw.min} t de minerales.`+addRep(m.g,m.rw.rep)+res;
  for(const f of FK)if(f!==m.g&&rel(m.g,f)<=-2)res+=addRep(f,-2);
  if(m.rw.it)res+=giveItem(m.rw.it);for(const p of alive())gainXp(p,m.rw.xp);res+=` +${m.rw.xp} XP a la tripulación.`;
  x.mis=x.mis.filter(q=>q!==m);x.dn.push(m.id);x.done[m.g]=(x.done[m.g]||0)+1;saveD();
  queueDialog({t:`${ty.ic} Contrato cumplido · ${ty.n}`,who:pick(alive())||null,tx:`${m.tx} ${FAC[m.g].n} paga lo acordado.`,res:(line?line.replace(/<[^>]+>/g,'')+' · ':'')+res});return''}
function joinFac(f){const x=FX();if(!FAC[f])return'';if(x.aff.includes(f)){x.aff=x.aff.filter(q=>q!==f);return'Abandonáis '+FAC[f].n+'.'+addRep(f,-20)}
  if(repF(f)<40)return`${cap(FAC[f].s)} todavía no confía en vosotros (hace falta reputación 40).`;
  x.aff.push(f);let s=`Os unís a ${FAC[f].n}.`+giveItem(f+'.insignia');for(const q of FK)if(q!==f&&rel(f,q)<=-2)s+=addRep(q,-15);return s}
function doFac(c){
  const x=FX();let out='';
  if(c.a==='take'){const st=starFromSeed(String(c.s||''));if(!st||!sameStar(st,shipStar()))return'Tenéis que estar en ese sistema.';const m=boardFor(st).find(q=>q.id===c.id);if(!m)return'Ese contrato ya no está disponible.';
    if(x.mis.length>=5)return'Máximo 5 contratos activos.';acceptMission(m);out='Contrato aceptado: '+m.tx}
  else if(c.a==='do')out=doMission(String(c.id));

/* ═════════ Bases planetarias y envíos de recursos ═════════
   · Cada planeta sólido tiene una riqueza determinista (semilla del sistema): minerales, astrófago y alimento; puede ser cero.
   · La base produce con el tiempo de a bordo y acumula hasta su capacidad.
   · Los envíos viajan en tiempo real: 1 año luz cada 5 segundos (mínimo 5 s), desde la base hasta donde esté la nave al pedirlos. */
const BSPEED=5000,BMAX=8,WH={min:1000,fuel:300,prov:60000},RMAX=12;
const BTY={
 mina:{n:'Mina',ic:'⛏',r:'min',rate:25,cap:400,d:'Extrae minerales del subsuelo.'},
 refineria:{n:'Refinería de astrófago',ic:'⚗',r:'fuel',rate:10,cap:120,d:'Cultiva y refina astrófago.'},
 granja:{n:'Granja hidropónica',ic:'🌱',r:'prov',rate:1500,cap:30000,d:'Produce comida para la tripulación.'},
 puesto:{n:'Puesto avanzado',ic:'⛺',r:null,rate:0,cap:0,d:'Un poco de todo y refugio: +2 moral al visitarlo.'}};
const RESN={min:['Minerales','t'],fuel:['Astrófago','t'],prov:['Provisiones','días-persona']};
function baseRes(S,i){
  const info=planetInfo(S,i),p=info.p,r=rng(hash(S.star.h,i,1312));if(info.gas)return null;const has=n=>info.pois.includes(n);
  let min=({lava:1.2,desert:1,barren:1,ice:.5,frozen:.6,temperate:.6,ocean:.3})[p.kind]??.5;if(has('Depósito mineral'))min+=.8;if(has('Géiser de lava'))min+=.5;min*=.4+r();if(r()<.12)min=0;
  let fuel=(has('Cristales de astrófago')?1.2:0)+(infected(S.star)?.6:0);fuel*=.5+r();
  let prov=(p.hz?.8:0)+(has('Flora comestible')?.8:0)+(info.breath?.3:0)+(has('Hielo puro')?.25:0);if(p.T<150||p.T>420)prov*=.25;prov*=.5+r()*.8;
  return{min:+min.toFixed(2),fuel:+fuel.toFixed(2),prov:+prov.toFixed(2),info}}
const richLab=v=>v<=0?'nula':v<.4?'pobre':v<.9?'media':v<1.5?'rica':'muy rica';
function baseRate(b){const t=BTY[b.ty];if(!t)return{};if(b.ty==='puesto')return{min:3*b.lv,fuel:1*b.lv,prov:150*b.lv};return{[t.r]:t.rate*(b.rich[t.r]||0)*b.lv}} // por 100 días
const baseCap=b=>b.ty==='puesto'?{min:60*b.lv,fuel:20*b.lv,prov:4000*b.lv}:{[BTY[b.ty].r]:BTY[b.ty].cap*b.lv};
function baseTick(){if(!Array.isArray(D.bases))D.bases=[];const now=D.st.days;for(const b of D.bases){const dt=Math.max(0,now-b.t);if(!dt)continue;b.t=now;const rt=baseRate(b),cp=baseCap(b);
  for(const k in rt){const v=b.stk[k]||0;b.stk[k]=Math.max(v,Math.min(cp[k]||0,v+rt[k]*dt/100))}}}
const whCap=(b,k)=>Math.max((baseCap(b)[k]||0),WH[k]*b.lv);
const baseStar=b=>starFromSeed(b.s);
function shipXYZ(){const p=typeof pilot!=='undefined'&&pilot?pilot.pos:null;if(p)return p.slice();const s=shipStar();return[s.gx,s.gy,s.gz]}
function buildBase(i,ty){
  const st=shipStar();if(st.point)return'Aquí no hay planetas.';const S=genSystem(st),rs=baseRes(S,i);if(!rs)return'No se puede construir sobre un gigante gaseoso.';if(!BTY[ty])return'';
  if(!Array.isArray(D.bases))D.bases=[];if(D.bases.length>=BMAX)return`Máximo ${BMAX} bases.`;const key=sSeed(st)+':'+i;if(D.bases.some(b=>b.k===key))return'Ya hay una base en ese planeta.';
  if(D.st.min<40&&!D.cr)return'Hacen falta 40 t de minerales.';baseTick();if(!D.cr)D.st.min-=40;passDays(20);
  let id;do id=Math.random().toString(36).slice(2,8).toUpperCase();while(D.bases.some(q=>q.id===id));const b={id,k:key,s:sSeed(st),i,n:`${BTY[ty].n} ${S.planets[i].name}`,sn:S.name,pn:S.planets[i].name,ty,lv:1,t:D.st.days,stk:{},rich:{min:rs.min,fuel:rs.fuel,prov:rs.prov}};D.bases.push(b);
  let s=`${BTY[ty].ic} Base construida en ${b.pn}: ${b.n}.`;const rt=baseRate(b);if(ty!=='puesto'&&!Object.values(rt).some(v=>v>0))s+=' El planeta no tiene ese recurso: no producirá nada.';

  logDM(s,'cmd');saveD();return s}
function upBase(id){const b=(D.bases||[]).find(q=>q.id===id);if(!b)return'';if(b.lv>=3)return'La base ya está al máximo.';const c=50*b.lv;if(!sameStar(baseStar(b),shipStar()))return'Tenéis que estar en ese sistema.';
  if(D.st.min<c&&!D.cr)return`Hacen falta ${c} t de minerales.`;baseTick();if(!D.cr)D.st.min-=c;passDays(15);b.lv++;saveD();return`${b.n} pasa a nivel ${b.lv}.`}
const baseById=id=>(D.bases||[]).find(q=>q.id===id);
const dstName=d=>d==='nave'?(D.ship.n||SHIPS[D.ship.d].n):((baseById(d)||{}).n||'base perdida');
/* id: base de origen · dst: 'nave' o id de base · res: 'all'|'min'|'fuel'|'prov' · q: cantidad máxima (0 = todo) */
function sendBase(id,dst='nave',res='all',q=0){baseTick();const b=baseById(id),st=b&&baseStar(b);if(!b||!st)return'';if(dst===id)return'El origen y el destino son la misma base.';
  const db=dst==='nave'?null:baseById(dst);if(dst!=='nave'&&!db)return'Esa base ya no existe.';const amt={};
  for(const k of ['min','fuel','prov']){if(res!=='all'&&res!==k)continue;let v=Math.floor(b.stk[k]||0);if(q>0)v=Math.min(v,q);if(v>0){amt[k]=v;b.stk[k]-=v}}
  if(!Object.keys(amt).length)return`${b.n} no tiene ${res==='all'?'nada':RESN[res][0].toLowerCase()} que enviar todavía.`;if(!Array.isArray(D.conv))D.conv=[];if(D.conv.length>=20)return'Demasiados envíos en camino.';

  D.conv.push({id:b.id+'-'+(now%1e6).toString(36)+Math.random().toString(36).slice(2,4),b:b.id,bn:b.n,dst,f:[st.gx,st.gy,st.gz],to,d:+d.toFixed(2),t0:now,eta:now+ms,amt});saveD();
  return`🚚 ${b.n} → ${dstName(dst)}: ${resTxt(amt)}. ${fmtLen(d)}: llega en ${fmtDur(ms)}.`}
/* Rutas automáticas: cada N días a bordo (u) o cada N minutos reales (m) */
function addRoute(c){const b=baseById(String(c.from));if(!b)return'';const dst=String(c.dst||'nave');if(dst!=='nave'&&!baseById(dst))return'';if(dst===b.id)return'El origen y el destino son la misma base.';
  if(!Array.isArray(D.rutas))D.rutas=[];if(D.rutas.length>=RMAX)return`Máximo ${RMAX} rutas.`;const u=c.u==='m'?'m':'d',ev=clamp(+c.ev||(u==='m'?5:30),1,u==='m'?1440:3650),res=['all','min','fuel','prov'].includes(c.res)?c.res:'all';
  const r={id:Date.now().toString(36).slice(-5).toUpperCase(),from:b.id,dst,res,q:Math.max(0,+c.q|0),u,ev,ld:D.st.days,lm:Date.now()};D.rutas.push(r);saveD();
  return`🔁 Ruta creada: ${b.n} → ${dstName(dst)}, ${routeTxt(r)}.`}
const routeTxt=r=>`${r.res==='all'?'todo':RESN[r.res][0].toLowerCase()}${r.q?' (máx. '+fmtI(r.q)+')':''} cada ${r.ev} ${r.u==='m'?'min reales':'días a bordo'}`;
function routeTick(){if(!Array.isArray(D.rutas)||!D.rutas.length)return;const now=Date.now();let ch=0;
  D.rutas=D.rutas.filter(r=>baseById(r.from)&&(r.dst==='nave'||baseById(r.dst)));
  for(const r of D.rutas){const due=r.u==='m'?now-r.lm>=r.ev*60000:D.st.days-r.ld>=r.ev;if(!due)continue;r.lm=now;r.ld=D.st.days;ch=1;
    const m=sendBase(r.from,r.dst,r.res,r.q);if(/^🚚/.test(m)){logDM('🔁 '+m,'sys');if(tab==='base')renderPanel()}}
  if(ch)saveD()}
const resTxt=a=>Object.entries(a).map(([k,v])=>`${fmtI(v)} ${RESN[k][1]==='t'?'t de '+RESN[k][0].toLowerCase():RESN[k][1]}`).join(', ');
const fmtDur=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return s<60?s+' s':s<3600?Math.floor(s/60)+' min '+(s%60)+' s':Math.floor(s/3600)+' h '+Math.floor(s%3600/60)+' min'};
function convTick(){
  if(!Array.isArray(D.conv)||!D.conv.length||(NET&&NET.role==='client'))return;const now=Date.now(),done=D.conv.filter(c=>now>=c.eta);if(!done.length)return;
  D.conv=D.conv.filter(c=>now<c.eta);const sp=SPEC[D.ship.d],s=D.st;

setInterval(()=>{if(!(NET&&NET.role==='client')){routeTick();convTick()}if(tab==='base'&&((D.conv||[]).length||(D.rutas||[]).length)&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#p-base')))renderBases()},1000);

function passDays(n){
  const s=D.st,c=crewCount();if(!D.cr)s.prov=Math.max(0,s.prov-c*n);s.days+=n;s.yrs+=n/365.25;const med=best('med').v;

}

/* ═════════ Astrófago: estrellas infectadas (modo Petrova) ═════════ */
const INF=new Set(['sol','tceti','eeri','40eri','acen']);
const infected=s=>s.point?false:s.anchor?INF.has(s.anchor.id):PETROVA.has(s.P.k)&&hash(s.h,13)%4===0;

/* ═════════ Cálculo de viaje (relativista, aceleración constante con volteo a mitad de camino) ═════════ */
function legCalc(a,b){
  const sp=SPEC[D.ship.d],d=gd(a,b),acc=sp.acc*1.0323,x=d/2,tE=2*Math.sqrt(x*x+2*x/acc),ph=Math.acosh(1+acc*x),tau=2*ph/acc,days=tau*365.25;
  const prov=sp.prov?crewCount()*days*(D.hib&&sp.hib?.15:1)*(1-(sp.farm||0)):0;
  return{from:a,to:b,d,tE,tau,v:Math.tanh(ph),g:Math.cosh(ph),days,fuel:d*sp.burn,prov};
}
function legErr(L,s){
  const sp=SPEC[D.ship.d],ml=legMax(D.ship.d);
  if(L.d>ml+1e-9&&!D.cr)return`el salto de ${fmtLen(L.d)} supera el alcance máximo (${fmtLen(ml)})`;
  if(crewCount()<sp.crew[0])return'tripulación insuficiente para operar la nave';
  if(s.hull<=0)return'casco destruido';if(D.cr)return'';
  if(s.fuel+1e-9<L.fuel)return`falta astrófago (${L.fuel.toFixed(1)} t necesarias, hay ${s.fuel.toFixed(1)} t)`;
  if(sp.prov&&s.prov+1e-9<L.prov)return`faltan provisiones (${fmtI(L.prov)} días-persona, hay ${fmtI(s.prov)})`+(sp.hib&&!D.hib?'; activa la hibernación':'');
  return'';
}
function buildLegs(stars){
  const legs=[],tot={d:0,tau:0,tE:0,fuel:0,prov:0},s={...D.st},sp=SPEC[D.ship.d];let bad=false;
  for(let i=0;i<stars.length-1;i++){const L=legCalc(stars[i],stars[i+1]);for(const k in tot)tot[k]+=L[k];
    if(bad)L.pend=1;else{L.err=legErr(L,s);if(L.err)bad=true;else{if(!D.cr){s.fuel-=L.fuel;s.prov-=L.prov}if(sp.solar)s.fuel=sp.tank}}legs.push(L)}
  return{stars,legs,tot,ok:!bad};
}
/* Ruta con A* sobre las estrellas de un corredor alrededor de la línea recta */
function planRoute(from,to){

    $('#modalBox').querySelectorAll('[data-m]').forEach(c=>c.onchange=()=>{if(c.checked){if(sel.size>=3){c.checked=false;return}sel.add(c.dataset.m)}else sel.delete(c.dataset.m);draw()});
    $('#no').onclick=()=>{modalOpen=false;closeModal()};
    $('#go').onclick=()=>{const team=alive().filter(m=>sel.has(m.id));if(alive().length&&!team.length){toast('Elige al menos un tripulante.');return}modalOpen=false;closeModal();cmd({k:'exp',i:info.i,poi:poiName,team:team.map(m=>m.id)},`Expedición a «${poiName}» en ${info.p.name} (${team.map(m=>m.nm).join(', ')||'dron'})`)}};
  modalOpen=true;draw();
}
function applyLoot(lo,mult){
  const sp=SPEC[D.ship.d],s=D.st,out=[],rr=a=>lerp(a[0],a[1],Math.random())*mult;
  if(lo.min){const v=Math.round(rr(lo.min));s.min=Math.min(sp.cargo,s.min+v);out.push(`+${v} t minerales`)}
  if(lo.prov&&sp.prov){const v=Math.round(sp.prov*rr(lo.prov));s.prov=Math.min(sp.prov,s.prov+v);out.push(`+${fmtI(v)} días-persona de provisiones`)}
  if(lo.fuel){const v=+(sp.tank*rr(lo.fuel)).toFixed(1);s.fuel=Math.min(sp.tank,s.fuel+v);out.push(`+${v} t de astrófago`)}
  if(lo.mor){morAll(lo.mor);out.push(`moral +${lo.mor}`)}
  if(lo.crew&&crewCount()<sp.crew[1])out.push(addMember());
  if(lo.lore)out.push('«'+pick(LORE)+'»');
  return out.join(' · ');
}
function bestTeam(k){return alive().filter(m=>m.hp>20).sort((a,b)=>eff(b,k)-eff(a,k)).slice(0,2)}
function expDc(info,P,team){return P.dc+info.hz.reduce((a,h)=>a+Math.max(0,h[2]-(team.some(m=>eff(m,h[1])>=6)?1:0)),0)}
function resolveExpedition(info,poiName,team){
  const P=POI[poiName],key=info.key+':'+poiName,days=P.days+(SPEC[D.ship.d].land?0:2);if(D.ex[key])return null;passDays(days);
  const dc=expDc(info,P,team),r=roll(P.k,dc,team);let txt='';
  for(const h of info.hz)if(team.length&&Math.random()<.3)txt+=` ${h[0]}:`+hurt(pick(team),5+(Math.random()*8|0));
  if(r.ok){const loot=applyLoot(P.lo,r.crit?1.5:1);D.ex[key]=1;let xp='';for(const m of team)xp+=gainXp(m,(P.lo.xp||10)+(r.crit?8:0));
    for(const m of team)if(m.tr==='Curioso')m.mor=Math.min(100,m.mor+5);morAll(3);txt=`${r.crit?'¡Éxito crítico! ':'Éxito. '}${loot}.${xp}`+txt;questEvent({type:'poi',planet:info.p.name})}
  else{if(team.length){txt='La expedición regresa sin lograrlo.'+hurt(pick(team),15+(Math.random()*20|0))+(r.fumble?hurt(pick(team),15):'')+txt;morAll(-4)}else{D.st.hull=Math.max(1,D.st.hull-5);txt='El dron vuelve dañado (casco −5%).'}}
  saveD();return{ok:r.ok,line:r.line.replace(/<[^>]+>/g,''),txt,days,team:team.map(m=>m.nm).join(', ')||'Dron'};
}
function runExpedition(info,poiName,team){
  const R=resolveExpedition(info,poiName,team);modalOpen=false;closeModal();if(!R){toast('Este lugar ya fue explorado.');return}
  queueDialog({t:'Informe de expedición · '+poiName,who:team[0]||null,tx:R.txt,res:R.line,next:`${R.days} días · ${R.team}`});
  if(Math.random()<.2){const st=shipStar(),ev=pickEvent('arr',{star:st});if(ev)queueDialog({ev,ctx:{star:st}})}refresh();
}

function orbitDo(key,days,fn,limit=3){
  if(limit&&(D.ex[key]||0)>=limit)return'Ya no queda nada aprovechable aquí.';
  passDays(days);if(limit)D.ex[key]=(D.ex[key]||0)+1;const msg=fn();saveD();return msg+` (${days} días)`;
}
function doOrbit(act,i){
  const st=shipStar();if(st.point)return'No hay ningún sistema aquí.';
  const S=genSystem(st),sk=sSeed(st),sp=SPEC[D.ship.d],s=D.st;
  if(act==='fuel'){if(!infected(st))return'Esta estrella no tiene astrófago.';if(s.fuel>=sp.tank)return'Los tanques ya están llenos.';
    return orbitDo(sk+':-1',30,()=>{const v=+(Math.min(sp.tank-s.fuel,sp.tank*.35)).toFixed(1);s.fuel+=v;questEvent({type:'harvest',what:'fuel'});return`Los colectores capturan ${v} t de astrófago en la línea Petrova.`})}
  if(act==='rest')return orbitDo(sk+':rest',10,()=>{morAll(12);return'La tripulación descansa. Moral +12.'},0);
  if(act==='rep'){if(s.min<10)return'Faltan minerales para reparar.';if(s.hull>=100)return'El casco está intacto.';return orbitDo(sk+':rep',5,()=>{s.min-=10;s.hull=Math.min(100,s.hull+12);return'Casco reparado +12%.'},0)}
  if(act==='earth'){if(!(st.anchor&&st.anchor.id==='sol'))return'Sólo se puede reabastecer en la Tierra.';return orbitDo(sk+':earth',60,()=>{s.fuel=sp.tank;s.prov=sp.prov;s.hull=100;morAll(20);for(const m of alive())m.hp=100;return'Tanques llenos, despensa completa, casco nuevo.'},0)}
  if(act==='scan'){const info=planetInfo(S,i);return orbitDo(info.key+':scan',2,()=>{D.scan[info.key]=1;return`Escaneo de ${info.p.name} completado.`},0)}
  if(act==='scanall'){const n=S.planets.filter((p,k)=>!D.scan[planetInfo(S,k).key]).length;if(!n)return'Todos los planetas ya están escaneados.';return orbitDo(sk+':scanall',2*n,()=>{S.planets.forEach((p,k)=>D.scan[planetInfo(S,k).key]=1);return`${n} planeta${n>1?'s':''} escaneado${n>1?'s':''}.`},0)}
  if(act==='gas'){const info=planetInfo(S,i);return orbitDo(info.key+':gas',4,()=>{const r=roll('cie',10);if(r.ok){s.fuel=Math.min(sp.tank,s.fuel+sp.tank*.1);return'La sonda atmosférica recoge volátiles: +10% de combustible.'+gainXp(r.m,10)}return'La sonda se pierde en las tormentas.'},1)}
  return'';
}
function orbitAct(act,i,label){cmd({k:'orbit',act,i},label)}

/* ═════════ Plan de viaje: paradas en orden con tareas en cada una ═════════ */
const TASKS={fuel:'Recolectar astrófago',rest:'Descansar',rep:'Reparar casco',scanall:'Escanear todos los planetas',earth:'Reabastecer en la Tierra'};
function getPlan(){if(NET&&NET.role==='client'){NET.myPlan=NET.myPlan||{stops:[]};return NET.myPlan}D.plan=D.plan&&Array.isArray(D.plan.stops)?D.plan:{stops:[]};return D.plan}
const stopStar=s=>starFromSeed(s.s)||pointFromSeed(s.s);
function taskLabel(t,st){if(t.startsWith('explore:')){const i=+t.split(':')[1],S=st&&!st.point?genSystem(st):null;return'Aterrizar y explorar '+(S&&S.planets[i]?S.planets[i].name:'planeta '+i)}
  if(t.startsWith('civ:')){const i=+t.split(':')[1],S=st&&!st.point?genSystem(st):null,c=S&&civInfo(S,i);return'Contactar '+(c?'a los '+c.name:'civilización')}return TASKS[t]||t}
function taskOptions(st){
  if(!st||st.point)return[];const S=genSystem(st),o=[['rest',TASKS.rest],['rep',TASKS.rep],['scanall',TASKS.scanall]];
  if(infected(st))o.unshift(['fuel',TASKS.fuel]);if(st.anchor&&st.anchor.id==='sol')o.push(['earth',TASKS.earth]);
  S.planets.forEach((p,i)=>{if(p.kind!=='gas'&&p.kind!=='icegiant')o.push(['explore:'+i,'Aterrizar y explorar '+p.name]);const c=civInfo(S,i);if(c&&c.tech>0&&!c.home)o.push(['civ:'+i,'Contactar a los '+c.name])});
  return o;
}
function addToPlan(st,task){
  const P=getPlan(),seed=seedOf(st);let stop=P.stops.length&&P.stops[P.stops.length-1].s===seed?P.stops[P.stops.length-1]:null;
  if(!stop){stop={s:seed,a:[]};P.stops.push(stop)}if(task&&!stop.a.includes(task))stop.a.push(task);saveD();
  toast(`Añadido al plan: <b>${esc(starName(st))}</b>${task?' · '+esc(taskLabel(task,st)):''}`,'Ver plan',()=>{toggleDrawer(true);setTab('plan')});
}
/* Simulación del plan completo: rutas entre paradas + recursos estimados con las tareas */
function simulatePlan(){
  const P=getPlan(),sp=SPEC[D.ship.d],s={...D.st},out=[];let from=shipStar(),tot={d:0,tau:0,tE:0,jumps:0},bad='';
  for(const [k,stop] of P.stops.entries()){
    const st=stopStar(stop);if(!st){out.push({stop,err:'Semilla no válida'});bad=bad||'Semilla no válida';continue}
    let legs=[],err='';
    if(!sameStar(from,st)){const path=planRoute(from,st);if(!path)err=`No hay ruta (máx. ${fmtLen(legMax(D.ship.d))} por salto en 400 al)`;else for(let i=0;i<path.length-1;i++)legs.push(legCalc(path[i],path[i+1]))}
    for(const L of legs){if(err)break;tot.d+=L.d;tot.tau+=L.tau;tot.tE+=L.tE;tot.jumps++;const e=(()=>{if(L.d>legMax(D.ship.d)+1e-9&&!D.cr)return'salto demasiado largo';if(D.cr)return'';if(s.fuel+1e-9<L.fuel)return`faltará astrófago antes de ${starName(L.to)}`;if(sp.prov&&s.prov+1e-9<L.prov)return`faltarán provisiones antes de ${starName(L.to)}`;return''})();
      if(e){err=e;break}if(!D.cr){s.fuel-=L.fuel;s.prov-=L.prov}if(sp.solar)s.fuel=sp.tank}
    if(!err)for(const t of stop.a){const c=crewCount();
      if(t==='fuel'&&infected(st)){s.fuel=Math.min(sp.tank,s.fuel+sp.tank*.35);s.prov-=c*30}
      else if(t==='rest')s.prov-=c*10;else if(t==='rep')s.prov-=c*5;else if(t==='scanall')s.prov-=c*8;
      else if(t==='earth'){s.fuel=sp.tank;s.prov=sp.prov}else if(t.startsWith('explore:'))s.prov-=c*15;else if(t.startsWith('civ:'))s.prov-=c*5;
      if(sp.prov)s.prov=Math.max(0,s.prov)}
    out.push({stop,st,legs,err,fuel:s.fuel,prov:s.prov});if(err&&!bad)bad=`Parada ${k+1}: ${err}`;from=st;
  }
  return{rows:out,tot,bad};
}
/* Ejecución automática del plan */
let planRun=null;
function runPlan(){const P=getPlan();if(!P.stops.length){toast('El plan está vacío.');return}cmd({k:'plan',plan:P.stops},'Ejecutar el plan de viaje ('+P.stops.length+' paradas)')}
function startPlanNow(stops){if(travel)return;if(stops)D.plan={stops:stops.map(s=>({s:String(s.s),a:(s.a||[]).map(String)}))};if(!D.plan.stops.length)return;if(pilot)stopPilot();planRun={i:0,stage:'go'};saveD();refresh()}
function stopPlan(msg){planRun=null;if(msg)queueDialog({t:'Plan de viaje',who:null,tx:msg,res:''});refresh()}
function stepPlan(){
  if(!planRun||travel||modalOpen||dq.length)return;const P=D.plan,stop=P.stops[planRun.i];
  if(!stop){stopPlan('Plan completado. Todas las paradas fueron visitadas.');return}
  const st=stopStar(stop);if(!st){stopPlan('Una parada tiene una semilla no válida.');return}
  if(planRun.stage==='go'){
    if(sameStar(shipStar(),st)){planRun.stage='tasks';return}
    const path=planRun.tried?null:planRoute(shipStar(),st);planRun.tried=1;
    if(!path){stopPlan(`No se pudo llegar a ${starName(st)}: no hay ruta posible.`);return}
    route=buildLegs(path);if(route.legs[0].err){const e=route.legs[0].err;route=null;stopPlan(`Plan detenido antes de ${starName(st)}: ${e}.`);return}
    if(mode!=='map')exitToMap();startTravelNow();planRun.stage='wait';return}
  if(planRun.stage==='wait'){planRun.tried=0;if(sameStar(shipStar(),st)){planRun.stage='tasks'}else{stopPlan(`El viaje se detuvo antes de llegar a ${starName(st)}.`)}return}
  if(planRun.stage==='tasks'){
    const msgs=[];for(const t of stop.a)msgs.push('• '+taskLabel(t,st)+': '+execTask(t));
    queueDialog({t:`Parada ${planRun.i+1} de ${P.stops.length}: ${starName(st)}`,who:pick(alive())||null,tx:msgs.join('\n')||'Sin tareas en esta parada.',res:'',next:P.stops[planRun.i+1]?'Siguiente: '+starName(stopStar(P.stops[planRun.i+1])||{name:'?',point:1}):'Última parada.'});
    planRun.i++;planRun.stage='go';saveD();refresh()}
}
function execTask(t){
  if(t.startsWith('explore:'))return exploreAll(+t.split(':')[1]);
  if(t.startsWith('civ:')){const i=+t.split(':')[1],a=[doCiv(i,'contact')];const S=genSystem(shipStar()),c=civInfo(S,i);if(c&&repOf(c)>=20){a.push(doCiv(i,'learn'))}return a.filter(Boolean).join(' ')}
  return doOrbit(t);
}
function exploreAll(i){
  const st=shipStar();if(st.point)return'No hay planeta aquí.';const S=genSystem(st),info=planetInfo(S,i);if(info.gas)return'Es un gigante gaseoso.';
  D.scan[info.key]=1;passDays(SPEC[D.ship.d].land?1:2);const out=[];
  for(const n of info.pois){if(D.ex[info.key+':'+n])continue;const R=resolveExpedition(info,n,bestTeam(POI[n].k));if(R)out.push(`${n}: ${R.ok?'✓':'✗'} ${R.txt}`)}
  return out.length?out.join(' | '):'Nada nuevo por explorar.';
}
function renderPlan(){
  const el=$('#p-plan'),P=getPlan(),sim=simulatePlan(),client=NET&&NET.role==='client';ACTS=[];
  let h=`<div class="kick">PLAN DE VIAJE</div><h2>${P.stops.length?P.stops.length+' parada'+(P.stops.length>1?'s':''):'Sin paradas'}</h2>
  <p class="note">Selecciona una estrella en la carta y pulsa «+ Añadir al plan». En cada parada eliges qué hacer: recolectar astrófago, aterrizar y explorar un planeta, contactar una civilización, descansar… El plan calcula las rutas entre paradas y estima los recursos.</p>`;
  if(planRun)h+=`<p class="ok">▶ Ejecutando: parada ${planRun.i+1} de ${D.plan.stops.length}.</p><div class="row">${A('■ Detener el plan',()=>stopPlan('Plan detenido por la tripulación.'),0,'pri')}</div>`;
  if(P.stops.length){
    h+=`<div class="calc"><span>Distancia</span><span>${fmtLen(sim.tot.d)} · ${sim.tot.jumps} salto${sim.tot.jumps===1?'':'s'}</span><span>Tiempo a bordo</span><span>${fmtT(sim.tot.tau)}</span><span>Tiempo en la Tierra</span><span>${fmtT(sim.tot.tE)}</span><span>Viabilidad</span><span class="${sim.bad?'bad':'ok'}">${sim.bad?esc(sim.bad):'✓ Viable con las tareas previstas'}</span></div>`;
    h+=`<div class="lst">`;
    sim.rows.forEach((r,k)=>{const st=r.st,opts=taskOptions(st);
      h+=`<div class="item col ${r.err?'err':''}"><div class="rowi"><span class="dim">${k+1}</span><div class="m"><b>${st?esc(starName(st)):'?'}</b><i>${r.legs&&r.legs.length?r.legs.length+' salto'+(r.legs.length>1?'s':'')+' · '+fmtLen(r.legs.reduce((a,l)=>a+l.d,0)):'ya en el destino'}${!r.err&&st?` · llegas con ${r.fuel.toFixed(0)} t y ${fmtI(r.prov)} d-p`:''}${r.err?' · '+esc(r.err):''}</i></div>
        ${A('↑',()=>{if(k>0){[P.stops[k-1],P.stops[k]]=[P.stops[k],P.stops[k-1]];saveD();renderPlan()}},k===0)}${A('↓',()=>{if(k<P.stops.length-1){[P.stops[k+1],P.stops[k]]=[P.stops[k],P.stops[k+1]];saveD();renderPlan()}},k===P.stops.length-1)}${A('✕',()=>{P.stops.splice(k,1);saveD();renderPlan()})}</div>
        <div class="hzl">${r.stop.a.map((t,j)=>`<span class="tag">${esc(taskLabel(t,st))} ${A('✕',()=>{r.stop.a.splice(j,1);saveD();renderPlan()})}</span>`).join('')||'<span class="note">Sin tareas: sólo pasar por aquí.</span>'}</div>
        ${opts.length?`<div class="row"><select data-k="${k}"><option value="">+ Añadir tarea…</option>${opts.filter(o=>!r.stop.a.includes(o[0])).map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`:''}</div>`});
    h+=`</div><div class="row">${A(client?'🗳 Proponer este plan':'▶ Ejecutar plan',runPlan,!!planRun||!!travel,'pri')}${A('Ver en la carta',()=>{const r=sim.rows.find(r=>r.st);if(r)selectStar(r.st,true)})}${A('Vaciar plan',()=>{P.stops=[];saveD();renderPlan()})}</div>`;
  }
  el.innerHTML=h;bindActs(el);
  el.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{if(!s.value)return;P.stops[+s.dataset.k].a.push(s.value);saveD();renderPlan()});
}

/* ═════════ Comandos: lo que cambia la partida pasa por aquí (votación en sesión compartida) ═════════ */
function needVote(){return NET.role==='client'||(NET.role==='host'&&NET.demo&&NET.conns.size>0)}
function cmd(c,label){
  if(NET.role==='host'&&NET.conns.size>0&&(c.k==='travel'||c.k==='plan')){askRoute(c,label);return}
  logDM('Acción: '+(label||c.k),'cmd');
  if(needVote()){propose({kind:'cmd',title:label||'Acción',opts:['A favor','En contra'],cmd:c});toast('🗳 Propuesta enviada a votación: '+esc(label||''));return}
  const m=execCmd(c);if(m)toast(esc(m));refresh();
}
function askRoute(c,label){
  modalOpen=true;showModal(`<div class="kick">DECISIÓN DE RUMBO</div><h2>${esc(label||'Viaje')}</h2><p class="story">¿Cómo se decide este rumbo?</p>
  <div class="opts"><button class="pri" id="rY">Decido yo (director de partida)</button><button id="rV">Someterlo a votación de toda la tripulación</button><button id="no">Cancelar</button></div>`);
  $('#rY').onclick=()=>{modalOpen=false;closeModal();logDM('El director decide: '+label,'cmd');const m=execCmd(c);if(m)toast(esc(m));bcast({t:'toast',h:'🧭 El director fija el rumbo: <b>'+esc(label)+'</b>'});refresh()};
  $('#rV').onclick=()=>{modalOpen=false;closeModal();propose({kind:'cmd',title:label,opts:['A favor','En contra'],cmd:c})};
  $('#no').onclick=()=>{modalOpen=false;closeModal()};
}
function respFor(k){const on=new Set([NET.me,...NET.conns.keys()]);let b=null;for(const m of alive())if(m.pid&&on.has(m.pid)&&m.role===k&&(!b||eff(m,k)>eff(b,k)))b=m;return b?{pid:b.pid,m:b,pl:b.pl||((NET.players[b.pid]||{}).name)||'?'}:null}
function forceVote(id,o){const v=NET.votes.find(x=>x.id===id&&x.open);if(!v)return;v.ballots={[NET.me]:o};v.voters=[NET.me];v.forced=1;sysMsg(`El director impone «${v.opts[o]}» en «${v.title}».`);checkVotes()}
function execCmd(c){
  if(!c||typeof c!=='object')return'';
  if(c.k==='orbit')return doOrbit(String(c.act),c.i|0);
  if(c.k==='civ')return doCiv(c.i|0,String(c.a));
  if(c.k==='travel'){if(travel)return'Ya hay un viaje en curso.';const stars=(c.seeds||[]).map(s=>starFromSeed(s)||pointFromSeed(s)).filter(Boolean);if(stars.length<2)return'';stars[0]=shipStar();
    route=buildLegs(stars);const e=route.legs[0].err;if(e){route=null;return'No se puede saltar: '+e}startTravelNow();return''}
  if(c.k==='exp'){const st=shipStar();if(st.point)return'';const S=genSystem(st),info=planetInfo(S,c.i|0),team=alive().filter(m=>(c.team||[]).includes(m.id));runExpedition(info,String(c.poi),team);return''}
  if(c.k==='plan'){startPlanNow(c.plan);return'Plan de viaje en marcha.'}
  if(c.k==='rescue'){rescue('');return''}
  if(c.k==='ship'){return changeShip(String(c.d))}
  if(c.k==='fac')return doFac(c);
  if(c.k==='base')return doBase(c);
  return'';
}
function changeShip(k){
  const s=D.ship,st=D.st;if(!SHIPS[k]||k===s.d)return'';const nsp=SPEC[k];D.ship.d=k;Object.assign(st,{fuel:nsp.tank,prov:nsp.prov,hull:100,min:Math.min(st.min,nsp.cargo)});
  const a=alive();if(a.length>nsp.crew[1])a.slice(nsp.crew[1]).forEach(m=>m.st='perdido');st.extra=clamp(nsp.c0-Math.min(8,alive().length),0,Math.max(0,nsp.crew[1]-alive().length));
  while(crewCount()<nsp.crew[0]&&alive().length<6)addMember();if(crewCount()<nsp.crew[0])st.extra+=nsp.crew[0]-crewCount();saveD();return'Nueva nave: '+SHIPS[k].n;
}

/* ═════════ Fichas de Members (Corporación Ad Astra · credenciales) ═════════

  return createVote({...v,by:v.by||NET.me});
}
function createVote(v){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  NET.votes.push({id,by:v.by,byName:(NET.players[v.by]||{}).name||'?',kind:v.kind||'free',title:v.title,tx:v.tx||'',opts:v.opts&&v.opts.length?v.opts:['Sí','No'],cmd:v.cmd||null,ballots:{},dice:{},anon:!!NET.anon,open:true,ends:Date.now()+(v.kind==='ev'?60000:90000),voters:v.voters||null,who:v.who||''});
  sysMsg(v.voters?`🎭 Decide ${v.who}: ${v.title}`:`🗳 Nueva votación: ${v.title}`);bcast({t:'toast',h:'🗳 Nueva votación: <b>'+esc(v.title)+'</b>'});checkVotes();return id;
}
function castDice(id,pid,d){if(!(d>=1&&d<=6))return;if(NET.role==='client'){NET.host.send({t:'dice',id,d});return}const v=NET.votes.find(x=>x.id===id&&x.open);if(!v||!v.dice||pid in v.dice)return;v.dice[pid]=d;
  sysMsg(`🎲 ${v.anon?'Alguien':((NET.players[pid]||{}).name||'?')} tira el dado de fortuna en «${v.title}»: ${d} (${DIEM[d]>0?'+':''}${DIEM[d]}).`);if(NET.luckPaint)NET.luckPaint();netSync()}
function castVote(id,pid,o){if(NET.role==='client'){NET.myVotes[id]=o;NET.host.send({t:'vote',id,o});return}const v=NET.votes.find(x=>x.id===id&&x.open);if(!v||o<0||o>=v.opts.length)return;if(v.voters&&!v.voters.includes(pid)&&pid!==NET.me)return;v.ballots[pid]=o;checkVotes();netSync();renderSessDyn()}
function checkVotes(){
  if(NET.role!=='host')return;const everyone=[NET.me,...NET.conns.keys()];
  for(const v of NET.votes){if(!v.open)continue;let voters=v.voters&&v.voters.some(p=>everyone.includes(p))?v.voters.filter(p=>everyone.includes(p)):everyone;const all=voters.every(p=>p in v.ballots);if(!all&&Date.now()<v.ends)continue;
    const cnt=v.opts.map((_,i)=>Object.values(v.ballots).filter(b=>b===i).length),max=Math.max(...cnt);let w=cnt.indexOf(max);
    if(v.kind==='cmd'&&cnt[0]===cnt[1])w=1;if(!Object.keys(v.ballots).length&&v.kind==='ev')w=0;v.open=false;v.result=w;
    sysMsg(`Resultado de «${v.title}»: ${v.opts[w]} (${v.anon?cnt.join(' / ')+' · voto anónimo':v.opts.map((o,i)=>`${o}: ${Object.entries(v.ballots).filter(([,b])=>b===i).map(([p])=>(NET.players[p]||{}).name||'?').join(', ')||'—'}`).join(' · ')})`);
    if(v.kind==='cmd'&&w===0){const msg=execCmd(v.cmd);if(msg){toast(esc(msg));bcast({t:'toast',h:esc(msg)})}}
    if(v.kind==='ev'&&NET.vcb[v.id]){const f=NET.vcb[v.id];delete NET.vcb[v.id];f(w)}}
  const closed=NET.votes.filter(v=>!v.open);if(closed.length>12)NET.votes=NET.votes.filter(v=>v.open).concat(closed.slice(-12));refresh();
}
setInterval(()=>{if(NET.role==='host'&&NET.votes.some(v=>v.open))checkVotes();if(tab==='sess')renderSessDyn()},1000);

  ${spect?`<p class="note">Decide ${esc(v.who)}. Tu dado de fortuna también cuenta para la prueba.</p><div class="row"><button id="evHide">Ocultar</button></div>`:`<div class="opts">${v.opts.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join('')}</div><div class="note" id="vstat">${v.anon?'Voto secreto: nadie sabrá qué elegiste.':'Voto público: la tripulación verá qué elegiste.'}</div>`}`);

const DMLOG=[];
const DMICO={ev:'⚡',dlg:'📖',sys:'·',chat:'💬',cmd:'🧭'};
function logDM(h,k){
  const tx=String(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();if(!tx)return;
  const last=DMLOG[DMLOG.length-1];if(last&&last.tx===tx&&Date.now()-last.t<1500)return;
  DMLOG.push({t:Date.now(),tx,k:k||'sys'});if(DMLOG.length>400)DMLOG.shift();
  const L=document.getElementById('dmL');if(L&&document.getElementById('dmBox').classList.contains('show')){L.insertAdjacentHTML('beforeend',dmRow(DMLOG[DMLOG.length-1]));L.scrollTop=L.scrollHeight}
}
const dmRow=e=>`<div class="dmr dm-${e.k}"><span>${new Date(e.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</span> ${DMICO[e.k]||'·'} ${esc(e.tx)}</div>`;

  const b=document.getElementById('dmBox');b.classList.toggle('show',on);document.getElementById('logBtn').classList.toggle('on',on);
  if(on){const L=document.getElementById('dmL');L.innerHTML=DMLOG.map(dmRow).join('')||'<div class="dmr">Aún no ha pasado nada.</div>';L.scrollTop=L.scrollHeight}

/* ═════════ Bucle principal ═════════ */
let drag=null,prevCv=null;const prevSt={yaw:.8,pitch:.45,drag:null,last:0};
function frame(now){
  const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;
  if(travel)stepTravel(now);
  else if(planRun)stepPlan();
  if(!travel){
    if(keys.size&&mode==='map'&&CP){const s=cam.R*dt*(pilot?.5:.9);let mx=0,my=0,mz=0;
      if(keys.has('w')||keys.has('arrowup'))my++;if(keys.has('s')||keys.has('arrowdown'))my--;if(keys.has('a')||keys.has('arrowleft'))mx--;if(keys.has('d')||keys.has('arrowright'))mx++;if(keys.has('e'))mz++;if(keys.has('q'))mz--;
      if(mx||my||mz){const v=[(CP.cy*mx+CP.sy*my)*s,(-CP.sy*mx+CP.cy*my)*s,mz*s];lastInput=now;idleDone=false;
        if(pilot){const k2=keys.has('shift')?4:1;v[0]*=k2;v[1]*=k2;v[2]*=k2;const d=Math.hypot(...v);
          if(pilotConsume(d)){pilot.pos[0]+=v[0];pilot.pos[1]+=v[1];pilot.pos[2]+=v[2];pilot.dir=v.map(q=>q/d);pilot.moved+=d}else if(!pilot.warned){pilot.warned=1;toast('Sin astrófago para seguir avanzando. Busca una estrella con astrófago o activa el modo creativo.')}}
        else{tg.fx+=v[0];tg.fy+=v[1];tg.fz+=v[2]}}}
    if(pilot){tg.fx=cam.fx=pilot.pos[0];tg.fy=cam.fy=pilot.pos[1];tg.fz=cam.fz=pilot.pos[2]}
    if(opt.spin&&!pilot&&mode==='map'&&!drag&&now-lastInput>4000)tg.yaw+=dt*.04;
  }
  const k=1-Math.exp(-dt*(drag?30:6));
  cam.yaw+=(tg.yaw-cam.yaw)*k;cam.pitch+=(tg.pitch-cam.pitch)*k;cam.R=Math.exp(lerp(Math.log(cam.R),Math.log(tg.R),k));
  if(!travel){cam.fx+=(tg.fx-cam.fx)*k;cam.fy+=(tg.fy-cam.fy)*k;cam.fz+=(tg.fz-cam.fz)*k}
  if(mode==='map'&&needVis())buildVis();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#060708';ctx.fillRect(0,0,W,H);
  if(mode==='system')drawSystem(now);else if(mode==='surface')drawSurface(now);else drawMap(now);
  drawWarp(now);
  if(prevCv&&tab==='ship')drawPreview(now);
  if(now-lastUi>250){lastUi=now;updateHud()}
  if(!idleDone&&now-lastInput>2200){idleDone=true;saveView()}
  requestAnimationFrame(frame);
}

function pilotConsume(d){
  if(!d)return true;if(D.cr){D.st.ly+=d;return true}const sp=SPEC[D.ship.d],s=D.st,need=d*sp.burn;if(s.fuel<need)return false;
  s.fuel-=need;const days=d*365.25*.32;s.days+=days;s.yrs+=d*1.05;s.ly+=d;if(sp.prov)s.prov=Math.max(0,s.prov-crewCount()*days*(D.hib&&sp.hib?.15:1)*(1-(sp.farm||0)));return true;
}
function togglePilot(){
  if(travel)return;if(NET.role==='client'){toast('En la sesión compartida sólo el anfitrión pilota a mano. Propón un destino.');return}if(pilot){stopPilot();return}if(mode!=='map')exitToMap();
  if(crewCount()<SPEC[D.ship.d].crew[0]){toast('Tripulación insuficiente para pilotar.');return}
  const p=shipPos();pilot={pos:[p[0],p[1],p[2]],dir:null,moved:0};selStar=null;route=null;flyTo(p[0],p[1],p[2],Math.min(Math.max(tg.R,4),40));
  toast('Pilotaje libre: <b>WASD</b> mover · <b>Q/E</b> bajar/subir · <b>Shift</b> turbo · rueda = velocidad/zoom · <b>F</b> para detenerte');refresh();
}
function stopPilot(){
  const p=pilot.pos;let best=null,bd=.5;starsNear(p[0],p[1],p[2],.5,(s,d)=>{if(d<bd){bd=d;best=s}});
  const moved=pilot.moved;pilot=null;
  if(best){D.sp=seedOf(best);_sp='';toast(`Te detienes junto a <b>${esc(starName(best))}</b>`,'Entrar al sistema',()=>enterSystem(best))}
  else{D.sp=pointAt(p[0],p[1],p[2]).seed;_sp='';toast(`Nave detenida en el espacio profundo · recorriste ${fmtLen(moved)}`)}
  if(moved>0){D.st.jumps++;record('j',D.sp,true);if(best)questEvent({type:'arrive',star:best})}
  ping=performance.now();saveD();refresh();
}

  const done=()=>{modalOpen=false;closeModal();_sp='';const p=shipStar();if(!(Array.isArray(st.cm)&&st.v===3))flyTo(p.gx,p.gy,p.gz,20);selStar=null;route=null;mode='map';SYS=null;surf=null;refresh();toast('Partida cargada.')};
  $('#mFull').onclick=()=>{if(D.h.length&&!confirm('Esto sustituye tu partida local. ¿Seguro?'))return;
    D.h=st.h.sort((a,b)=>a.t-b.t);if(st.n)D.n=st.n;if(st.ship)D.ship=st.ship;if(st.sp)D.sp=st.sp;if(st.b)D.base=st.b;
    if(g){D.st=g;D.crew=st.crew;D.hib=st.flags.hib;D.cr=st.flags.cr;D.q=st.flags.q;D.anon=st.flags.anon;D.ex=st.ex;D.scan=st.scan;D.disc=st.disc;if(st.plan)D.plan=st.plan;D.rep=st.rep||{};if(st.fx)D.fx=st.fx;D.bases=st.bases||[];D.conv=st.conv||[];D.rutas=st.rutas||[];D.crewLogo=st.logo||null;updateCrewLogo()}
    if(Array.isArray(st.cm)&&st.cm.length===6&&st.cm.every(v=>isFinite(v))){[tg.fx,tg.fy,tg.fz,tg.R,tg.yaw,tg.pitch]=st.cm.map(Number);Object.assign(cam,tg)}
    if(Array.isArray(st.op)&&st.v===3){opt.color=!!st.op[0];opt.spin=!!st.op[1]&&!RM;opt.nav=!!st.op[2];opt.pet=!!st.op[3]}
    saveD();done()};
  $('#mMerge').onclick=()=>{const seen=new Set(D.h.map(e=>e.s+'|'+e.t));for(const e of st.h)if(!seen.has(e.s+'|'+e.t))D.h.push(e);D.h.sort((a,b)=>a.t-b.t);if(D.h.length>3000)D.h.splice(0,D.h.length-3000);
    if(st.disc)Object.assign(D.disc,st.disc);saveD();done()};
  $('#no').onclick=()=>{modalOpen=false;closeModal()};
}
async function handleHash(){
  const h=location.hash.slice(1),sm=h.match(/^sala=([A-Z2-9]{5})$/i);if(sm){history.replaceState(null,'',location.pathname+location.search);NET.wantJoin=sm[1].toUpperCase();toggleDrawer(true);setTab('sess');return}
  const m=h.match(/^(s|d)=(.*)$/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  if(m[1]==='s')gotoSeed(decodeURIComponent(m[2]));else{try{offerImport(await decodeState(m[2]))}catch(e){alert('El enlace de la partida está incompleto o dañado.')}}
}

},RM?0:1400);
