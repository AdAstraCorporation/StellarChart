<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Astra · Explorador de Semillas</title>
<meta name="description" content="Explorador interactivo de un mapa espacial generativo por semillas alfanuméricas. Sin servidor, sin cuenta.">
<style>
:root{--bg:#04060c;--panel:#0a101e;--panel2:#0e1730;--line:#1b2744;--tx:#cdd7ea;--dim:#7f8da8;--amb:#ffb454;--cy:#58d0ff;--ok:#7ee787;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--cy)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#3a2a0c;border-color:var(--amb);color:var(--amb)}
button.pri:hover{background:#4d3610}
button.sm{padding:2px 7px;font-size:12px}
input,select,textarea{background:#060b17;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,textarea:focus,select:focus{outline:1px solid var(--cy);border-color:var(--cy)}
#app{display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto 1fr;height:100dvh}
header{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{color:var(--amb);letter-spacing:.14em;font-weight:700;white-space:nowrap}
.logo small{color:var(--dim);font-weight:400;letter-spacing:.05em;margin-left:6px}
#seedForm{display:flex;gap:6px;flex:1;min-width:240px}
#seedIn{flex:1;text-transform:uppercase;letter-spacing:.12em;font-size:15px}
#stage{position:relative;overflow:hidden;min-height:0;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ov{position:absolute;z-index:2}
#crumb{left:10px;top:10px;display:flex;flex-wrap:wrap;gap:3px;max-width:calc(100% - 20px)}
#crumb button{padding:1px 7px;background:#0a1224cc;font-size:13px}
#crumb button.cur{border-color:var(--amb);color:var(--amb)}
#dpad{left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:3px}
#dpad button{padding:0;background:#0a1224cc}
#hint{right:10px;bottom:8px;color:var(--dim);font-size:12px;text-align:right;pointer-events:none;max-width:60%}
#tip{pointer-events:none;background:#050a16ee;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
#banner{right:10px;top:10px;background:#3a0f0fcc;border:1px solid var(--bad);color:#ffb3b3;padding:2px 8px;border-radius:6px;font-size:12px;display:none}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 4px;color:var(--dim)}
.tabs button.on{color:var(--amb);box-shadow:inset 0 -2px var(--amb)}
.pane{display:none;padding:12px;overflow:auto;flex:1}
.pane.on{display:block}
h2{margin:0 0 4px;font-size:17px;color:var(--cy);font-weight:600}
h3{margin:14px 0 6px;font-size:12px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.seed{font-size:18px;letter-spacing:.14em;color:var(--amb);word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.lst{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel2)}
.item .m{flex:1;min-width:0}
.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.item .m i{font-style:normal;color:var(--dim);font-size:12px}
.fav{color:var(--dim);background:none;border:0;padding:0 4px;font-size:16px}
.fav.on{color:var(--amb)}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--dim)}
.tag.hz{border-color:var(--ok);color:var(--ok)}
.tag.fx{border-color:var(--amb);color:var(--amb)}
.field{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:4px 0}
.field label{color:var(--dim);font-size:12px}
#qrBox{background:#fff;padding:10px;border-radius:8px;display:inline-block;line-height:0}
textarea{width:100%;height:70px;resize:vertical;font-size:11px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--amb);border-radius:10px;padding:16px;max-width:430px;width:100%}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
@media(max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 58vh minmax(0,1fr)}
  #seedForm{min-width:0;flex-basis:100%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .logo small{display:none}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">AD ASTRA<small>explorador de semillas</small></div>
  <form id="seedForm" autocomplete="off">
    <input id="seedIn" placeholder="Semilla: 7K3Q9  ·  con sector: 3,-2/7K3Q9" spellcheck="false" maxlength="40" aria-label="Semilla">
    <button class="pri" type="submit">Teletransportar</button>
    <button type="button" id="rndBtn" title="Semilla aleatoria">🎲</button>
  </form>
</header>

<section id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="crumb"></div>
  <div class="ov" id="banner">sin registro</div>
  <div class="ov" id="dpad">
    <span></span><button data-d="0,-1" title="Norte (↑)">▲</button><span></span>
    <button data-d="-1,0" title="Oeste (←)">◀</button><button id="upBtn" title="Subir un nivel (Retroceso)">⤒</button><button data-d="1,0" title="Este (→)">▶</button>
    <span></span><button data-d="0,1" title="Sur (↓)">▼</button><span></span>
  </div>
  <div class="ov" id="hint">Clic en una celda = añade su letra · teclas 0-9/A-Z · flechas = celdas vecinas · Retroceso = subir</div>
  <div class="ov" id="tip"></div>
</section>

<aside>
  <div class="tabs">
    <button data-t="info" class="on">Ubicación</button>
    <button data-t="hist">Bitácora</button>
    <button data-t="trav">Viajar</button>
    <button data-t="share">Compartir</button>
  </div>
  <div class="pane on" id="p-info"></div>
  <div class="pane" id="p-hist"></div>
  <div class="pane" id="p-trav"></div>
  <div class="pane" id="p-share"></div>
</aside>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script>

   * @param errorCorrectionLevel 'L','M','Q','H'

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _moduleCount = 0;

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);

      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

          } else {

      for (var r = 8; r < _moduleCount - 8; r += 1) {

          continue;
        }

      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

      qrSvg += '<path d="';

function fmtNum(n){return n>=1e9?(n/1e9).toFixed(1)+' mil M':n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?(n/1e3).toFixed(1)+' mil':Math.round(n).toString()}

/* ═════════ Semillas ⇄ coordenadas ═════════
   El espacio es un plano infinito de "teselas" de 4096 al. Cada letra (0-9A-Z = 36 símbolos)
   elige una celda de la rejilla 6×6 de la celda actual: 1 letra → 683 al, 2 → 114 al, 3 → 19 al … */
function seedStr(l){return (l.tx||l.ty?`${l.tx},${l.ty}/`:'')+l.path}
function parseSeed(s){
  s=(s||'').trim().toUpperCase();let tx=0,ty=0;
  const m=s.match(/^\(?\s*(-?\d+)\s*[,;]\s*(-?\d+)\s*\)?\s*(?:[\/:|·]\s*(.*))?$/);
  if(m){tx=+m[1];ty=+m[2];s=m[3]||''}
  s=s.replace(/[\s\-_.]/g,'');
  if(!/^[0-9A-Z]*$/.test(s))return{err:'Solo se admiten dígitos y letras A-Z.'};
  if(Math.abs(tx)>99999||Math.abs(ty)>99999)return{err:'El sector debe estar entre -99999 y 99999.'};
  let trunc=false;if(s.length>MAXD){s=s.slice(0,MAXD);trunc=true}
  return{loc:{tx,ty,path:s},trunc};
}
function cellOf(l){
  let s=TILE,x=-TILE/2,y=-TILE/2;
  for(const ch of l.path){const i=ALPHA.indexOf(ch);s/=B;x+=(i%B)*s;y+=Math.floor(i/B)*s}
  return{tx:l.tx,ty:l.ty,x0:x,y0:y,size:s,depth:l.path.length,path:l.path};
}
function pointToLoc(tx,ty,lx,ly,depth){
  while(lx>=TILE/2){lx-=TILE;tx++}while(lx<-TILE/2){lx+=TILE;tx--}
  while(ly>=TILE/2){ly-=TILE;ty++}while(ly<-TILE/2){ly+=TILE;ty--}
  let u=(lx+TILE/2)/TILE,v=(ly+TILE/2)/TILE,p='';
  for(let i=0;i<depth;i++){u*=B;v*=B;const c=clamp(Math.floor(u),0,B-1),r=clamp(Math.floor(v),0,B-1);u-=c;v-=r;p+=ALPHA[r*B+c]}
  return{tx,ty,path:p};
}
function globalToLoc(gx,gy,depth){const tx=Math.floor((gx+TILE/2)/TILE),ty=Math.floor((gy+TILE/2)/TILE);return pointToLoc(tx,ty,gx-tx*TILE,gy-ty*TILE,depth)}
const cellCenterG=c=>[c.tx*TILE+c.x0+c.size/2,c.ty*TILE+c.y0+c.size/2];

const SYL=['ka','ve','lo','mi','ra','tu','an','el','or','sha','zen','dor','nix','pha','lum','tor','vi','cae','ur','as','be','yn','th','qui'];
function genName(h){const r=rng(h^0x77aa);const n=2+(r()*2|0);let s='';for(let i=0;i<n;i++)s+=SYL[r()*SYL.length|0];return cap(s)}
const regionName=l=>genName(hash(l.tx,l.ty,...[...l.path].map(c=>ALPHA.indexOf(c)+1)));

  const r=rng(h^0xabcdef);let u=r(),c=CLS[0];for(const k of CLS){if(u<k.w){c=k;break}u-=k.w}
  const f=a=>lerp(a[0],a[1],r());
  return{k:c.k,lab:c.lab,T:Math.round(f(c.T)),mass:f(c.m),lum:c.L[0]*Math.pow(c.L[1]/c.L[0],r()),rad:f(c.R),col:c.col};
}

  planets:[{name:'Erid',a:.7,r:1.15,kind:'temperate',moons:0,hz:1,fiction:1,note:'Mundo natal de Rocky (ficción).'}]}];
function anchorSeed(a){return seedStr(globalToLoc(a.gx,a.gy,10))}

const starCache=new Map();
function starAt(i,j){
  const h=hash(i,j,77),r=rng(h),d=density((i+.5)*SC,(j+.5)*SC);
  if(r()>starP(d))return null;
  const st={i,j,h,gx:(i+r())*SC,gy:(j+r())*SC};
  if(Math.abs(st.gx)<40&&Math.abs(st.gy)<40)for(const a of ANCH)if(Math.hypot(a.gx-st.gx,a.gy-st.gy)<.8)return null;
  return st;
}
function starsIn(cell){
  const out=[],gx0=cell.tx*TILE+cell.x0,gy0=cell.ty*TILE+cell.y0,s=cell.size;
  const i0=Math.floor(gx0/SC),i1=Math.floor((gx0+s)/SC),j0=Math.floor(gy0/SC),j1=Math.floor((gy0+s)/SC);
  if((i1-i0+1)*(j1-j0+1)>2500)return out;
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const st=starAt(i,j);if(st&&st.gx>=gx0&&st.gx<=gx0+s&&st.gy>=gy0&&st.gy<=gy0+s)out.push(st)}
  for(const a of ANCH)if(a.gx>=gx0&&a.gx<=gx0+s&&a.gy>=gy0&&a.gy<=gy0+s)out.push({anchor:a,gx:a.gx,gy:a.gy,h:hash(a.id.length,a.gx*100|0,a.gy*100|0)});
  return out;
}
function starProps(st){return st.anchor?st.anchor.props:(starCache.get(st.h)||(starCache.set(st.h,genProps(st.h)),starCache.get(st.h)))}
const starName=st=>st.anchor?st.anchor.name:genName(st.h);
const starLoc=(st,d=10)=>globalToLoc(st.gx,st.gy,d);
function starInCell(cell){const e=cell.size*.02;return starsIn({...cell,x0:cell.x0-e,y0:cell.y0-e,size:cell.size+2*e})[0]||null}
function nearestStar(cell){
  const [cx,cy]=cellCenterG(cell);let best=null,bd=1e18;
  for(const R of[6,40]){
    const ci=Math.floor(cx/SC),cj=Math.floor(cy/SC);
    for(let j=cj-R;j<=cj+R;j++)for(let i=ci-R;i<=ci+R;i++){const st=starAt(i,j);if(st){const d=Math.hypot(st.gx-cx,st.gy-cy);if(d<bd){bd=d;best=st}}}
    for(const a of ANCH){const d=Math.hypot(a.gx-cx,a.gy-cy);if(d<bd){bd=d;best={anchor:a,gx:a.gx,gy:a.gy,h:hash(a.id.length,a.gx*100|0,a.gy*100|0)}}}
    if(best)break;
  }
  return best?{st:best,d:bd,dx:best.gx-cx,dy:best.gy-cy}:null;
}

/* ═════════ Sistemas planetarios ═════════ */
const KIND={lava:['Mundo de lava','#ff6a3d'],desert:['Mundo desértico','#d9a35b'],ocean:['Mundo oceánico','#3f8fe0'],temperate:['Rocoso templado','#58a96a'],
  ice:['Mundo helado','#a9d6e8'],frozen:['Mundo congelado','#c8d4e0'],barren:['Rocoso estéril','#9b9186'],gas:['Gigante gaseoso','#d8b48a'],icegiant:['Gigante helado','#6fb6d8']};
const ROMAN='bcdefghijk';
function genSystem(st){
  const P=starProps(st),a0=st.anchor,name=starName(st),r=rng(st.h^0x5eed),sq=Math.sqrt(P.lum);
  const frost=2.7*sq,hz=[.95*sq,1.4*sq];
  let planets=[],belts=[];
  if(a0&&!a0.proc){planets=a0.planets.map(p=>({...p}));belts=(a0.belts||[]).slice()}
  else{
    let n=P.k==='O'?0:P.k==='B'?(r()<.6?0:1+(r()*2|0)):P.k==='WD'||P.k==='RG'?(r()*4|0):(r()*9|0);
    let a=Math.max(.03,.13*sq)*(.5+r());
    for(let i=0;i<n&&a<90*Math.max(1,sq);i++){
      a*=1.35+r()*.75;
      const T=255*Math.pow(P.lum,.25)/Math.sqrt(a);let kind,rad;
      const hotg=a<frost*.5&&r()<.06;
      if(hotg||a>=frost*.9&&r()<.6){if(!hotg&&r()<.4){kind='icegiant';rad=2.5+r()*2.5}else{kind='gas';rad=6+r()*7}}
      else{rad=.3+Math.pow(r(),1.6)*1.7;
        if(T>700)kind='lava';else if(T>340)kind='desert';
        else if(T>=245){kind=(rad>.75&&rad<1.7&&r()<.5)?'ocean':(r()<.5?'temperate':'barren')}
        else if(T>170)kind=r()<.5?'ice':'barren';else kind='frozen'}
      planets.push({name:'',a,r:rad,kind,moons:kind==='gas'?(r()*7|0):kind==='icegiant'?(r()*4|0):(r()<.3?(r()*2|0)+1:0),ring:kind==='gas'&&r()<.25?1:0});
    }
    if(a0&&a0.planets)for(const c of a0.planets){planets=planets.filter(p=>Math.abs(p.a-c.a)/c.a>.3);planets.push({...c})}
    if(r()<.5&&P.k!=='O')belts.push([frost*(.55+.5*r()),frost*(.55+.5*r())+.4*sq+.2]);
  }
  planets.sort((x,y)=>x.a-y.a);
  planets.forEach((p,i)=>{
    p.name=p.name||`${name} ${ROMAN[i]||i}`;
    p.T=Math.round(255*Math.pow(P.lum,.25)/Math.sqrt(p.a));
    p.period=365.25*Math.sqrt(p.a**3/P.mass);
    const gas=p.kind==='gas'||p.kind==='icegiant';
    p.mass=gas?Math.pow(p.r,2.1)*(p.kind==='gas'?1.2:.9):Math.pow(p.r,3.2);
    p.g=p.mass/(p.r*p.r);
    if(p.hz==null)p.hz=(!gas&&p.a>=hz[0]&&p.a<=hz[1]&&p.r>=.7&&p.r<=1.7&&p.T>=240&&p.T<=320)?1:0;
    p.phase=hash(st.h,i)/4294967296*6.283;
  });
  return{star:st,name,P,planets,belts,hz,frost};
}

/* ═════════ Estado y persistencia ═════════ */
let D={v:1,n:'',h:[],base:'',anon:false};
try{const raw=localStorage.getItem(LS_KEY);if(raw)D=Object.assign(D,JSON.parse(raw))}catch(e){}
const saveD=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(D))}catch(e){}};
let loc={tx:0,ty:0,path:''};
try{if(D.c){const p=parseSeed(D.c);if(p.loc)loc=p.loc}}catch(e){}
let cell=cellOf(loc),mode='map',SYS=null,selStar=null,selPlanet=null,hoverIdx=-1,hits=[];
let anim=null,fade=0,recTimer=null,tab='info';

function record(kind,l,force){
  if(D.anon)return;
  const s=seedStr(l);const last=D.h[D.h.length-1];
  if(!force&&last&&last.s===s&&last.k===kind)return;
  D.h.push({s,t:Date.now(),k:kind,f:0,n:''});
  if(D.h.length>3000)D.h.splice(0,D.h.length-3000);
  D.c=seedStr(loc);saveD();if(tab==='hist')renderHist();
}
function scheduleRecord(){clearTimeout(recTimer);recTimer=setTimeout(()=>{if(mode==='map')record('m',loc)},1800)}

/* ═════════ Navegación ═════════ */
const FULL={fx:0,fy:0,fs:1};
const childWin=i=>({fx:(i%B)/B,fy:Math.floor(i/B)/B,fs:1/B});
function go(nl,opts={}){
  if(mode==='system')exitSystem(true);
  const old=loc,oc=cell,nc=cellOf(nl);loc=nl;cell=nc;selStar=null;
  const sameTile=old.tx===nl.tx&&old.ty===nl.ty;
  if(opts.animate!==false&&sameTile&&nl.path.length===old.path.length+1&&nl.path.startsWith(old.path)){
    anim={t0:performance.now(),dur:380,content:oc,from:FULL,to:childWin(ALPHA.indexOf(nl.path.at(-1))),after:null};cell=oc;anim.final=nc;
  }else if(opts.animate!==false&&sameTile&&old.path.length===nl.path.length+1&&old.path.startsWith(nl.path)){
    anim={t0:performance.now(),dur:380,content:nc,from:childWin(ALPHA.indexOf(old.path.at(-1))),to:FULL,final:nc};
  }else{fade=1}
  D.c=seedStr(loc);saveD();
  if(opts.record)record('m',loc,true);else scheduleRecord();
  syncUI();
}
function dive(ch){if(mode!=='map'||anim||loc.path.length>=MAXD)return;if(ALPHA.indexOf(ch)<0)return;go({...loc,path:loc.path+ch})}
function up(n=1){if(mode==='system'){exitSystem();return}if(anim||!loc.path.length)return;go({...loc,path:loc.path.slice(0,Math.max(0,loc.path.length-n))})}
function neighbor(dx,dy){
  if(mode!=='map'||anim)return;
  if(!loc.path.length){go({tx:loc.tx+dx,ty:loc.ty+dy,path:''},{animate:false});return}
  const [cx,cy]=cellCenterG(cell);go(globalToLoc(cx+dx*cell.size,cy+dy*cell.size,loc.path.length),{animate:false});
}
function teleport(nl,note){go(nl,{animate:false,record:true});toast(note||'')}
function teleportStr(s){
  const p=parseSeed(s);if(p.err){setMsg(p.err,1);return false}
  setMsg(p.trunc?`Semilla recortada a ${MAXD} caracteres (límite de precisión).`:'');teleport(p.loc);return true;
}
function enterSystem(st){
  const sl=starLoc(st);loc=sl;cell=cellOf(sl);
  SYS=genSystem(st);mode='system';selPlanet=null;anim=null;
  D.c=seedStr(loc);saveD();record('s',sl,true);syncUI();
}
function exitSystem(silent){if(mode!=='system')return;mode='map';SYS=null;selPlanet=null;if(!silent)syncUI()}

/* ═════════ Canvas ═════════ */
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(resize).observe(cv);
const sq=()=>{const P=Math.max(80,Math.min(W,H)-28);return{P,x:(W-P)/2,y:(H-P)/2}};
function tint(c){ // color de fondo para una celda, a partir de la densidad
  const [gx,gy]=cellCenterG(c),d=density(gx,gy),hh=hash(c.tx,c.ty,gx*7|0,gy*7|0)%60;
  return{d,col:`hsla(${205+hh},55%,${10+d*34}%,${.25+d*.55})`};
}
let tFrame=0;
function frame(now){
  tFrame=now;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  if(mode==='system')drawSystem(now);else drawMap(now);
  requestAnimationFrame(frame);
}
function drawMap(now){
  const {P,x:sx,y:sy}=sq();let win=FULL,c=cell;
  if(anim){const t=clamp((now-anim.t0)/anim.dur,0,1),e=ease(t);c=anim.content;
    const fs=Math.exp(lerp(Math.log(anim.from.fs),Math.log(anim.to.fs),e));
    // mantener continuidad de centro
    const cx=lerp(anim.from.fx+anim.from.fs/2,anim.to.fx+anim.to.fs/2,e),cy=lerp(anim.from.fy+anim.from.fs/2,anim.to.fy+anim.to.fs/2,e);
    win={fx:cx-fs/2,fy:cy-fs/2,fs};
    if(t>=1){cell=anim.final;c=cell;win=FULL;anim=null;syncInfo()}}
  const S=c.size,wx0=c.x0+win.fx*S,wy0=c.y0+win.fy*S,scale=P/(win.fs*S);
  const X=lx=>sx+(lx-wx0)*scale,Y=ly=>sy+(ly-wy0)*scale;
  ctx.save();ctx.beginPath();ctx.rect(sx,sy,P,P);ctx.clip();
  hits=[];
  const cs=S/B,px=cs*scale,starView=S<=64;
  const gxBase=c.tx*TILE,gyBase=c.ty*TILE;
  for(let i=0;i<36;i++){
    const col=i%B,row=(i/B)|0,x=X(c.x0+col*cs),y=Y(c.y0+row*cs);
    if(x>sx+P||y>sy+P||x+px<sx||y+px<sy)continue;
    const sub={tx:c.tx,ty:c.ty,x0:c.x0+col*cs,y0:c.y0+row*cs,size:cs,depth:c.depth+1,path:c.path+ALPHA[i]};
    const t=tint(sub);
    ctx.fillStyle=t.col;ctx.fillRect(x,y,px,px);
    if(!starView){ // polvo estelar decorativo, escala con la densidad
      const r=rng(hash(c.tx,c.ty,...[...sub.path].map(ch=>ALPHA.indexOf(ch))));const n=Math.round(t.d*26);
      ctx.fillStyle='rgba(205,220,255,.55)';
      for(let k=0;k<n;k++){const dx=x+r()*px,dy=y+r()*px,z=.4+r()*r()*1.4;ctx.fillRect(dx,dy,z,z)}
    }
    if(!anim&&i===hoverIdx){ctx.fillStyle='rgba(255,180,84,.14)';ctx.fillRect(x,y,px,px);ctx.strokeStyle='#ffb454';ctx.lineWidth=1.5;ctx.strokeRect(x+.5,y+.5,px-1,px-1)}
    if(px>34){ctx.fillStyle=`rgba(190,210,245,${clamp(px/260,.18,.5)})`;ctx.font=`${Math.min(px*.45,70)}px ui-monospace,Menlo,monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ALPHA[i],x+px/2,y+px/2)}
  }
  ctx.strokeStyle='rgba(110,150,210,.2)';ctx.lineWidth=1;
  for(let k=0;k<=B;k++){const a=X(c.x0+k*cs),b=Y(c.y0+k*cs);
    ctx.beginPath();ctx.moveTo(a,sy);ctx.lineTo(a,sy+P);ctx.moveTo(sx,b);ctx.lineTo(sx+P,b);ctx.stroke()}
  // estrellas reales de la celda visible
  if(starView){
    const list=starsIn(c);
    for(const st of list){
      const lx=st.gx-gxBase,ly=st.gy-gyBase,x=X(lx),y=Y(ly);if(x<sx||y<sy||x>sx+P||y>sy+P)continue;
      const p=starProps(st),rad=clamp(1.4+Math.log10(p.lum+1.2)*2.2,1.4,6)+(S<2?2:0);
      const g=ctx.createRadialGradient(x,y,0,x,y,rad*3.4);g.addColorStop(0,p.col);g.addColorStop(.25,p.col+'aa');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad*3.4,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,Math.max(1,rad*.5),0,7);ctx.fill();
      if(selStar&&selStar.gx===st.gx&&selStar.gy===st.gy){ctx.strokeStyle='#58d0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,rad*2.2+4,0,7);ctx.stroke()}
      if(st.anchor||S<8){ctx.font='12px ui-monospace,Menlo,monospace';ctx.textBaseline='middle';
        ctx.fillStyle=st.anchor?'#ffb454':'rgba(205,215,235,.75)';const lab=(st.anchor?'◆ ':'')+starName(st),flip=x>sx+P-150;
        ctx.textAlign=flip?'right':'left';ctx.fillText(lab,flip?x-rad*2.2-5:x+rad*2.2+5,y)}
      hits.push({x,y,r:Math.max(12,rad*3),st});
    }
  }else if(S<=1200){ // anclas visibles como marcadores a escalas amplias
    for(const a of ANCH){const x=X(a.gx-gxBase),y=Y(a.gy-gyBase);if(x<sx||y<sy||x>sx+P||y>sy+P)continue;
      ctx.fillStyle='#ffb454';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
      if(S<=130||a.id==='sol'){ctx.font='11px ui-monospace,Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(a.name,x+7,y)}}
  }
  ctx.restore();
  ctx.strokeStyle='rgba(88,208,255,.35)';ctx.lineWidth=1;ctx.strokeRect(sx+.5,sy+.5,P-1,P-1);
  if(fade>0){ctx.fillStyle=`rgba(4,6,12,${fade})`;ctx.fillRect(0,0,W,H);fade=Math.max(0,fade-.06)}
}

/* — Vista de sistema — */
function drawSystem(now){
  const S=SYS,P=S.P,cx=W/2,cy=H/2,Rmax=Math.min(W,H)/2-26,t=now/1000;
  const starPx=clamp(6+Math.log10(P.rad+1)*14,7,34);
  const all=S.planets.map(p=>p.a).concat(S.belts.flat());const amax=Math.max(...all,S.hz[1],.5)*1.12,amin=Math.min(...all,S.hz[0])*.55,a0=amin;
  const rp=a=>starPx+12+(Rmax-starPx-12)*Math.log(1+Math.max(a,0)/a0)/Math.log(1+amax/a0);
  // zona habitable
  {const ro=rp(S.hz[1]),ri=rp(S.hz[0]);ctx.beginPath();ctx.arc(cx,cy,ro,0,7);ctx.moveTo(cx+ri,cy);ctx.arc(cx,cy,ri,0,7);ctx.fillStyle='rgba(126,231,135,.08)';ctx.fill('evenodd')}
  for(const [a,b] of S.belts){const r=rng(hash(S.star.h,a*100|0));ctx.fillStyle='rgba(170,170,170,.55)';
    for(let k=0;k<160;k++){const ang=r()*6.283+t*.02,rr=lerp(rp(a),rp(b),r());ctx.fillRect(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,1.4,1.4)}}
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,starPx*3);g.addColorStop(0,P.col);g.addColorStop(.35,P.col+'88');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,starPx*3,0,7);ctx.fill();ctx.fillStyle=P.col;ctx.beginPath();ctx.arc(cx,cy,starPx,0,7);ctx.fill();
  hits=[];
  S.planets.forEach((p,i)=>{
    const R=rp(p.a);ctx.strokeStyle=p===selPlanet?'rgba(88,208,255,.6)':'rgba(120,150,200,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    const w=Math.min(1.6,.35*Math.pow(Math.max(p.a,.03),-.75)),ang=p.phase+t*w,x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    const pr=clamp(2.5+Math.log2(p.r+.5)*2.6,2.5,13),col=KIND[p.kind][1];
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,pr,0,7);ctx.fill();
    if(p.ring){ctx.strokeStyle='rgba(230,210,170,.7)';ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(x,y,pr*1.9,pr*.6,-.4,0,7);ctx.stroke()}
    if(p.hz){ctx.strokeStyle='#7ee787';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,pr+3,0,7);ctx.stroke()}
    if(p===selPlanet){ctx.strokeStyle='#58d0ff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,pr+6,0,7);ctx.stroke()}
    if(Rmax>150||p===selPlanet){ctx.font='11px ui-monospace,Menlo,monospace';ctx.fillStyle=p===selPlanet?'#58d0ff':'rgba(205,215,235,.65)';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(p.name.replace(S.name+' ',''),x+pr+5,y)}
    hits.push({x,y,r:Math.max(12,pr+6),planet:p});
  });
  ctx.font='12px ui-monospace,Menlo,monospace';ctx.fillStyle='rgba(126,231,135,.7)';ctx.textAlign='left';ctx.fillText('▮ zona habitable',12,H-16);
}

/* ═════════ Interacción del canvas ═════════ */
function cellIdxAt(mx,my){const {P,x,y}=sq();const u=(mx-x)/P,v=(my-y)/P;if(u<0||v<0||u>=1||v>=1)return-1;return Math.floor(v*B)*B+Math.floor(u*B)}
function hitAt(mx,my){let best=null,bd=1e9;for(const h of hits){const d=Math.hypot(h.x-mx,h.y-my);if(d<h.r&&d<bd){bd=d;best=h}}return best}
const tip=$('#tip');
function showTip(html,mx,my){tip.innerHTML=html;tip.style.display='block';const r=$('#stage').getBoundingClientRect();tip.style.left=Math.min(r.width-tip.offsetWidth-6,mx+14)+'px';tip.style.top=Math.max(4,my-30)+'px'}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointermove',e=>{
  if(anim)return;const [mx,my]=pos(e),h=hitAt(mx,my);
  if(h){hoverIdx=-1;cv.style.cursor='pointer';
    showTip(h.st?`★ ${esc(starName(h.st))} · ${esc(starProps(h.st).lab)}`:`● ${esc(h.planet.name)} · ${KIND[h.planet.kind][0]}`,mx,my);return}
  cv.style.cursor=mode==='map'?'crosshair':'default';
  if(mode!=='map'){tip.style.display='none';return}
  hoverIdx=cellIdxAt(mx,my);
  if(hoverIdx>=0&&loc.path.length<MAXD){const ch=ALPHA[hoverIdx],c=cellOf({...loc,path:loc.path+ch});showTip(`<b style="color:#ffb454">${ch}</b> → ${esc(regionName({...loc,path:loc.path+ch}))} · ${fmtLen(c.size)}`,mx,my)}else tip.style.display='none';
});
cv.addEventListener('pointerleave',()=>{hoverIdx=-1;tip.style.display='none'});
cv.addEventListener('click',e=>{
  if(anim)return;const [mx,my]=pos(e),h=hitAt(mx,my);
  if(h){
    if(h.st){selStar=h.st;syncInfo();setTab('info')}
    else{selPlanet=h.planet;syncInfo();setTab('info')}
    return}
  if(mode==='map'){const i=cellIdxAt(mx,my);if(i>=0)dive(ALPHA[i])}
});
cv.addEventListener('wheel',e=>{e.preventDefault();if(anim)return;if(e.deltaY>0)up();else if(mode==='map'){const i=cellIdxAt(...pos(e));if(i>=0)dive(ALPHA[i])}},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){closeModal();if(mode==='system')exitSystem();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowUp')neighbor(0,-1);else if(k==='ArrowDown')neighbor(0,1);else if(k==='ArrowLeft')neighbor(-1,0);else if(k==='ArrowRight')neighbor(1,0);
  else if(k==='Backspace')up();
  else if(k==='/'){e.preventDefault();$('#seedIn').focus()}
  else if(/^[0-9a-zA-Z]$/.test(k))dive(k.toUpperCase());
  else return;
  if(k.startsWith('Arrow'))e.preventDefault();
});
$('#dpad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='upBtn')up();else{const [dx,dy]=b.dataset.d.split(',').map(Number);neighbor(dx,dy)}});

function syncInfo(){
  const el=$('#p-info');
  if(mode==='system'){
    const S=SYS;
    el.innerHTML=`<h2>${esc(S.name)}</h2><div class="note">${esc(S.P.lab)} · ${S.planets.length} planeta${S.planets.length===1?'':'s'}${S.belts.length?` · ${S.belts.length} cinturón${S.belts.length>1?'es':''}`:''}</div>
    <div class="row"><button id="exitSys" class="pri">⤒ Salir al mapa</button></div>

    <h3>Planetas</h3><div class="lst">${S.planets.map((p,i)=>`<div class="item" data-p="${i}" style="cursor:pointer"><span style="color:${KIND[p.kind][1]}">●</span><div class="m"><b>${esc(p.name)}</b><i>${KIND[p.kind][0]} · ${p.a.toFixed(2)} UA${p.hz?' · habitable':''}</i></div></div>`).join('')||'<p class="note">Sin planetas conocidos.</p>'}</div>
    ${S.star.anchor&&S.star.anchor.proc?'<p class="note">Los planetas de este sistema se generan proceduralmente (excepto los marcados).</p>':''}

  }
  const c=cell,[gx,gy]=cellCenterG(c),d=density(gx,gy),dist=Math.hypot(gx,gy);
  const dens=d<.3?'Vacío profundo':d<.45?'Disperso':d<.6?'Moderado':d<.75?'Denso':'Cúmulo denso';
  const expect=c.size>64?Math.round(starP(d)*(c.size/SC)**2):null;
  let stars=[];if(c.size<=64)stars=starsIn(c);
  const inCell=c.depth>=10?starInCell(c):null;
  let near='';
  if(!stars.length&&c.size<64){const n=nearestStar(c);if(n){const ang=Math.atan2(n.dy,n.dx);const arrow='→↘↓↙←↖↑↗'[Math.round(((ang+Math.PI*2)%(Math.PI*2))/(Math.PI/4))%8];
    near=`<h3>Estrella más cercana</h3><div class="item"><div class="m"><b>${esc(starName(n.st))}</b><i>${arrow} ${fmtLen(n.d)} · clase ${starProps(n.st).k}</i></div><button class="sm" id="goNear">Ir</button></div>`;window._near=n.st}}
  el.innerHTML=`<h2>${esc(regionName(loc))}</h2><div class="note">${DEPTH_NAMES[c.depth]||'Nivel '+c.depth} · nivel ${c.depth}/${MAXD} · celdas de ${fmtLen(c.size)}</div>

  <span>Densidad</span><span>${dens} (${Math.round(d*100)}%)</span>${expect!=null?`<span>Estrellas aprox.</span><span>~${fmtNum(expect)}</span>`:`<span>Estrellas aquí</span><span>${stars.length}</span>`}

  <p class="note">${c.depth<10?'Sigue añadiendo letras: a partir del nivel 10 una celda aísla una sola estrella.':''}</p>`;

  const cd=$('#cd'),upd=()=>{$('#cdl').textContent=`Profundidad ${cd.value} → celda de ${fmtLen(TILE/Math.pow(B,+cd.value))}`};cd.oninput=upd;upd();

}
function randomSeed(){
  const r=Math.random;const far=r()<.35;let l={tx:far?Math.round((r()-.5)*40):0,ty:far?Math.round((r()-.5)*40):0,path:''};
  const n=5+(r()*5|0);for(let i=0;i<n;i++)l.path+=ALPHA[r()*36|0];teleport(l);
}

/* ═════════ Compartir: enlace + QR ═════════ */
function baseUrl(){const b=(D.base||'').trim();if(b)return b.split('#')[0];return /^https?:/.test(location.protocol)?location.href.split('#')[0]:''}
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function pipe(u8,Ctor){const s=new Ctor('deflate-raw'),w=s.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(s.readable).arrayBuffer())}
async function encodeState(maxN){
  const st={v:1,n:D.n||'',c:seedStr(loc),h:D.h.slice(-maxN).map(e=>[e.s,Math.round(e.t/1000).toString(36),e.k,e.f?1:0,e.n||''])};
  const raw=new TextEncoder().encode(JSON.stringify(st));
  if(typeof CompressionStream!=='undefined')return 'z'+b64u(await pipe(raw,CompressionStream));
  return 'p'+b64u(raw);
}
async function decodeState(tok){
  const kind=tok[0],u8=unb64u(tok.slice(1));
  const raw=kind==='z'?await pipe(u8,DecompressionStream):u8;
  const st=JSON.parse(new TextDecoder().decode(raw));
  if(!st||st.v!==1||!Array.isArray(st.h))throw new Error('formato');
  st.h=st.h.map(a=>({s:String(a[0]||''),t:parseInt(a[1],36)*1000,k:a[2]==='s'?'s':'m',f:a[3]?1:0,n:String(a[4]||'').slice(0,120)}));
  return st;
}
let qrCache=null;
async function buildShare(){
  const base=baseUrl();let n=D.h.length,tok=await encodeState(n),full=base+'#d='+tok,fullLen=full.length;
  let qrText=full,qrN=n;
  const tryQr=t=>{const q=qrcode(0,'L');q.addData(t,'Byte');q.make();return q};
  let qr=null;
  while(true){try{qr=tryQr(qrText);break}catch(e){if(qrN<=0){qr=null;break}qrN=Math.floor(qrN*.8);tok=await encodeState(qrN);qrText=base+'#d='+tok}}
  return{full,fullLen,qr,qrN,total:n,base};
}
function drawQR(canvas,qr){
  const n=qr.getModuleCount(),m=Math.max(2,Math.floor(300/(n+8)));canvas.width=canvas.height=(n+8)*m;const c=canvas.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+4)*m,(r+4)*m,m,m);
}
async function renderShare(){
  const el=$('#p-share');
  el.innerHTML=`<div class="field"><label>Apodo</label><input id="nick" maxlength="24" placeholder="tu nombre de explorador" value="${esc(D.n||'')}"></div>
  <div class="field"><label>URL pública</label><input id="base" placeholder="https://…/ (para que el QR abra la herramienta)" value="${esc(D.base||'')}"></div>
  <div id="shareBody" class="note">Generando…</div>`;
  $('#nick').onchange=e=>{D.n=e.target.value.slice(0,24);saveD();renderShare()};
  $('#base').onchange=e=>{D.base=e.target.value.trim();saveD();renderShare()};
  const info=await buildShare();if(tab!=='share')return;
  const hasBase=!!info.base;
  $('#shareBody').innerHTML=`${hasBase?'':'<p class="bad">Estás abriendo el archivo localmente: escribe arriba la URL donde publiques la herramienta (p. ej. GitHub Pages) para que el enlace y el QR funcionen en otros dispositivos.</p>'}
  <h3>Todo tu historial en un enlace</h3>
  <textarea id="lnk" readonly>${esc(info.full)}</textarea>
  <div class="row"><button class="pri" id="cpl">Copiar enlace</button><span class="dim">${info.total} registros · ${info.fullLen.toLocaleString()} caracteres</span></div>
  <h3>QR</h3>
  ${info.qr?`<div id="qrBox"><canvas id="qr"></canvas></div>
   <div class="row"><button id="dlq">Descargar PNG</button></div>
   <p class="note ${info.qrN<info.total?'bad':''}">${info.qrN<info.total?`El QR tiene capacidad limitada: incluye los últimos ${info.qrN} de ${info.total} registros. El enlace y el archivo llevan todo.`:'Incluye todo el historial. Escanéalo con la cámara del otro dispositivo.'}</p>`
   :'<p class="bad">El QR no alcanza ni con el historial vacío (URL demasiado larga). Usa el enlace.</p>'}
  <h3>Archivo</h3><div class="row"><button id="exp">Exportar JSON</button><button id="imp">Importar JSON…</button><input type="file" id="impf" accept="application/json,.json" hidden></div>
  <h3>Solo esta ubicación</h3><div class="row"><button id="cps">Copiar enlace a ${esc(seedStr(loc)||'RAÍZ')}</button></div>`;
  if(info.qr)drawQR($('#qr'),info.qr);
  $('#cpl').onclick=()=>copy(info.full,'Enlace copiado');
  $('#cps').onclick=()=>copy(baseUrl()+'#s='+encodeURIComponent(seedStr(loc)),'Enlace copiado');
  if($('#dlq'))$('#dlq').onclick=()=>{const a=document.createElement('a');a.download='ad-astra-exploracion.png';a.href=$('#qr').toDataURL('image/png');a.click()};
  $('#exp').onclick=()=>{const blob=new Blob([JSON.stringify({v:1,n:D.n,c:seedStr(loc),h:D.h},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ad-astra-exploracion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||!Array.isArray(j.h))throw 0;
    offerImport({n:j.n||'',c:j.c||'',h:j.h.map(x=>({s:String(x.s||''),t:+x.t||Date.now(),k:x.k==='s'?'s':'m',f:x.f?1:0,n:String(x.n||'').slice(0,120)}))})}catch(_){alert('Archivo no válido.')}};
}
/* — importación — */
function closeModal(){$('#modal').style.display='none'}
function offerImport(st){
  const valid=st.h.filter(e=>parseSeed(e.s).loc);
  const m=$('#modal'),b=$('#modalBox');
  b.innerHTML=`<h2>Exploración recibida</h2><p>${st.n?`De <b>${esc(st.n)}</b>: `:''}<b>${valid.length}</b> registros${st.c?` · última posición <span class="seed" style="font-size:14px">${esc(st.c)}</span>`:''}.</p>
  <p class="note">Tu bitácora actual tiene ${D.h.length} registros.</p>
  <div class="row"><button class="pri" id="mMerge">Fusionar</button><button id="mRep">Reemplazar la mía</button><button id="mNo">Cancelar</button></div>`;
  m.style.display='flex';
  const finish=()=>{if(st.n&&!D.n)D.n=st.n;D.c=st.c||D.c;saveD();closeModal();const p=parseSeed(st.c);if(p.loc)go(p.loc,{animate:false});renderHist();if(tab==='share')renderShare()};
  $('#mMerge').onclick=()=>{const seen=new Set(D.h.map(e=>e.s+'|'+e.t));for(const e of valid)if(!seen.has(e.s+'|'+e.t))D.h.push(e);D.h.sort((a,b)=>a.t-b.t);if(D.h.length>3000)D.h.splice(0,D.h.length-3000);finish()};
  $('#mRep').onclick=()=>{if(D.h.length&&!confirm('Esto sustituye tu bitácora local. ¿Seguro?'))return;D.h=valid.sort((a,b)=>a.t-b.t);finish()};
  $('#mNo').onclick=closeModal;
}
async function handleHash(){
  const h=location.hash.slice(1);if(!h)return;
  const m=h.match(/^(s|d)=(.*)$/);if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  if(m[1]==='s'){teleportStr(decodeURIComponent(m[2]))}
  else{try{offerImport(await decodeState(m[2]))}catch(e){alert('El enlace de exploración está incompleto o dañado.')}}
}

/* ═════════ Arranque ═════════ */
$('#seedForm').addEventListener('submit',e=>{e.preventDefault();teleportStr($('#seedIn').value);$('#seedIn').blur()});
$('#rndBtn').onclick=randomSeed;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
resize();syncUI();setTab('info');requestAnimationFrame(frame);scheduleRecord();handleHash();
window.__adastra={parseSeed,cellOf,pointToLoc,globalToLoc,seedStr,starsIn,genSystem,anchorSeed,ANCH,encodeState,decodeState,get loc(){return loc},go,D:()=>D,teleportStr,enterSystem,starInCell,nearestStar,starProps,starLoc};
})();
