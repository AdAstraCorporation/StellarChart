<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Astra · Carta de Navegación Estelar</title>
<meta name="description" content="Simulador de rol espacial: carta estelar generativa e infinita por semillas, nave, tripulación, expediciones y eventos.">
<style>
:root{--bg:#060708;--panel:rgba(10,12,16,.86);--line:rgba(205,215,235,.16);--tx:#d6dce6;--dim:#6f7a8c;--cy:#78dcff;--amb:#e0aa46;--pet:#ff3b5c;--ok:#7ee787;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(14,18,26,.8);border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer;letter-spacing:.06em;transition:border-color .15s,background .15s,color .15s,transform .1s}
button:hover:not(:disabled){border-color:rgba(205,215,235,.5)}button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{border-color:var(--cy);color:var(--cy)}button.pri:hover:not(:disabled){background:rgba(120,220,255,.12)}
button.sm{padding:3px 8px;font-size:11px}
input,select,textarea{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:2px;padding:5px 8px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--cy)}
input[type=color]{padding:1px;height:28px;width:60px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ov{position:absolute;z-index:2}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
/* cabecera estilo carta */
#brand{left:18px;top:16px;max-width:330px}
#brand .t1{font-size:15px;letter-spacing:.42em;color:#f2f5fb}
#brand .t2{font-size:12px;letter-spacing:.08em;color:#c9d1dd;margin-top:2px}
#brand .t3{font-size:9px;letter-spacing:.24em;color:var(--dim);margin:3px 0 10px}
#seedForm{display:flex;gap:4px;margin-bottom:10px}
#seedIn{flex:1;text-transform:uppercase;letter-spacing:.14em;font-size:12px;width:190px}
#seedForm button{padding:4px 8px;font-size:11px}
.info{display:flex;flex-direction:column;gap:6px}
.info div{display:flex;flex-direction:column}.info span{font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}.info b{font-weight:400;font-size:13px;letter-spacing:.06em;color:#eef2f8}
#toggles{left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px}
#toggles button{font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:5px 12px;color:#8fa6c4;border-color:rgba(120,160,210,.35)}
#toggles button.on{color:#cfe6ff;border-color:rgba(160,200,255,.7);background:rgba(60,90,130,.25)}
#toggles button[data-o=pet].on{color:#ffd0d8;border-color:var(--pet);background:rgba(255,59,92,.18)}
#hud{right:18px;top:16px;width:200px;display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:right .3s ease}
#hud div{display:flex;flex-direction:column;text-align:right}
#hud span{font-size:9px;letter-spacing:.24em;color:var(--dim)}#hud b{font-weight:400;color:#eef2f8;font-size:12px}#hud em{font-style:normal;font-size:10px;color:var(--dim)}
.mt{display:block;height:3px;background:rgba(205,215,235,.12);margin:2px 0}.mt i{display:block;height:100%;transition:width .5s ease}
#views{left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:6px}
#views button{font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;color:#c9d1dd}
#foot{left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;letter-spacing:.24em;color:var(--dim);white-space:nowrap;pointer-events:none}
#foot em{color:var(--pet);font-style:normal;margin:0 6px}
#zoom{left:18px;bottom:28px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;height:32px;padding:0;font-size:15px}#zoom button.on{border-color:var(--cy);color:var(--cy)}
#ctr{right:18px;bottom:28px;font-size:10px;letter-spacing:.22em;padding:8px 14px;color:var(--cy);border-color:var(--cy);transition:right .3s ease}
#drawerBtn{right:18px;bottom:72px;font-size:10px;letter-spacing:.22em;padding:8px 14px;transition:right .3s ease}#drawerBtn.on{border-color:var(--amb);color:var(--amb)}
#backBtn{left:50%;top:50px;transform:translateX(-50%);display:none;font-size:10px;letter-spacing:.22em;padding:6px 14px}
#banner{left:18px;bottom:110px;color:var(--bad);font-size:10px;letter-spacing:.2em;display:none}#crTag{left:18px;bottom:96px;color:var(--amb);font-size:10px;letter-spacing:.2em;display:none}
#tip{pointer-events:none;background:rgba(6,8,12,.92);border:1px solid var(--line);padding:5px 9px;font-size:11px;display:none;white-space:nowrap}
#toast{left:50%;top:84px;transform:translateX(-50%);background:rgba(8,10,14,.94);border:1px solid rgba(120,220,255,.5);padding:8px 14px;display:none;max-width:min(560px,86%);z-index:4;text-align:center}
#toast.show{display:block;animation:boxIn .25s ease}#toast button{margin-left:8px}
#travel{left:50%;bottom:84px;transform:translateX(-50%);width:min(620px,80%);display:none;z-index:4;text-align:center}
#travel.show{display:block;animation:fadeIn .3s}
#travel .tl{font-size:10px;letter-spacing:.16em;color:#ffd0d8;margin-bottom:5px;text-shadow:0 0 8px #000}
#travel .tb{height:2px;background:rgba(255,255,255,.12)}#travel .tb i{display:block;height:100%;width:0;background:var(--pet)}
/* panel de mando (cajón) */
#drawer{position:absolute;right:0;top:0;bottom:0;width:390px;max-width:100%;z-index:5;background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s ease}
#drawer.open{transform:none}
@media(min-width:861px){#app:has(#drawer.open) #stage{right:390px}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px 2px;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:#fff;box-shadow:inset 0 -1px #fff}
.pane{display:none;padding:14px;overflow:auto;flex:1}.pane.on{display:block;animation:paneIn .28s ease both}
.kick{font-size:9px;letter-spacing:.28em;color:var(--dim);margin-bottom:2px}
h2{margin:0 0 6px;font-size:16px;font-weight:500;letter-spacing:.06em;color:#fff}
h3{margin:16px 0 6px;font-size:9px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-weight:400;border-top:1px solid var(--line);padding-top:10px}
.seed{letter-spacing:.14em;color:var(--amb);word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:6px 0}.kv span:nth-child(odd){color:var(--dim)}
.calc{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;border:1px solid var(--line);padding:9px;background:rgba(0,0,0,.35);margin:6px 0}.calc span:nth-child(odd){color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.lst{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:6px 8px;background:rgba(0,0,0,.25);transition:border-color .15s,transform .15s}
.item[data-a]{cursor:pointer}.item[data-a]:hover,.rowi:hover{border-color:rgba(205,215,235,.45)}
.item.col{flex-direction:column;align-items:stretch}.item.sel{border-color:var(--cy)}
.rowi{display:flex;gap:8px;align-items:center;cursor:pointer}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .m i{font-style:normal;color:var(--dim);font-size:11px;display:block}
.item.err{border-color:rgba(255,107,107,.6)}.item.pend{opacity:.5}.item.done b{color:var(--ok)}.item.cur{border-color:var(--amb)}.item.lock{opacity:.4}
.fav{color:var(--dim);background:none;border:0;padding:0 4px;font-size:15px}.fav.on{color:var(--amb)}
.note{color:var(--dim);font-size:11px;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.tag{display:inline-block;border:1px solid var(--line);padding:0 7px;font-size:10px;color:#c9d1dd;letter-spacing:.06em;margin:0 3px 3px 0}
.tag.pet{border-color:var(--pet);color:#ffb3c0}.tag.fx{border-color:var(--amb);color:var(--amb)}.tag.hz{border-color:var(--ok);color:var(--ok)}
.hzl{margin:4px 0}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:6px 0;cursor:pointer}
.res{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.res span:last-child{color:var(--dim)}
.scale-row{display:grid;grid-template-columns:120px 1fr 64px;gap:6px;align-items:center;font-size:11px;margin:3px 0}.scale-row span:last-child{text-align:right;color:var(--dim)}
.scale-row i{display:block;height:6px;background:rgba(205,215,235,.3)}.scale-row.me i{background:var(--cy)}.scale-row.me span{color:var(--cy)}
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ships button{padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;letter-spacing:.04em}.ships button.on{border-color:var(--cy);color:var(--cy)}
.field{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:5px 0}.field label{color:var(--dim);font-size:11px}
#shipPrev{width:100%;height:180px;display:block;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 80%,#141b28,#05070a 70%);cursor:grab;touch-action:none}
.card{border:1px solid var(--line);padding:10px;margin:8px 0;background:rgba(0,0,0,.25)}
.dh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pt{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);font-size:22px;background:rgba(255,255,255,.04);flex:none}
.stats{display:grid;grid-template-columns:86px 1fr 18px;gap:3px 6px;align-items:center;font-size:11px;margin-top:8px}.stats span:first-child{color:var(--dim)}
.sb{display:block;height:4px;background:rgba(205,215,235,.12)}.sb i{display:block;height:100%;background:#cfd6e2}.stats b{font-weight:400;text-align:right}
textarea{width:100%;height:64px;resize:vertical;font-size:10px}
#qrBox{background:#fff;padding:10px;display:inline-block;line-height:0}
/* diálogos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px;animation:fadeIn .2s}
#modal .box{background:rgba(10,12,16,.97);border:1px solid rgba(205,215,235,.35);padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:boxIn .25s ease}
.story{font-size:13px;line-height:1.6;color:#e6eaf1}.roll{font-size:11px;color:var(--amb);border-left:2px solid var(--amb);padding-left:8px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}.opts button{text-align:left;padding:8px 10px}
/* arranque */
#boot{position:fixed;inset:0;z-index:20;background:#060708;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .6s ease,visibility .6s}
#boot.out{opacity:0;visibility:hidden}
#boot .bx{border:1px solid rgba(205,215,235,.3);border-top-color:transparent;padding:36px 48px;text-align:center;position:relative}
#boot .bx::before{content:"";position:absolute;left:12px;right:0;top:0;height:1px;background:rgba(205,215,235,.3)}
#boot .bt{letter-spacing:.34em;color:#e6eaf1;font-size:12px}#boot .bs{letter-spacing:.22em;color:var(--dim);font-size:9px;margin-top:22px}
#boot .bl{width:240px;height:1px;background:rgba(205,215,235,.15);overflow:hidden;margin:22px auto 0}#boot .bl i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes boxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){
  #brand{left:10px;top:10px;max-width:58%}#brand .t2,#brand .t3{display:none}#seedIn{width:120px}
  .info{flex-direction:row;flex-wrap:wrap;gap:4px 12px}.info div:nth-child(n+3){display:none}
  #toggles{left:10px;top:112px;transform:none}#toggles button{padding:3px 7px;letter-spacing:.08em;font-size:9px}
  #hud{right:10px;top:10px;width:140px;gap:4px}#hud div:nth-child(n+4){display:none}
  #views{bottom:30px;gap:3px}#views button{padding:5px 6px;letter-spacing:.06em;font-size:9px}#foot{display:none}
  #zoom{left:10px;bottom:76px}#ctr{right:10px;bottom:76px}#drawerBtn{right:10px;bottom:120px}
  #drawer{top:auto;height:62vh;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
}
</style>
</head>
<body>
<div id="boot"><div class="bx"><div class="bt">INICIALIZANDO CATÁLOGO ESTELAR</div><div class="bl"><i></i></div><div class="bs">GENERADOR DETERMINISTA · CIELO COMPLETO</div></div></div>
<div id="app">
<section id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="brand">
    <div class="t1">AD ASTRA</div><div class="t2">Carta de navegación estelar</div><div class="t3">SEMILLAS · ECL J2000 · SOL-CENTRADA</div>
    <form id="seedForm" autocomplete="off"><input id="seedIn" placeholder="A-DD5PN" spellcheck="false" maxlength="48" aria-label="Semilla"><button class="pri" type="submit">IR</button><button type="button" id="rndBtn" title="Lugar aleatorio">⚄</button></form>
    <div class="info" id="info"></div>
  </div>
  <div class="ov" id="toggles"><button data-o="nav">◇ Navegación</button><button data-o="color">◇ Color</button><button data-o="pet">✦ Petrova</button></div>
  <div class="ov" id="hud"></div>
  <button class="ov" id="backBtn">⤒ VOLVER</button>
  <div class="ov" id="toast"></div>
  <div class="ov" id="travel"><div class="tl" id="trTxt"></div><div class="tb"><i id="trBar"></i></div></div>
  <div class="ov" id="views"><button data-v="sol">Sistema Solar</button><button data-v="traj">Trayectoria</button><button data-v="tau">Tau Ceti</button><button data-v="gal">Galáctica</button></div>
  <div class="ov" id="zoom"><button data-z="-1" title="Acercar">+</button><button data-z="1" title="Alejar">−</button><button id="spinBtn" title="Rotación automática">⟳</button></div>
  <button class="ov" id="drawerBtn">☰ MANDO</button>
  <button class="ov" id="ctr">◎ MI NAVE</button>
  <div class="ov" id="foot">ARRASTRA ORBITAR · RUEDA ZOOM · SHIFT DESPLAZAR · WASD VOLAR<em>/</em>AD ASTRA CORPORATION</div>
  <div class="ov" id="banner">SIN REGISTRO</div><div class="ov" id="crTag">MODO CREATIVO</div>
  <div class="ov" id="tip"></div>
</section>
<aside id="drawer">
  <div class="tabs"><button data-t="carta" class="on">Carta</button><button data-t="ship">Nave</button><button data-t="crew">Tripul.</button><button data-t="hist">Bitácora</button><button data-t="nav">Navegar</button><button data-t="share">Partida</button></div>
  <div class="pane on" id="p-carta"></div><div class="pane" id="p-ship"></div><div class="pane" id="p-crew"></div><div class="pane" id="p-hist"></div><div class="pane" id="p-nav"></div><div class="pane" id="p-share"></div>
</aside>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function passDays(n){
  const s=D.st,c=crewCount();if(!D.cr)s.prov=Math.max(0,s.prov-c*n);s.days+=n;s.yrs+=n/365.25;const med=best('med').v;
  for(const m of alive()){m.hp=Math.min(100,m.hp+n*(.3+med*.08));if(s.prov<=0&&c){m.hp=Math.max(5,m.hp-n*.8);m.mor=Math.max(0,m.mor-n*.6)}}
}

/* ═════════ Astrófago: estrellas infectadas (modo Petrova) ═════════ */
const INF=new Set(['sol','tceti','eeri','40eri','acen']);
const infected=s=>s.anchor?INF.has(s.anchor.id):PETROVA.has(s.P.k)&&hash(s.h,13)%4===0;

/* ═════════ Cálculo de viaje (relativista, aceleración constante con volteo a mitad de camino) ═════════ */
function legCalc(a,b){
  const sp=SPEC[D.ship.d],d=gd(a,b),acc=sp.acc*1.0323,x=d/2,tE=2*Math.sqrt(x*x+2*x/acc),ph=Math.acosh(1+acc*x),tau=2*ph/acc,days=tau*365.25;
  const prov=sp.prov?crewCount()*days*(D.hib&&sp.hib?.15:1)*(1-(sp.farm||0)):0;
  return{from:a,to:b,d,tE,tau,v:Math.tanh(ph),g:Math.cosh(ph),days,fuel:d*sp.burn,prov};
}
function legErr(L,s){
  const sp=SPEC[D.ship.d],ml=legMax(D.ship.d);
  if(L.d>ml+1e-9)return`el salto de ${fmtLen(L.d)} supera el alcance máximo (${fmtLen(ml)})`;
  if(crewCount()<sp.crew[0])return'tripulación insuficiente para operar la nave';
  if(s.hull<=0)return'casco destruido';if(D.cr)return'';
  if(s.fuel+1e-9<L.fuel)return`falta astrófago (${L.fuel.toFixed(1)} t necesarias, hay ${s.fuel.toFixed(1)} t)`;
  if(sp.prov&&s.prov+1e-9<L.prov)return`faltan provisiones (${fmtI(L.prov)} días-persona, hay ${fmtI(s.prov)})`+(sp.hib&&!D.hib?'; activa la hibernación':'');
  return'';
}
function buildLegs(stars){
  const legs=[],tot={d:0,tau:0,tE:0,fuel:0,prov:0},s={...D.st},sp=SPEC[D.ship.d];let bad=false;
  for(let i=0;i<stars.length-1;i++){const L=legCalc(stars[i],stars[i+1]);for(const k in tot)tot[k]+=L[k];
    if(bad)L.pend=1;else{L.err=legErr(L,s);if(L.err)bad=true;else{if(!D.cr){s.fuel-=L.fuel;s.prov-=L.prov}if(sp.solar)s.fuel=sp.tank}}legs.push(L)}
  return{stars,legs,tot,ok:!bad};
}
/* Ruta con A* sobre las estrellas de un corredor alrededor de la línea recta */
function planRoute(from,to){
  const ml=legMax(D.ship.d)*.999,D0=gd(from,to);if(D0<=ml)return[from,to];if(D0>400)return null;
  const rc=clamp(ml*1.6,12,45),u=[(to.gx-from.gx)/D0,(to.gy-from.gy)/D0,(to.gz-from.gz)/D0],cand=new Map(),key=s=>s.h+':'+Math.round(s.gx*1e3);
  const segD=(x,y,z)=>{const t=clamp((x-from.gx)*u[0]+(y-from.gy)*u[1]+(z-from.gz)*u[2],0,D0);return Math.hypot(x-from.gx-u[0]*t,y-from.gy-u[1]*t,z-from.gz-u[2]*t)};
  const lo=[Math.min(from.gx,to.gx)-rc,Math.min(from.gy,to.gy)-rc,Math.min(from.gz,to.gz)-rc],hi=[Math.max(from.gx,to.gx)+rc,Math.max(from.gy,to.gy)+rc,Math.max(from.gz,to.gz)+rc];
  for(let k=gi(lo[2]);k<=gi(hi[2]);k++)for(let j=gi(lo[1]);j<=gi(hi[1]);j++)for(let i=gi(lo[0]);i<=gi(hi[0]);i++){
    if(segD(-HALF+(i+.5)*SC,-HALF+(j+.5)*SC,-HALF+(k+.5)*SC)>rc+7)continue;for(const s of gridStars(i,j,k))if(segD(s.gx,s.gy,s.gz)<=rc)cand.set(key(s),s)}
  cand.set(key(from),from);cand.set(key(to),to);
  const B=new Map(),bk=(x,y,z)=>Math.floor(x/ml)+','+Math.floor(y/ml)+','+Math.floor(z/ml);
  for(const s of cand.values()){const k=bk(s.gx,s.gy,s.gz);(B.get(k)||B.set(k,[]).get(k)).push(s)}
  const g=new Map([[key(from),0]]),came=new Map(),open=[[D0,from]],done=new Set();let it=0;
  const push=(f,s)=>{open.push([f,s]);let i=open.length-1;while(i>0){const p=(i-1)>>1;if(open[p][0]<=open[i][0])break;[open[p],open[i]]=[open[i],open[p]];i=p}};
  const pop=()=>{const top=open[0],last=open.pop();if(open.length){open[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<open.length&&open[l][0]<open[m][0])m=l;if(r<open.length&&open[r][0]<open[m][0])m=r;if(m===i)break;[open[m],open[i]]=[open[i],open[m]];i=m}}return top};
  while(open.length&&it++<8000){
    const [,n]=pop(),nk=key(n);if(done.has(nk))continue;done.add(nk);
    if(nk===key(to)){const path=[n];let c=nk;while(came.has(c)){const p=came.get(c);path.unshift(p);c=key(p)}return path}
    const cx=Math.floor(n.gx/ml),cy=Math.floor(n.gy/ml),cz=Math.floor(n.gz/ml),gn=g.get(nk);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++){const arr=B.get((cx+a)+','+(cy+b)+','+(cz+c));if(!arr)continue;
      for(const m of arr){const mk=key(m);if(done.has(mk))continue;const d=gd(n,m);if(d>ml||d<1e-6)continue;const ng=gn+d+ml*.35;if(ng<(g.get(mk)??Infinity)){g.set(mk,ng);came.set(mk,n);push(ng+gd(m,to),m)}}}
  }
  return null;
}
function selectStar(s,fly){
  selStar=s;route=null;selPlanet=null;
  if(s&&!sameStar(s,shipStar())){const p=planRoute(shipStar(),s);route=p?buildLegs(p):{none:true}}
  if(fly&&s)flyTo(s.gx,s.gy,s.gz,Math.min(tg.R,16));
  if(s&&tab!=='carta')setTab('carta');renderPanel();
}

/* ═════════ Viaje animado ═════════ */
function startTravel(){
  if(!route||!route.legs||travel)return;const e=legErr(route.legs[0],D.st);if(e){toast('No se puede saltar: '+e);return}
  if(mode!=='map')exitToMap();travel={legs:route.legs.map(l=>({from:l.from,to:l.to})),i:0,t0:0,pos:null,int:0};route=null;$('#travel').classList.add('show');renderPanel();
}
function stepTravel(now){
  if(travel.wait)return;
  if(!travel.t0){const seg=travel.legs[travel.i],L=legCalc(seg.from,seg.to),e=legErr(L,D.st);if(e){endTravel('Viaje detenido: '+e);return}
    travel.leg=L;travel.t0=now;travel.dur=RM?600:clamp(1700+L.d*120,1900,4200);tg.R=clamp(L.d*.9,6,60);travel.evAt=Math.random()<.45?.5:2}
  const L=travel.leg,p=clamp((now-travel.t0)/travel.dur,0,1),e=ease(p),lift=Math.sin(Math.PI*e)*L.d*.18;
  travel.pos=[lerp(L.from.gx,L.to.gx,e),lerp(L.from.gy,L.to.gy,e),lerp(L.from.gz,L.to.gz,e)+lift];travel.int=Math.sin(Math.PI*p);

function applyLoot(lo,mult){
  const sp=SPEC[D.ship.d],s=D.st,out=[],rr=a=>lerp(a[0],a[1],Math.random())*mult;
  if(lo.min){const v=Math.round(rr(lo.min));s.min=Math.min(sp.cargo,s.min+v);out.push(`+${v} t minerales`)}
  if(lo.prov&&sp.prov){const v=Math.round(sp.prov*rr(lo.prov));s.prov=Math.min(sp.prov,s.prov+v);out.push(`+${fmtI(v)} días-persona de provisiones`)}
  if(lo.fuel){const v=+(sp.tank*rr(lo.fuel)).toFixed(1);s.fuel=Math.min(sp.tank,s.fuel+v);out.push(`+${v} t de astrófago`)}
  if(lo.mor){morAll(lo.mor);out.push(`moral +${lo.mor}`)}
  if(lo.crew&&crewCount()<sp.crew[1])out.push(addMember());
  if(lo.lore)out.push('«'+pick(LORE)+'»');

let drag=null,prevCv=null;const prevSt={yaw:.8,pitch:.45,drag:null,last:0};
function frame(now){
  const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;
  if(travel)stepTravel(now);
  else{
    if(keys.size&&mode==='map'&&CP){const s=cam.R*dt*.9;let mx=0,my=0,mz=0;
      if(keys.has('w')||keys.has('arrowup'))my++;if(keys.has('s')||keys.has('arrowdown'))my--;if(keys.has('a')||keys.has('arrowleft'))mx--;if(keys.has('d')||keys.has('arrowright'))mx++;if(keys.has('e'))mz++;if(keys.has('q'))mz--;
      if(mx||my||mz){tg.fx+=(CP.cy*mx+CP.sy*my)*s;tg.fy+=(-CP.sy*mx+CP.cy*my)*s;tg.fz+=mz*s;lastInput=now;idleDone=false}}
    if(opt.spin&&mode==='map'&&!drag&&now-lastInput>4000)tg.yaw+=dt*.04;
  }
  const k=1-Math.exp(-dt*(drag?30:6));
  cam.yaw+=(tg.yaw-cam.yaw)*k;cam.pitch+=(tg.pitch-cam.pitch)*k;cam.R=Math.exp(lerp(Math.log(cam.R),Math.log(tg.R),k));
  if(!travel){cam.fx+=(tg.fx-cam.fx)*k;cam.fy+=(tg.fy-cam.fy)*k;cam.fz+=(tg.fz-cam.fz)*k}
  if(mode==='map'&&needVis())buildVis();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#060708';ctx.fillRect(0,0,W,H);
  if(mode==='system')drawSystem(now);else if(mode==='surface')drawSurface(now);else drawMap(now);
  drawWarp(now);
  if(prevCv&&tab==='ship')drawPreview(now);
  if(now-lastUi>250){lastUi=now;updateHud()}
  if(!idleDone&&now-lastInput>2200){idleDone=true;saveView()}
  requestAnimationFrame(frame);
}

  if(mode==='map'&&!travel)record('m',focusLoc())}

const tip=$('#tip'),ptrs=new Map();
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function showTip(html,mx,my){tip.innerHTML=html;tip.style.display='block';const r=$('#stage').getBoundingClientRect();tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-6,mx+14))+'px';tip.style.top=Math.max(4,my-34)+'px'}
function pickStar(mx,my){let b=null,bd=12;for(const s of vis){if(s._f!==frameNo)continue;const d=Math.hypot(s._x-mx,s._y-my);if(d<bd){bd=d;b=s}}for(const s of ANCHSTARS){if(s._f!==frameNo)continue;const d=Math.hypot(s._x-mx,s._y-my)-3;if(d<bd){bd=d;b=s}}return b}
function pickPlanet(mx,my){for(const k of sysHits)if(Math.hypot(k.x-mx,k.y-my)<k.r)return k.planet;return null}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);lastInput=performance.now();idleDone=false;
  drag={x:e.clientX,y:e.clientY,moved:0,yaw:tg.yaw,pitch:tg.pitch,pan:e.shiftKey||e.button===2,f:[tg.fx,tg.fy,tg.fz]};
  if(ptrs.size===2){const a=[...ptrs.values()];drag.pinch={d0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),R0:tg.R,m:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],f:[tg.fx,tg.fy,tg.fz]};drag.moved=99}
});
function panFrom(f,dx,dy){if(!CP)return;const s=CP.dist/CP.F;tg.fx=f[0]-CP.cy*dx*s+CP.sp*CP.sy*dy*s;tg.fy=f[1]+CP.sy*dx*s+CP.sp*CP.cy*dy*s;tg.fz=f[2]+CP.cp*dy*s}
cv.addEventListener('pointermove',e=>{
  const [mx,my]=pos(e);
  if(drag&&ptrs.has(e.pointerId)){ptrs.set(e.pointerId,[e.clientX,e.clientY]);lastInput=performance.now();
    if(drag.pinch&&ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),m=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];tg.R=clamp(drag.pinch.R0*drag.pinch.d0/Math.max(20,d),1,3000);if(mode==='map')panFrom(drag.pinch.f,m[0]-drag.pinch.m[0],m[1]-drag.pinch.m[1]);return}
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(drag.moved>4&&mode==='map'){tip.style.display='none';if(drag.pan)panFrom(drag.f,dx,dy);else{tg.yaw=drag.yaw-dx*.006;tg.pitch=clamp(drag.pitch+dy*.006,-1.45,1.45)}}
    return}
  if(mode==='system'){const p=pickPlanet(mx,my);cv.style.cursor=p?'pointer':'default';if(p)showTip(`${esc(p.name)} · ${KIND[p.kind][0]}`,mx,my);else tip.style.display='none';return}
  if(mode!=='map'){tip.style.display='none';return}
  hoverStar=pickStar(mx,my);
  if(hoverStar){cv.style.cursor='pointer';const d=gd(shipStar(),hoverStar),sp=SPEC[D.ship.d],ok=d<=D.st.fuel/sp.burn||D.cr;
    showTip(`<b>${esc(starName(hoverStar))}</b> · ${hoverStar.P.k}<br><span class="dim">${fmtLen(d)} de tu nave · ${ok?'<span class="ok">al alcance</span>':d<=legMax(D.ship.d)?'falta astrófago':'requiere ruta'}${opt.pet&&infected(hoverStar)?' · <span style="color:#ff3b5c">astrófago</span>':''}</span>`,mx,my)}
  else if(shipHit&&Math.hypot(shipHit.x-mx,shipHit.y-my)<shipHit.r){cv.style.cursor='pointer';showTip('Tu nave · clic para centrar',mx,my)}
  else{cv.style.cursor=drag?'grabbing':'grab';tip.style.display='none'}
});
cv.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);if(ptrs.size)return;const d=drag;drag=null;if(!d||d.moved>=5)return;const [mx,my]=pos(e);
  if(mode==='system'){const p=pickPlanet(mx,my);if(p){selPlanet=p;setTab('carta');renderPanel()}return}
  if(mode!=='map')return;
  if(shipHit&&Math.hypot(shipHit.x-mx,shipHit.y-my)<shipHit.r){centerOnShip();return}
  const s=pickStar(mx,my);if(s)selectStar(s);
});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null});
cv.addEventListener('dblclick',e=>{if(mode!=='map')return;const s=pickStar(...pos(e));if(s)selectStar(s,true)});
cv.addEventListener('wheel',e=>{e.preventDefault();lastInput=performance.now();idleDone=false;tg.R=clamp(tg.R*Math.exp(clamp(e.deltaY,-200,200)*.0013),1,3000)},{passive:false});
const KEYS=new Set(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright']);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if(modalOpen){if(k==='escape'&&!dq.length&&$('#no'))$('#no').click();return}
  if(KEYS.has(k)){keys.add(k);e.preventDefault();return}
  if(k==='escape'){if(mode==='surface'){mode='system';surf=null;refresh()}else if(mode==='system')exitToMap();else{selStar=null;route=null;renderPanel()}}
  else if(k==='home'||k==='.')centerOnShip();
  else if(k==='+'||k==='=')tg.R=clamp(tg.R/1.4,1,3000);else if(k==='-')tg.R=clamp(tg.R*1.4,1,3000);
  else if(k==='enter'&&route&&!travel)startTravel();
  else if(k==='m')toggleDrawer();
  else if(k==='/'){e.preventDefault();$('#seedIn').focus()}
});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());

function centerOnShip(){if(travel)return;if(mode!=='map')exitToMap();const p=shipPos();flyTo(p[0],p[1],p[2],Math.max(legMax(D.ship.d)*1.3,8));ping=performance.now()}
$('#ctr').onclick=centerOnShip;
$('#zoom').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='spinBtn'){opt.spin=!opt.spin;syncToggles();saveView();return}tg.R=clamp(tg.R*(+b.dataset.z>0?1.5:1/1.5),1,3000);lastInput=performance.now()});
$('#toggles').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;opt[b.dataset.o]=!opt[b.dataset.o];syncToggles();saveView()});
function syncToggles(){document.querySelectorAll('#toggles button').forEach(b=>b.classList.toggle('on',!!opt[b.dataset.o]));$('#spinBtn').classList.toggle('on',opt.spin)}
$('#views').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||travel)return;if(mode!=='map')exitToMap();const T=A_BY('tceti'),S0=shipStar();
  if(b.dataset.v==='sol'){selStar=null;route=null;flyTo(SOL.gx,SOL.gy,SOL.gz,18,.5);renderPanel()}
  else if(b.dataset.v==='tau')selectStar(T,true);
  else if(b.dataset.v==='traj'){selectStar(T);flyTo((S0.gx+T.gx)/2,(S0.gy+T.gy)/2,(S0.gz+T.gz)/2,Math.max(gd(S0,T)*.85,8),.75)}
  else if(b.dataset.v==='gal'){flyTo(cam.fx,cam.fy,cam.fz,2500,.3)}
});
$('#backBtn').onclick=()=>{if(mode==='surface'){mode='system';surf=null;refresh()}else exitToMap()};
function toggleDrawer(force){const d=$('#drawer'),o=force!=null?force:!d.classList.contains('open');d.classList.toggle('open',o);$('#drawerBtn').classList.toggle('on',o)}
$('#drawerBtn').onclick=()=>toggleDrawer();

/* ═════════ Indicadores ═════════ */
const meter=(v,max,col)=>`<span class="mt"><i style="width:${clamp(v/max*100,0,100)}%;background:${col}"></i></span>`;
function updateHud(){
  const sp=SPEC[D.ship.d],s=D.st,c=crewCount(),aliveC=alive(),mor=aliveC.length?aliveC.reduce((a,m)=>a+m.mor,0)/aliveC.length:100,auton=sp.prov&&c?s.prov/(c*(D.hib&&sp.hib?.15:1)*(1-(sp.farm||0))):Infinity;
  let near=0;for(const v of vis)if(v._f===frameNo&&Math.hypot(v.gx-cam.fx,v.gy-cam.fy,v.gz-cam.fz)<=cam.R)near++;
  $('#info').innerHTML=`<div><span>RANGO</span><b>${fmtLen(cam.R)}</b></div><div><span>CAMPO CERCANO</span><b>${mode==='map'?fmtI(near):'—'}</b></div><div><span>SECTOR</span><b>${esc(focusLoc(0).head)}</b></div><div><span>DESTINO</span><b>${selStar?esc(starName(selStar)):'—'}</b></div>`;
  $('#hud').innerHTML=`<div><span>ASTRÓFAGO</span><b>${s.fuel.toFixed(1)} / ${sp.tank} t</b>${meter(s.fuel,sp.tank,'#e0aa46')}<em>alcance ${fmtLen(s.fuel/sp.burn)}</em></div>
   <div><span>PROVISIONES</span><b>${sp.prov?fmtI(s.prov)+' d-p':'—'}</b>${sp.prov?meter(s.prov,sp.prov,'#7ee787'):''}<em>${sp.prov?(isFinite(auton)?fmtI(auton)+' días':'∞'):'nave no tripulada'}${D.hib&&sp.hib?' · hibernación':''}</em></div>
   <div><span>TRIPULACIÓN</span><b>${c} / ${sp.crew[1]}</b>${meter(mor,100,mor<35?'#ff6b6b':'#78dcff')}<em>moral ${Math.round(mor)}%</em></div>
   <div><span>CASCO</span><b>${Math.round(s.hull)}%</b>${meter(s.hull,100,s.hull<35?'#ff6b6b':'#cfd6e2')}<em>minerales ${Math.round(s.min)} t</em></div>
   <div><span>MISIÓN</span><b>τ ${fmtT(s.days/365.25)}</b><em>Tierra ${(2026+s.yrs).toFixed(1)}</em></div>`;
  if(document.activeElement!==$('#seedIn'))$('#seedIn').value=seedStr(focusLoc());
  $('#banner').style.display=D.anon?'block':'none';$('#crTag').style.display=D.cr?'block':'none';
}
function refresh(){renderPanel();updateHud();syncToggles();$('#backBtn').style.display=mode==='map'?'none':'block';$('#views').style.visibility=mode==='map'?'visible':'hidden'}

/* ═════════ Panel de mando ═════════ */
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));if(t!=='ship')prevCv=null;renderPanel()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function renderPanel(){({carta:renderCarta,ship:renderShip,crew:renderCrew,hist:renderHist,nav:renderNav,share:renderShare})[tab]()}
let ACTS=[];const A=(label,fn,dis,cls)=>{ACTS.push(fn);return`<button class="sm ${cls||''}" data-a="${ACTS.length-1}" ${dis?'disabled':''}>${label}</button>`};
const bindActs=el=>el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ACTS[+b.dataset.a]());
function starKV(st){const P=st.P,ship=shipStar();return`<div class="kv"><span>Clase</span><span>${P.k} · ${esc(P.lab)}</span><span>Temperatura</span><span>${fmtI(P.T)} K</span><span>Luminosidad</span><span>${P.lum<.01?P.lum.toExponential(1):P.lum.toFixed(2)} L☉</span>
  <span>Masa · radio</span><span>${P.mass.toFixed(2)} M☉ · ${P.rad.toFixed(2)} R☉</span><span>Desde tu nave</span><span>${fmtLen(gd(ship,st))}</span><span>Desde el Sol</span><span>${fmtLen(Math.hypot(st.gx,st.gy,st.gz))}</span><span>Semilla</span><span class="seed">${esc(sSeed(st))}</span></div>`}
function renderCarta(){
  const el=$('#p-carta');ACTS=[];
  if(mode==='system')return systemPanel(el);if(mode==='surface')return surfacePanel(el);
  const ship=shipStar(),sp=SPEC[D.ship.d],ml=legMax(D.ship.d);let h='';
  if(travel){h+=`<div class="kick">EN TRÁNSITO</div><h2>Rumbo a ${esc(starName(travel.legs[travel.legs.length-1].to))}</h2><p class="note">Salto ${travel.i+1} de ${travel.legs.length}.${D.hib&&sp.hib?' La tripulación duerme en las cápsulas.':''}</p>${travel.legs.length>travel.i+1?A('Detenerse tras este salto',()=>{travel.legs.length=travel.i+1;renderPanel()}):''}`;el.innerHTML=h;bindActs(el);return}
  if(selStar){
    const s=selStar,here=sameStar(s,ship),inf=infected(s);
    h+=`<div class="kick">SISTEMA ESTELAR</div><h2 style="color:${opt.pet&&inf?'#ff3b5c':'#fff'}">${esc(starName(s))}</h2><div class="row">${s.anchor?'<span class="tag fx">mapa de la película</span>':''}${inf?'<span class="tag pet">astrófago</span>':''}${D.disc[sSeed(s)]?'<span class="tag hz">registrado</span>':''}</div>
    ${s.anchor?`<p class="note">${esc(s.anchor.blurb)}</p>`:''}${starKV(s)}`;
    if(here)h+=`<p class="ok">Tu nave está en este sistema.</p><div class="row">${A('Entrar al sistema',()=>enterSystem(s),0,'pri')}</div>`;
    else if(!route||route.none)h+=`<p class="bad">No hay ruta con saltos de hasta ${fmtLen(ml)} dentro de un corredor razonable${gd(ship,s)>400?' (máx. 400 al por plan)':''}. Prueba con un destino intermedio.</p><div class="row">${A('Ver sistema (sondeo remoto)',()=>enterSystem(s))}</div>`;
    else{
      const t=route.tot,L0=route.legs[0],err=route.legs.find(l=>l.err),vmax=Math.max(...route.legs.map(l=>l.v));
      h+=`<h3>Cálculo de navegación</h3><div class="calc"><span>Distancia</span><span>${fmtLen(t.d)} · ${route.legs.length} salto${route.legs.length>1?'s':''}</span>
      <span>Perfil</span><span>${sp.acc} g, volteo a mitad de camino</span><span>Velocidad máx.</span><span>${vmax.toFixed(vmax>.99?4:3)} c (γ ${Math.max(...route.legs.map(l=>l.g)).toFixed(1)})</span>
      <span>Tiempo a bordo</span><span>${fmtT(t.tau)}</span><span>Tiempo en la Tierra</span><span>${fmtT(t.tE)} · llegada ${(2026+D.st.yrs+t.tE).toFixed(1)}</span>
      <span>Astrófago</span><span class="${D.cr||t.fuel<=D.st.fuel?'ok':'bad'}">${t.fuel.toFixed(1)} t de ${D.st.fuel.toFixed(1)} t</span>
      <span>Provisiones</span><span class="${!sp.prov||D.cr||t.prov<=D.st.prov?'ok':'bad'}">${sp.prov?fmtI(t.prov)+' de '+fmtI(D.st.prov)+' días-persona':'no aplica'}</span></div>
      ${sp.hib?`<label class="chk"><input type="checkbox" id="hibT" ${D.hib?'checked':''}> Hibernación en cápsulas de coma (provisiones ×0,15, riesgo al despertar)</label>`:''}
      ${err?`<p class="bad">✗ ${esc(cap(err.err))}${route.legs.indexOf(err)>0?` (salto ${route.legs.indexOf(err)+1})`:''}</p>`:'<p class="ok">✓ Todo listo para el salto.</p>'}
      <div class="row">${A('▶ Iniciar viaje',startTravel,!!L0.err,'pri')}${A('Ver sistema',()=>enterSystem(s))}${A('Centrar',()=>flyTo(s.gx,s.gy,s.gz,Math.min(tg.R,16)))}</div>
      ${route.legs.length>1?`<h3>Escalas</h3><div class="lst">${route.legs.map((l,i)=>`<div class="item ${l.err?'err':l.pend?'pend':''}"><span class="dim">${i+1}</span><div class="m"><b>${esc(starName(l.to))}</b><i>${fmtLen(l.d)} · τ ${fmtT(l.tau)} · ${l.fuel.toFixed(1)} t${l.err?' · '+esc(l.err):''}</i></div></div>`).join('')}</div>`:''}`;
    }
    h+=`<div class="row">${A('Quitar selección',()=>{selStar=null;route=null;renderPanel()})}</div>`;
  }else{
    const fl=focusLoc(),list=[];starsNear(ship.gx,ship.gy,ship.gz,ml,(s,d)=>{if(!sameStar(s,ship))list.push([d,s])});list.sort((a,b)=>a[0]-b[0]);
    h+=`<div class="kick">REGIÓN</div><h2>${esc(regionName(fl))}</h2><div class="seed">${esc(seedStr(fl))}</div>
    <div class="kv"><span>Sector</span><span>${esc(fl.head)} · (${fl.sx}, ${fl.sy}, ${fl.sz})</span><span>Foco (x, y, z)</span><span>${[cam.fx,cam.fy,cam.fz].map(v=>v.toFixed(2)).join(', ')} al</span><span>Desde el Sol</span><span>${fmtLen(Math.hypot(cam.fx,cam.fy,cam.fz))}</span><span>Densidad</span><span>${Math.round(density(cam.fx,cam.fy,cam.fz)*100)}%</span></div>
    <div class="row">${A('Copiar semilla',()=>copy(seedStr(fl),'Semilla copiada'))}${A('Copiar enlace',()=>copy(baseUrl()+'#s='+encodeURIComponent(seedStr(fl)),'Enlace copiado'))}</div>
    <h3>Sistemas a un salto de ${esc(starName(ship))} (máx. ${fmtLen(ml)})</h3><div class="lst">${list.slice(0,14).map(([d,s],i)=>{ACTS.push(()=>selectStar(s,true));const ok=D.cr||d*sp.burn<=D.st.fuel;
      return`<div class="item" data-a="${ACTS.length-1}"><span style="color:${opt.pet&&infected(s)?'#ff3b5c':s.P.col}">●</span><div class="m"><b>${esc(starName(s))}</b><i>${s.P.k} · ${fmtLen(d)}${D.disc[sSeed(s)]?' · registrado':''}</i></div><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span></div>`}).join('')||'<p class="note">Ninguna estrella al alcance. Recolecta astrófago o cambia de nave.</p>'}</div>
    <p class="note">Clic en una estrella para calcular el salto. Doble clic para centrarla.</p>`;
  }
  el.innerHTML=h;bindActs(el);
  const hb=$('#hibT');if(hb)hb.onchange=()=>{D.hib=hb.checked?1:0;saveD();if(route&&route.stars)route=buildLegs(route.stars);renderPanel();updateHud()};
}
function systemPanel(el){
  const S=SYS,here=sameStar(S.star,shipStar()),sp=SPEC[D.ship.d],sk=sSeed(S.star),s=D.st;
  let h=`<div class="kick">SISTEMA · ${here?'EN ÓRBITA':'VISTA REMOTA'}</div><h2>${esc(S.name)}</h2><div class="note">${esc(S.P.lab)} · ${S.planets.length} planeta${S.planets.length===1?'':'s'}${S.belts.length?' · '+S.belts.length+' cinturón':''}</div>
  <div class="row">${A('⤒ Volver a la carta',exitToMap)}${!here?A('Trazar ruta hasta aquí',()=>{const st=S.star;exitToMap();selectStar(st,true)},0,'pri'):''}</div>`;
  if(here){
    const used=D.ex[sk+':-1']||0;h+=`<h3>Acciones en órbita</h3><div class="row">`;
    if(infected(S.star))h+=A(`Recolectar astrófago · 30 d (${3-used}/3)`,()=>orbitAct(sk+':-1',30,()=>{const v=+(sp.tank*.35).toFixed(1);s.fuel=Math.min(sp.tank,s.fuel+v);questEvent({type:'harvest',what:'fuel'});return`Los colectores capturan ${v} t de astrófago en la línea Petrova.`}),s.fuel>=sp.tank||used>=3,'pri');
    else h+=`<span class="note">Esta estrella no tiene astrófago.</span>`;
    h+=A('Descansar · 10 d',()=>orbitAct(sk+':rest',10,()=>{morAll(12);return'La tripulación descansa. Moral +12.'},0));
    h+=A(`Reparar casco · 5 d (10 t)`,()=>orbitAct(sk+':rep',5,()=>{s.min-=10;s.hull=Math.min(100,s.hull+12);return'Casco reparado +12%.'},0),s.min<10||s.hull>=100);
    if(S.star.anchor&&S.star.anchor.id==='sol')h+=A('Reabastecer en la Tierra · 60 d',()=>orbitAct(sk+':earth',60,()=>{s.fuel=sp.tank;s.prov=sp.prov;s.hull=100;morAll(20);for(const m of alive())m.hp=100;return'Tanques llenos, despensa completa, casco nuevo.'},0),0,'pri');
    h+=`</div>`;
  }else h+=`<p class="note">Datos de sondeo remoto. Viaja hasta aquí para escanear, aterrizar y recolectar.</p>`;
  h+=`<h3>Planetas</h3><div class="lst">`;
  S.planets.forEach((p,i)=>{
    const info=planetInfo(S,i),sc=D.scan[info.key]||!here&&false,open=p===selPlanet;ACTS.push(()=>{selPlanet=open?null:p;renderPanel()});
    h+=`<div class="item col ${open?'sel':''}"><div class="rowi" data-a="${ACTS.length-1}"><span style="color:${KIND[p.kind][1]}">●</span><div class="m"><b>${esc(p.name)}</b><i>${KIND[p.kind][0]} · ${p.a.toFixed(2)} UA${p.hz?' · habitable':''}${info.colony&&sc?' · colonia':''}</i></div></div>`;
    if(open){
      h+=`<div class="kv"><span>Temperatura</span><span>${p.T} K (${Math.round(p.T-273)} °C)</span><span>Gravedad</span><span>${p.g.toFixed(2)} g</span><span>Radio</span><span>${p.r.toFixed(2)} R⊕</span><span>Atmósfera</span><span>${esc(info.atm)}${info.breath?' · respirable':''}</span><span>Año</span><span>${p.period<700?p.period.toFixed(0)+' días':(p.period/365.25).toFixed(1)+' años'}</span><span>Lunas</span><span>${p.moons}${p.ring?' · anillos':''}</span></div>`;
      if(p.note)h+=`<p class="note">${esc(p.note)}</p>`;
      if(sc){h+=info.hz.length?`<div class="hzl">${info.hz.map(z=>`<span class="tag ${z[4]?'pet':''}" title="${esc(z[3])}">${esc(z[0])}</span>`).join('')}</div>`:'<p class="ok">Sin condiciones adversas.</p>';
        if(!info.gas)h+=`<p class="note">Puntos de interés: ${info.pois.map(n=>esc(n)+(D.ex[info.key+':'+n]?' ✓':'')).join(' · ')}</p>`}

}
async function encodeState(maxN){const raw=new TextEncoder().encode(JSON.stringify(snapshot(maxN)));if(typeof CompressionStream!=='undefined')return 'z'+b64u(await pipe(raw,CompressionStream));return 'p'+b64u(raw)}
async function decodeState(tok){const kind=tok[0],u8=unb64u(tok.slice(1)),raw=kind==='z'?await pipe(u8,DecompressionStream):u8;return normState(JSON.parse(new TextDecoder().decode(raw)))}
/* Partida: binario «ADA» + versión + bandera + deflate + CRC32 */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
async function packFile(){const raw=new TextEncoder().encode(JSON.stringify(snapshot(D.h.length)));let flag=0,body=raw;if(typeof CompressionStream!=='undefined'){body=await pipe(raw,CompressionStream);flag=1}
  const out=new Uint8Array(5+body.length+4);out.set([0x41,0x44,0x41,3,flag]);out.set(body,5);new DataView(out.buffer).setUint32(5+body.length,crc32(raw));return out}
async function unpackFile(buf){const u=new Uint8Array(buf);if(u.length<10||u[0]!==0x41||u[1]!==0x44||u[2]!==0x41)throw new Error('magic');
  const body=u.subarray(5,u.length-4),raw=u[4]===1?await pipe(body,DecompressionStream):body;if(new DataView(u.buffer,u.byteOffset).getUint32(u.length-4)!==crc32(raw))throw new Error('crc');
  return normState(JSON.parse(new TextDecoder().decode(raw)))}
async function downloadSave(){const u=await packFile(),blob=new Blob([u],{type:'application/octet-stream'}),a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');
  a.href=URL.createObjectURL(blob);a.download=`ad-astra-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.partida`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return u.length}
async function loadSaveFile(f){try{offerImport(await unpackFile(await f.arrayBuffer()))}catch(e){alert(e.message==='magic'?'Ese archivo no es una partida de Ad Astra.':'La partida está dañada (falló la verificación).')}}
async function buildShare(){
  const base=baseUrl();let n=D.h.length,tok=await encodeState(n),full=base+'#d='+tok,qrText=full,qrN=n,qr=null;
  const tryQr=t=>{const q=qrcode(0,'L');q.addData(t,'Byte');q.make();return q};
  while(true){try{qr=tryQr(qrText);break}catch(e){if(qrN<=0){qr=null;break}qrN=Math.floor(qrN*.7);tok=await encodeState(qrN);qrText=base+'#d='+tok}}
  return{full,fullLen:full.length,qr,qrN,total:n,base};
}
function drawQR(canvas,qr){const n=qr.getModuleCount(),m=Math.max(2,Math.floor(300/(n+8)));canvas.width=canvas.height=(n+8)*m;const c=canvas.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+4)*m,(r+4)*m,m,m)}
async function renderShare(){
  const el=$('#p-share');
  el.innerHTML=`<div class="kick">TRASLADAR LA PARTIDA</div><div class="field"><label>Apodo</label><input id="nick" maxlength="24" placeholder="tu nombre de capitán" value="${esc(D.n||'')}"></div>
  <div class="field"><label>URL pública</label><input id="base" placeholder="https://…/ (para que el QR abra la carta)" value="${esc(D.base||'')}"></div>
  <h3>Partida (archivo)</h3><p class="note">Archivo binario comprimido con toda la sesión: nave, recursos, tripulación, misiones, descubrimientos, bitácora y cámara. Cárgalo en otro dispositivo o arrástralo a la ventana.</p>
  <div class="row"><button class="pri" id="dls">⬇ Descargar partida</button><button id="lds">Cargar partida…</button><input type="file" id="ldf" hidden></div><div id="saveMsg" class="note"></div>
  <div id="shareBody" class="note">Generando enlace…</div>`;
  $('#nick').onchange=e=>{D.n=e.target.value.slice(0,24);saveD();renderShare()};$('#base').onchange=e=>{D.base=e.target.value.trim();saveD();renderShare()};
  $('#dls').onclick=async()=>{const n=await downloadSave();$('#saveMsg').textContent=`Partida descargada (${(n/1024).toFixed(1)} KB).`;$('#saveMsg').className='note ok'};
  $('#lds').onclick=()=>$('#ldf').click();$('#ldf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadSaveFile(f)};
  const info=await buildShare();if(tab!=='share'||!$('#shareBody'))return;
  $('#shareBody').innerHTML=`${info.base?'':'<p class="bad">Estás abriendo el archivo localmente: escribe arriba la URL donde publiques la carta (p. ej. GitHub Pages) para que el enlace y el QR funcionen en otros dispositivos.</p>'}
  <h3>Enlace con toda la partida</h3><textarea id="lnk" readonly>${esc(info.full)}</textarea><div class="row"><button class="pri" id="cpl">Copiar enlace</button><span class="dim">${info.fullLen.toLocaleString()} caracteres</span></div>
  <h3>QR</h3>${info.qr?`<div id="qrBox"><canvas id="qr"></canvas></div><div class="row"><button id="dlq">Descargar PNG</button></div><p class="note ${info.qrN<info.total?'bad':''}">${info.qrN<info.total?`Por capacidad, el QR lleva la partida completa pero sólo los últimos ${info.qrN} de ${info.total} registros de bitácora.`:'Incluye toda la partida.'}</p>`:'<p class="bad">La partida no cabe en un QR. Usa el archivo o el enlace.</p>'}`;
  if(info.qr)drawQR($('#qr'),info.qr);$('#cpl').onclick=()=>copy(info.full,'Enlace copiado');
  if($('#dlq'))$('#dlq').onclick=()=>{const a=document.createElement('a');a.download='ad-astra-partida.png';a.href=$('#qr').toDataURL('image/png');a.click()};
}
function offerImport(st){
  modalOpen=true;const g=st.game,sh=st.ship;
  showModal(`<div class="kick">PARTIDA RECIBIDA</div><h2>${st.n?esc(st.n):'Capitán sin nombre'}</h2>
  ${sh?`<div class="dh">${shipImg(sh.d,sh.c1,sh.c2,48)}<div><b>${esc(sh.n||SHIPS[sh.d].n)}</b><div class="note">${SHIPS[sh.d].n}${st.sp?' · en '+esc(starName(starFromSeed(st.sp))):''}</div></div></div>`:''}
  ${g?`<div class="kv"><span>Tripulación</span><span>${(st.crew||[]).filter(m=>m.st!=='perdido').length+g.extra}</span><span>Saltos</span><span>${g.jumps} · ${fmtLen(g.ly)}</span><span>Sistemas</span><span>${Object.keys(st.disc||{}).length}</span><span>Bitácora</span><span>${st.h.length} registros</span></div>`:`<p class="note">${st.h.length} registros de bitácora (formato antiguo).</p>`}
  <div class="row"><button class="pri" id="mFull">Cargar partida completa</button><button id="mMerge">Sólo fusionar bitácora</button><button id="no">Cancelar</button></div>`);
  const done=()=>{modalOpen=false;closeModal();_sp='';const p=shipStar();if(!(Array.isArray(st.cm)&&st.v===3))flyTo(p.gx,p.gy,p.gz,20);selStar=null;route=null;mode='map';SYS=null;surf=null;refresh();toast('Partida cargada.')};
  $('#mFull').onclick=()=>{if(D.h.length&&!confirm('Esto sustituye tu partida local. ¿Seguro?'))return;
    D.h=st.h.sort((a,b)=>a.t-b.t);if(st.n)D.n=st.n;if(st.ship)D.ship=st.ship;if(st.sp)D.sp=st.sp;if(st.b)D.base=st.b;
    if(g){D.st=g;D.crew=st.crew;D.hib=st.flags.hib;D.cr=st.flags.cr;D.q=st.flags.q;D.anon=st.flags.anon;D.ex=st.ex;D.scan=st.scan;D.disc=st.disc}
    if(Array.isArray(st.cm)&&st.cm.length===6&&st.cm.every(v=>isFinite(v))){[tg.fx,tg.fy,tg.fz,tg.R,tg.yaw,tg.pitch]=st.cm.map(Number);Object.assign(cam,tg)}
    if(Array.isArray(st.op)&&st.v===3){opt.color=!!st.op[0];opt.spin=!!st.op[1]&&!RM;opt.nav=!!st.op[2];opt.pet=!!st.op[3]}
    saveD();done()};
  $('#mMerge').onclick=()=>{const seen=new Set(D.h.map(e=>e.s+'|'+e.t));for(const e of st.h)if(!seen.has(e.s+'|'+e.t))D.h.push(e);D.h.sort((a,b)=>a.t-b.t);if(D.h.length>3000)D.h.splice(0,D.h.length-3000);
    if(st.disc)Object.assign(D.disc,st.disc);saveD();done()};
  $('#no').onclick=()=>{modalOpen=false;closeModal()};
}
async function handleHash(){
  const h=location.hash.slice(1),m=h.match(/^(s|d)=(.*)$/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  if(m[1]==='s')gotoSeed(decodeURIComponent(m[2]));else{try{offerImport(await decodeState(m[2]))}catch(e){alert('El enlace de la partida está incompleto o dañado.')}}
}

/* ═════════ Arranque ═════════ */
$('#seedForm').addEventListener('submit',e=>{e.preventDefault();gotoSeed($('#seedIn').value);$('#seedIn').blur()});
$('#rndBtn').onclick=randomPlace;
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f){e.preventDefault();loadSaveFile(f)}});
resize();toggleDrawer(innerWidth>1100);setTab('carta');refresh();requestAnimationFrame(frame);handleHash();
setTimeout(()=>{const b=$('#boot');if(b){b.classList.add('out');setTimeout(()=>b.remove(),700)}
  if(!D.intro){D.intro=1;saveD();queueDialog({t:'Corporación Ad Astra · Orden de misión',who:alive()[0]||null,tx:`Capitán: el Sol pierde brillo y nadie sabe por qué, salvo que hay algo —lo llaman astrófago— alimentándose de su luz. Tau Ceti, a 11,9 años luz, parece inmune. Tu nave y tu tripulación están listas. Cada salto cuesta astrófago, provisiones y años. Elige bien.`,res:'Primera misión: '+QUESTS[0].t,next:'Consejo: selecciona una estrella en la carta para calcular el salto.'})}
},RM?0:1400);
window.__adastra={D:()=>D,cam,tg,selectStar,startTravel,get travel(){return travel},get route(){return route},ANCHSTARS,enterSystem,land,planetInfo,get SYS(){return SYS},openExpedition,packFile,unpackFile,gotoSeed,shipStar,A_BY,questEvent,crewCount,get mode(){return mode},setTab,exitToMap,centerOnShip};
})();
</script>
