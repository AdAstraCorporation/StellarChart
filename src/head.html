<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad Astra · Carta de Navegación Estelar</title>
<link rel="icon" href="../icons/favicon.png" type="image/png"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#060708">
<meta name="description" content="Simulador de rol espacial: carta estelar generativa e infinita por semillas, nave, tripulación, expediciones y eventos.">
<style>
:root{--bg:#060708;--panel:rgba(10,12,16,.86);--line:rgba(205,215,235,.16);--tx:#d6dce6;--dim:#6f7a8c;--cy:#78dcff;--amb:#e0aa46;--pet:#ff3b5c;--ok:#7ee787;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(14,18,26,.8);border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer;letter-spacing:.06em;transition:border-color .15s,background .15s,color .15s,transform .1s}
button:hover:not(:disabled){border-color:rgba(205,215,235,.5)}button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{border-color:var(--cy);color:var(--cy)}button.pri:hover:not(:disabled){background:rgba(120,220,255,.12)}
button.sm{padding:3px 8px;font-size:11px}
input,select,textarea{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:2px;padding:5px 8px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--cy)}
input[type=color]{padding:1px;height:28px;width:60px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ov{position:absolute;z-index:2}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
/* cabecera estilo carta */
#brand{left:18px;top:16px;max-width:330px}
#brand .aalogo{width:22px;height:22px;vertical-align:-5px;margin-right:6px;border-radius:50%}
.crewlogo{display:block;max-width:120px;max-height:56px;margin:8px 0 2px;object-fit:contain}
.pt img{width:100%;height:100%;object-fit:cover}
.dm{position:fixed;left:18px;top:220px;width:min(380px,92vw);max-height:55vh;z-index:8;background:rgba(8,10,14,.96);border:1px solid rgba(224,170,70,.6);display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dm.show{display:flex;animation:boxIn .2s ease}.dmh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);cursor:move;touch-action:none;font-size:11px;letter-spacing:.12em;color:var(--amb)}
.dmh span{display:flex;gap:4px}#dmL{overflow:auto;padding:6px 8px;font-size:11px;line-height:1.45}.dm.min #dmL{display:none}.dm.min{max-height:none}
.dmr{padding:2px 0;border-bottom:1px dashed rgba(205,215,235,.07);color:#cdd5e0}.dmr span{color:var(--dim)}.dm-ev{color:#ffd9a0}.dm-chat{color:#bfe8ff}.dm-cmd{color:#9fe8b0}
body.dual #drawerBtn{display:none}
@media(max-width:860px){#dualBtn{display:none}}
#brand .t1{display:block;font-size:15px;letter-spacing:.42em;color:#f2f5fb;text-decoration:none}#brand .t1:hover{color:var(--cy)}
#brand .t2{font-size:12px;letter-spacing:.08em;color:#c9d1dd;margin-top:2px}
#brand .t3{font-size:9px;letter-spacing:.24em;color:var(--dim);margin:3px 0 10px}
#seedForm{display:flex;gap:4px;margin-bottom:10px}
#seedIn{flex:1;text-transform:uppercase;letter-spacing:.14em;font-size:12px;width:190px}
#seedForm button{padding:4px 8px;font-size:11px}
.info{display:flex;flex-direction:column;gap:6px}
.info div{display:flex;flex-direction:column}.info span{font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}.info b{font-weight:400;font-size:13px;letter-spacing:.06em;color:#eef2f8}
#toggles{left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px}
#toggles button{font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:5px 12px;color:#8fa6c4;border-color:rgba(120,160,210,.35)}
#toggles button.on{color:#cfe6ff;border-color:rgba(160,200,255,.7);background:rgba(60,90,130,.25)}
#toggles button[data-o=pet].on{color:#ffd0d8;border-color:var(--pet);background:rgba(255,59,92,.18)}
#hud{right:18px;top:16px;width:200px;display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:right .3s ease}
#hud div{display:flex;flex-direction:column;text-align:right}
#hud span{font-size:9px;letter-spacing:.24em;color:var(--dim)}#hud b{font-weight:400;color:#eef2f8;font-size:12px}#hud em{font-style:normal;font-size:10px;color:var(--dim)}
.mt{display:block;height:3px;background:rgba(205,215,235,.12);margin:2px 0}.mt i{display:block;height:100%;transition:width .5s ease}
#views{left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:5px}
#views button{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;color:#c9d1dd;white-space:nowrap}#views button.on{border-color:var(--cy);color:var(--cy);background:rgba(120,220,255,.1)}
#foot{left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;letter-spacing:.24em;color:var(--dim);white-space:nowrap;pointer-events:none}
#foot em{color:var(--pet);font-style:normal;margin:0 6px}
#zoom{left:18px;bottom:28px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;height:32px;padding:0;font-size:15px}#zoom button.on{border-color:var(--cy);color:var(--cy)}
#ctr{right:18px;bottom:28px;font-size:10px;letter-spacing:.22em;padding:8px 14px;color:var(--cy);border-color:var(--cy);transition:right .3s ease}
#drawerBtn{right:18px;bottom:72px;font-size:10px;letter-spacing:.22em;padding:8px 14px;transition:right .3s ease}#drawerBtn.on{border-color:var(--amb);color:var(--amb)}
#backBtn{left:50%;top:50px;transform:translateX(-50%);display:none;font-size:10px;letter-spacing:.22em;padding:6px 14px}
#banner{left:62px;bottom:62px;color:var(--bad);font-size:10px;letter-spacing:.2em;display:none}#crTag{left:62px;bottom:46px;color:var(--amb);font-size:10px;letter-spacing:.2em;display:none}
#tip{pointer-events:none;background:rgba(6,8,12,.92);border:1px solid var(--line);padding:5px 9px;font-size:11px;display:none;white-space:nowrap}
#toast{left:50%;top:84px;transform:translateX(-50%);background:rgba(8,10,14,.94);border:1px solid rgba(120,220,255,.5);padding:8px 14px;display:none;max-width:min(560px,86%);z-index:4;text-align:center}
#toast.show{display:block;animation:boxIn .25s ease}#toast button{margin-left:8px}
#travel{left:50%;bottom:84px;transform:translateX(-50%);width:min(620px,80%);display:none;z-index:4;text-align:center}
#travel.show{display:block;animation:fadeIn .3s}
#travel .tl{font-size:10px;letter-spacing:.16em;color:#ffd0d8;margin-bottom:5px;text-shadow:0 0 8px #000}
#travel .tb{height:2px;background:rgba(255,255,255,.12)}#travel .tb i{display:block;height:100%;width:0;background:var(--pet)}
/* panel de mando (cajón) */
#drawer{position:absolute;right:0;top:0;bottom:0;width:390px;max-width:100%;z-index:5;background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s ease}
#drawer.open{transform:none}
@media(min-width:861px){#app:has(#drawer.open) #stage{right:390px}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding-left:9px!important;padding-right:9px!important;border:0;border-radius:0;background:none;padding:11px 2px;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:#fff;box-shadow:inset 0 -1px #fff}
#drawerX{flex:none!important;order:99;color:var(--tx)!important;font-size:13px!important;position:sticky;right:0;background:rgba(10,12,16,.95)!important;border-left:1px solid var(--line)!important}
.pane{display:none;padding:14px;overflow:auto;flex:1}.pane.on{display:block;animation:paneIn .28s ease both}
.kick{font-size:9px;letter-spacing:.28em;color:var(--dim);margin-bottom:2px}
h2{margin:0 0 6px;font-size:16px;font-weight:500;letter-spacing:.06em;color:#fff}
h3{margin:16px 0 6px;font-size:9px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-weight:400;border-top:1px solid var(--line);padding-top:10px}
.seed{letter-spacing:.14em;color:var(--amb);word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:6px 0}.kv span:nth-child(odd){color:var(--dim)}
.calc{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;border:1px solid var(--line);padding:9px;background:rgba(0,0,0,.35);margin:6px 0}.calc span:nth-child(odd){color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.lst{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:6px 8px;background:rgba(0,0,0,.25);transition:border-color .15s,transform .15s}
.item[data-a]{cursor:pointer}.item[data-a]:hover,.rowi:hover{border-color:rgba(205,215,235,.45)}
.item.col{flex-direction:column;align-items:stretch}.item.sel{border-color:var(--cy)}
.rowi{display:flex;gap:8px;align-items:center;cursor:pointer}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .m i{font-style:normal;color:var(--dim);font-size:11px;display:block}
.item.err{border-color:rgba(255,107,107,.6)}.item.pend{opacity:.5}.item.done b{color:var(--ok)}.item.cur{border-color:var(--amb)}.item.lock{opacity:.4}
.fav{color:var(--dim);background:none;border:0;padding:0 4px;font-size:15px}.fav.on{color:var(--amb)}
.note{color:var(--dim);font-size:11px;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.tag{display:inline-block;border:1px solid var(--line);padding:0 7px;font-size:10px;color:#c9d1dd;letter-spacing:.06em;margin:0 3px 3px 0}
.tag.pet{border-color:var(--pet);color:#ffb3c0}.tag.fx{border-color:var(--amb);color:var(--amb)}.tag.hz{border-color:var(--ok);color:var(--ok)}
.hzl{margin:4px 0}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:6px 0;cursor:pointer}
.res{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.res span:last-child{color:var(--dim)}
.scale-row{display:grid;grid-template-columns:120px 1fr 64px;gap:6px;align-items:center;font-size:11px;margin:3px 0}.scale-row span:last-child{text-align:right;color:var(--dim)}
.scale-row i{display:block;height:6px;background:rgba(205,215,235,.3)}.scale-row.me i{background:var(--cy)}.scale-row.me span{color:var(--cy)}
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ships button{padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;letter-spacing:.04em}.ships button.on{border-color:var(--cy);color:var(--cy)}
.field{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:5px 0}.field label{color:var(--dim);font-size:11px}
#shipPrev{width:100%;height:180px;display:block;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 80%,#141b28,#05070a 70%);cursor:grab;touch-action:none}
.card{border:1px solid var(--line);padding:10px;margin:8px 0;background:rgba(0,0,0,.25)}
.dh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pt{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);font-size:22px;background:rgba(255,255,255,.04);flex:none}
.stats{display:grid;grid-template-columns:86px 1fr 18px;gap:3px 6px;align-items:center;font-size:11px;margin-top:8px}.stats span:first-child{color:var(--dim)}
.sb{display:block;height:4px;background:rgba(205,215,235,.12)}.sb i{display:block;height:100%;background:#cfd6e2}.stats b{font-weight:400;text-align:right}
textarea{width:100%;height:64px;resize:vertical;font-size:10px}
a.btn{display:inline-block;border:1px solid var(--line);padding:4px 10px;text-decoration:none;color:inherit;font-size:11px;letter-spacing:.06em}a.btn.pri{border-color:var(--cy);color:var(--cy)}
select{background:rgba(0,0,0,.5);border:1px solid var(--line);color:inherit;padding:4px}
.story{white-space:pre-line}
#qrBox{background:#fff;padding:10px;display:inline-block;line-height:0}
/* diálogos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px;animation:fadeIn .2s}
#modal .box{background:rgba(10,12,16,.97);border:1px solid rgba(205,215,235,.35);padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:boxIn .25s ease}
.story{font-size:13px;line-height:1.6;color:#e6eaf1}.roll{font-size:11px;color:var(--amb);border-left:2px solid var(--amb);padding-left:8px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}.opts button{text-align:left;padding:8px 10px}
/* arranque */
#boot{position:fixed;inset:0;z-index:20;background:#060708;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .6s ease,visibility .6s}
#boot.out{opacity:0;visibility:hidden}
#boot .bx{border:1px solid rgba(205,215,235,.3);border-top-color:transparent;padding:36px 48px;text-align:center;position:relative}
#boot .bx::before{content:"";position:absolute;left:12px;right:0;top:0;height:1px;background:rgba(205,215,235,.3)}
#boot .bt{letter-spacing:.34em;color:#e6eaf1;font-size:12px}#boot .bs{letter-spacing:.22em;color:var(--dim);font-size:9px;margin-top:22px}
#boot .bl{width:240px;height:1px;background:rgba(205,215,235,.15);overflow:hidden;margin:22px auto 0}#boot .bl i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes boxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:861px) and (max-width:1250px){#app:has(#drawer.open) #foot{display:none}}
@media(max-width:380px){#brand .t1{letter-spacing:.24em}#seedIn{width:96px}#toggles button{padding:3px 5px}#hud{width:120px}}
@media(max-width:860px){
  #brand{left:10px;top:10px;max-width:58%}#brand .t2,#brand .t3{display:none}#seedIn{width:120px}
  .info{flex-direction:row;flex-wrap:wrap;gap:4px 12px}.info div:nth-child(n+3){display:none}
  #toggles{left:10px;top:112px;transform:none;max-width:calc(100% - 150px);flex-wrap:wrap}#toggles button{padding:3px 7px;letter-spacing:.08em;font-size:9px}
  #hud{right:10px;top:10px;width:140px;gap:4px}#hud div:nth-child(n+4){display:none}
  #views{left:0;right:0;transform:none;bottom:max(8px,env(safe-area-inset-bottom));padding:0 10px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  #views::-webkit-scrollbar{display:none}#views button{flex:none;padding:7px 9px;letter-spacing:.06em;font-size:9px}#foot{display:none}
  #zoom{left:10px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);flex-direction:row}#zoom button{width:34px;height:34px}
  #ctr{right:10px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);padding:8px 10px;letter-spacing:.12em}
  #drawerBtn{right:112px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 40px);padding:8px 10px;letter-spacing:.12em}
  #travel{bottom:96px;width:94%}#travel .tl{font-size:9px;letter-spacing:.06em}
  #toast{top:150px;max-width:94%}#banner{left:10px;bottom:132px}#crTag{left:10px;bottom:118px}
  .calc,.kv{grid-template-columns:minmax(90px,auto) 1fr}
  #modal{padding:8px}#modal .box{padding:14px;max-height:94dvh}
  #drawer{top:auto;height:64dvh;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
}

/* Inicio y espera de tripulación */
#inicio{position:fixed;inset:0;z-index:15;background:rgba(5,7,10,.88);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 14px;transition:opacity .35s}
#inicio.out{opacity:0}
#inicio .ini-box{width:min(480px,100%);background:rgba(10,12,16,.97);border:1px solid rgba(205,215,235,.3);padding:18px;animation:boxIn .3s ease}
#inicio .ini-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}#inicio .ini-h img{width:46px;height:46px;object-fit:contain}
#inicio .ini-h h2{margin:2px 0 0}#inicio .card{margin:8px 0}#inicio .chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
#inicio .ini-sel{border-color:rgba(224,170,70,.55)}#inicio a{color:#78dcff}
#espera{left:50%;bottom:128px;transform:translateX(-50%);width:min(540px,92%);background:rgba(8,10,14,.94);border:1px solid rgba(224,170,70,.6);padding:10px 14px;display:flex;flex-direction:column;gap:4px;text-align:center;z-index:6}
#espera .row{justify-content:center}#espera[hidden]{display:none}
@media(max-width:860px){#espera{bottom:150px}}
</style>
</head>
<body>
<div id="boot"><div class="bx"><div class="bt">INICIALIZANDO CATÁLOGO ESTELAR</div><div class="bl"><i></i></div><div class="bs">GENERADOR DETERMINISTA · CIELO COMPLETO</div></div></div>
<div id="app">
<section id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="brand">
    <a class="t1" href="../" title="Volver al menú"><img src="../icons/logo.png" alt="" class="aalogo"> AD ASTRA</a><img id="crewLogo" class="crewlogo" alt="" hidden><div class="t2">Carta de navegación estelar</div><div class="t3">SEMILLAS · ECL J2000 · SOL-CENTRADA</div>
    <form id="seedForm" autocomplete="off"><input id="seedIn" placeholder="A-DD5PN" spellcheck="false" maxlength="48" aria-label="Semilla"><button class="pri" type="submit">IR</button><button type="button" id="rndBtn" title="Lugar aleatorio">⚄</button></form>
    <div class="info" id="info"></div>
  </div>
  <div class="ov" id="toggles"><button data-o="nav">◇ Navegación</button><button data-o="color">◇ Color</button><button data-o="pet">✦ Petrova</button><button data-o="fac">⬡ Facciones</button></div>
  <div class="ov" id="hud"></div>
  <button class="ov" id="backBtn">⤒ VOLVER</button>
  <div class="ov" id="toast"></div>
  <div class="ov" id="travel"><div class="tl" id="trTxt"></div><div class="tb"><i id="trBar"></i></div></div>
  <div class="ov" id="views"><button data-v="sol">Sistema Solar</button><button data-v="traj">Trayectoria</button><button data-v="tau">Tau Ceti</button><button data-v="gal">Galáctica</button><button data-v="here" title="Fijar destino en el centro de la carta">⌖ Destino</button><button data-v="pilot" id="pilotBtn" title="Pilotaje libre (F)">✈ Pilotar</button><button id="logBtn" title="Registro de la partida">📜 Registro</button><button id="dualBtn" title="Mapa en esta ventana, panel en otra">🖥 Doble pantalla</button></div>
  <div class="ov" id="zoom"><button data-z="-1" title="Acercar">+</button><button data-z="1" title="Alejar">−</button><button id="spinBtn" title="Rotación automática">⟳</button></div>
  <button class="ov" id="drawerBtn">☰ MANDO</button>
  <button class="ov" id="ctr">◎ MI NAVE</button>
  <div class="ov" id="foot">ARRASTRA ORBITAR · RUEDA ZOOM · WASD VOLAR · F PILOTAR LA NAVE<em>/</em>AD ASTRA CORPORATION</div>
  <div class="ov" id="banner">SIN REGISTRO</div><div class="ov" id="crTag">MODO CREATIVO</div>
  <div class="ov" id="tip"></div>
</section>
